<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GSOC Operator Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: console shell. Plan rail on the left, one working surface on the right. Each SOP runs as a six-step module.
   Dark by design, to match the GSOC TRN module set. Brand: Specialized Brand Guidelines v1.0.
   Termina, PP Mori and General Sans load first where installed on team PCs; Archivo and Public Sans stand in elsewhere. */
:root{
  color-scheme:dark;
  --prism:#512FFF; --prism-dark:#3F1DF8; --prism-deep:#190935; --frost:#E8EAEF; --shark:#92989B; --black:#000;
  --ink:#05060A; --panel:#0D0F16; --panel-2:#141723; --panel-3:#1C2030; --line:#262A36; --line-soft:#181B24;
  --prism-soft:rgba(81,47,255,.14); --prism-line:#3A2F8A; --prism-lift:#A592FF;
  --good:#4FB286; --good-soft:rgba(79,178,134,.12); --bad:#E06464; --bad-soft:rgba(224,100,100,.11); --amber:#E0A93B; --amber-soft:rgba(224,169,59,.1); --sbar:#C0332B;
  --display:'Termina','Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --sub:'PP Mori','Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --sans:'General Sans','Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ink);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--ink);color:var(--frost);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
a{color:var(--prism-lift)}
:focus-visible{outline:2px solid var(--prism-lift);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* brand devices */
.wm{display:block;color:#fff;line-height:0}.wm svg{display:block;height:11px;width:auto}
.smk{display:block;color:var(--prism);line-height:0}.smk svg{display:block;height:20px;width:auto}
.cropmark svg{display:block;width:100%;height:auto}
.cropmark{position:fixed;right:-70px;bottom:-60px;width:260px;height:auto;color:var(--prism);opacity:.06;pointer-events:none;z-index:0}
.brandbar{display:flex;height:3px;border-radius:2px;overflow:hidden;max-width:220px;margin:0 0 14px}
.brandbar i{display:block;height:3px}
.brandbar i:nth-child(1){width:14%;background:#000;border-top:1px solid var(--line)}
.brandbar i:nth-child(2){width:26%;background:var(--frost)}
.brandbar i:nth-child(3){width:60%;background:var(--prism)}

/* chrome */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:14px;padding-block:11px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));background:rgba(5,6,10,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(9px)}
.brandlink{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.docid{font-family:var(--mono);font-size:10.5px;color:var(--shark);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.savepill{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--shark);white-space:nowrap}
.savepill .dot{width:7px;height:7px;border-radius:50%;background:var(--shark)}
.savepill.db .dot{background:var(--good)}
.savepill.local .dot{background:var(--amber)}
.savepill.busy .dot{background:var(--prism-lift);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.menubtn{display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.progtrack{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.progtrack i{display:block;height:2px;width:0;background:linear-gradient(90deg,var(--prism-deep),var(--prism));transition:width .4s}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 46px);position:relative;z-index:1}
.rail{border-right:1px solid var(--line);padding:14px 0 80px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);height:calc(100vh - 46px);overflow:auto;background:var(--ink)}
.rg{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--prism-lift);padding:16px 18px 6px;border-top:1px solid var(--line-soft);margin-top:6px}
.rg:first-child{border-top:0;margin-top:0;padding-top:4px}
.ni{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:var(--shark);font-size:13px;padding:6px 18px;cursor:pointer;line-height:1.35;text-decoration:none}
.ni:hover{color:var(--frost);background:var(--panel)}
.ni.on{color:var(--frost);border-left-color:var(--prism);background:var(--prism-soft)}
.ni .n{font-family:var(--mono);font-size:10px;color:var(--prism-lift);min-width:22px;flex:0 0 auto}
.ni .ck{margin-left:auto;font-family:var(--mono);font-size:10px;flex:0 0 auto}
.ni.sub{padding-left:42px;font-size:12.5px}
.ck.ok{color:var(--good)} .ck.lo{color:var(--amber)} .ck.ip{color:var(--prism-lift)}
main{padding-block:28px 120px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));max-width:960px;min-width:0;position:relative;z-index:1}
.notice{border:1px dashed #5A4620;background:var(--amber-soft);color:#F0D9A8;border-radius:6px;padding:10px 14px;font-size:13.5px;margin:0 0 18px}
.notice b{color:#FFE7B5}

/* type */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--prism-lift);margin:0 0 10px}
h1{font-family:var(--display);font-stretch:125%;font-size:clamp(24px,4vw,36px);line-height:1.08;margin:0 0 12px;text-transform:uppercase;letter-spacing:.01em;font-weight:700;text-wrap:balance}
h2{font-family:var(--display);font-stretch:118%;font-size:14.5px;margin:34px 0 12px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;padding-top:14px;border-top:1px solid var(--line);text-wrap:balance}
h3{font-family:var(--sub);font-size:12px;margin:0 0 8px;letter-spacing:.14em;text-transform:uppercase;color:var(--shark);font-weight:600}
.subline{font-family:var(--sub);font-size:16px;line-height:1.5;margin:0 0 18px;max-width:64ch}
p{margin:0 0 12px;max-width:68ch}
ul,ol{margin:0 0 12px;padding-left:22px;max-width:70ch}
li{margin:0 0 7px}
b,strong{font-weight:600}
.muted{color:var(--shark)} .small{font-size:13px} .mono{font-family:var(--mono);font-size:12px}
.good{color:#A8DFC6} .risk{color:#F2B9B9} .warn{color:#F0D9A8}
.sop{font-family:var(--mono);font-size:11px;color:var(--frost);background:var(--panel-2);border:1px solid var(--line);padding:1px 7px;border-radius:3px;white-space:nowrap;text-decoration:none}
a.sop:hover{border-color:var(--prism)}
.confirm{font-family:var(--mono);font-size:11px;color:var(--amber);background:var(--amber-soft);border:1px dashed #5A4620;padding:1px 6px;border-radius:3px;white-space:nowrap}
.lv{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;border-radius:3px;white-space:nowrap;line-height:1.6;border:1px solid transparent}
.lv.l1{border-color:var(--shark);color:var(--frost)}
.lv.l2{border-color:var(--frost);color:var(--frost);background:rgba(232,234,239,.08)}
.lv.l3{background:var(--prism);border-color:var(--prism);color:#fff}
.lv.l4{border-color:var(--prism-lift);color:var(--prism-lift);background:var(--prism-soft)}
.lv.l5{background:var(--sbar);border-color:var(--sbar);color:#fff}
.lv.l6{background:linear-gradient(110deg,#000 0%,var(--prism-deep) 42%,var(--prism) 100%);border-color:var(--prism-lift);color:#fff}

/* blocks */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:0 0 16px;min-width:0}
.takeaway{background:linear-gradient(180deg,rgba(81,47,255,.12),rgba(81,47,255,.02));border-color:var(--prism-line)}
.ctrl{border:1px solid var(--prism-line);border-left:3px solid var(--prism);border-radius:5px;background:linear-gradient(180deg,rgba(81,47,255,.09),rgba(81,47,255,.015));padding:12px 16px;margin:0 0 12px}
.ctrl .lab{font-family:var(--display);font-stretch:125%;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--prism-lift);display:block;margin-bottom:4px;font-weight:600}
.ctrl p{margin:0;font-size:14.5px}
.ctrl.red{border-color:#5A2420;border-left-color:var(--sbar);background:linear-gradient(180deg,rgba(192,51,43,.13),rgba(192,51,43,.02))}
.ctrl.red .lab{color:#F09A94}
.ctrl.amber{border-color:#5A4620;border-left-color:var(--amber);background:var(--amber-soft)}
.ctrl.amber .lab{color:var(--amber)}
.tw{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--shark);font-weight:400;background:var(--panel)}
tbody tr:nth-child(even){background:rgba(232,234,239,.022)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--prism);color:#fff;border:1px solid var(--prism);border-radius:4px;font-family:var(--display);font-stretch:118%;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:11px 16px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:#6444FF}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--frost)}
.btn.ghost:hover{border-color:var(--prism);background:var(--prism-soft)}
.btn.sm{padding:7px 11px;font-size:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:4px;color:var(--frost);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--shark);white-space:nowrap}
.pill.ok{border-color:#2B5545;color:#A8DFC6;background:var(--good-soft)}
.pill.lo{border-color:#5A4620;color:#F0D9A8;background:var(--amber-soft)}
.pill.ip{border-color:var(--prism-line);color:var(--prism-lift);background:var(--prism-soft)}
.pill.crit{border-color:#5A2420;color:#F09A94}
.docstrip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:44px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--shark)}
.docstrip span:last-child{margin-left:auto}

/* home */
.banner{display:block;width:100%;height:auto;aspect-ratio:1127/191;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin:0 0 22px;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 18px}
.stat{background:var(--panel);padding:14px 14px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-stretch:125%;font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat>span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--shark);margin-top:8px}
.issued{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--shark);margin-bottom:5px}
.field input,.field select,textarea{width:100%;background:#020306;border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:14px;color:var(--frost)}
.field input:focus,.field select:focus,textarea:focus{outline:2px solid var(--prism);outline-offset:0;border-color:var(--prism)}
.field .ro{padding:9px 0;font-size:14px}
.next{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.next .t{font-family:var(--display);font-stretch:118%;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;line-height:1.25}
.weekhead{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
.weekhead h2{margin:0;padding:0;border:0}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.day{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 15px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,background .15s}
.day:hover{border-color:var(--prism);background:var(--panel-2)}
.day .dn{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--prism-lift)}
.day .dt{font-family:var(--display);font-stretch:112%;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em;line-height:1.3}
.day .mods{display:flex;flex-wrap:wrap;gap:5px}
.mc{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--frost);background:var(--panel-2)}
.mc i{width:6px;height:6px;border-radius:50%;background:var(--panel-3);border:1px solid var(--shark)}
.mc.ip i{background:var(--prism-lift);border-color:var(--prism-lift)}
.mc.ok i{background:var(--good);border-color:var(--good)}
.mc.lo i{background:var(--amber);border-color:var(--amber)}
.bar{height:4px;border-radius:2px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:4px;background:var(--prism);border-radius:2px}
.bar.ok i{background:var(--good)}
details.fold{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin:0 0 10px}
details.fold summary{cursor:pointer;padding:12px 16px;font-family:var(--display);font-stretch:112%;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold summary::after{content:"+";font-family:var(--mono);color:var(--prism-lift)}
details.fold[open] summary::after{content:"\2212"}
details.fold .in{padding:0 16px 14px}

/* day + module launch */
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px 15px}
.mrow .mt{font-family:var(--display);font-stretch:112%;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.03em;line-height:1.3}
.mrow .mm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.blk{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.blk:last-child{border-bottom:0}
.blk .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--prism-lift);padding-top:3px}
.signed{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* module player */
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.score{font-family:var(--display);font-stretch:125%;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:18px 0 22px}
.step{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.step .sb{height:4px;border-radius:2px;background:var(--panel-3)}
.step.done .sb{background:var(--good)}
.step.on .sb{background:var(--prism)}
.step .sl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--shark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on .sl{color:var(--frost)}
.step.done .sl::before{content:"\2713  ";color:var(--good)}
.panel{min-height:200px}
.numl{counter-reset:n;list-style:none;padding:0}
.numl li{counter-increment:n;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);margin:0}
.numl li::before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--prism-lift);padding-top:3px}
.numl li:last-child{border-bottom:0}

/* reveal cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.flip{position:relative;display:grid;min-height:170px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0;cursor:pointer;text-align:left;perspective:900px;color:inherit}
.flip .face{grid-area:1/1;position:relative;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s ease}
.flip .front{background:var(--panel)}
.flip .back{background:linear-gradient(160deg,var(--prism-deep),#0D0F16 75%);transform:rotateY(180deg);border:1px solid var(--prism-line)}
.flip.open .front{transform:rotateY(-180deg)}
.flip.open .back{transform:rotateY(0)}
.flip .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--prism-lift)}
.flip .q{font-family:var(--sub);font-weight:600;font-size:15px;line-height:1.4}
.flip .a{font-size:14px;line-height:1.5}
.flip .hint{margin-top:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--shark)}
.flip.seen{border-color:var(--prism-line)}

/* drag and drop */
.tray{border:1px dashed var(--line);border-radius:6px;padding:12px;background:var(--panel);margin:0 0 12px}
.trayh{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--shark);display:flex;justify-content:space-between;gap:10px}
.cards{display:flex;flex-wrap:wrap;gap:8px;padding-top:9px;min-height:44px}
.dc{display:inline-grid;grid-template-columns:6px minmax(0,1fr);column-gap:9px;row-gap:4px;align-items:start;max-width:100%;text-align:left;border-radius:5px;padding:9px 12px;font-size:13.5px;line-height:1.35;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid var(--line);background:var(--panel-3);color:var(--frost)}
.dc::before{content:"";grid-row:1/span 2;width:6px;height:13px;margin-top:3px;background:radial-gradient(circle,currentColor 1px,transparent 1.4px) 0 0/3px 4px;opacity:.5}
.dc.sel{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--prism-lift)}
.dc.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.dc.no{border-color:var(--bad);background:var(--bad-soft)}
.dc.lifting{opacity:.3}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bk{border:1px dashed var(--line);border-radius:6px;background:var(--panel);padding:10px;min-height:96px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s}
.bk .bh{font-family:var(--display);font-stretch:112%;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--prism-lift)}
.bk .cards{padding-top:0;min-height:30px;flex-direction:column;flex-wrap:nowrap}
.bk .dc{width:100%}
.armed .bk,.armed .tray{border-color:var(--prism-lift);cursor:pointer}
.over{border-color:var(--prism-lift)!important;box-shadow:0 0 0 2px var(--prism-lift),0 0 26px rgba(81,47,255,.35)!important}
.dragghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;opacity:.95;box-shadow:0 14px 32px rgba(0,0,0,.55);margin:0;max-width:320px}
.why{font-size:12.5px;margin:4px 0 0;padding-left:15px}
.dc .why{grid-column:2;padding-left:0;margin:0}
.olist{list-style:none;padding:0;margin:0 0 12px;max-width:none}
.oi{display:grid;grid-template-columns:28px 22px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:9px 10px;margin:0 0 7px;touch-action:none}
.oi .pos{font-family:var(--mono);font-size:11px;color:var(--prism-lift);text-align:center}
.oi .hd{cursor:grab;width:12px;height:18px;background:radial-gradient(circle,var(--shark) 1.1px,transparent 1.5px) 0 0/6px 6px;justify-self:center}
.oi .tx{font-size:14px;min-width:0}
.oi .ar{display:flex;gap:4px}
.oi .ar button{background:transparent;border:1px solid var(--line);width:28px;height:28px;border-radius:3px;cursor:pointer;color:var(--frost)}
.oi .ar button:hover{border-color:var(--prism)}
.oi.ok{border-color:var(--good);background:var(--good-soft)}
.oi.no{border-color:var(--bad);background:var(--bad-soft)}
.oi.lifting{opacity:.25}
.oi.ph{border-style:dashed;border-color:var(--prism-lift);background:var(--prism-soft)}

/* scenario */
.feed{background:#020306;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 16px}
.feedh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--shark)}
.fr{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:10px 14px;border-bottom:1px solid #101219;font-size:14px}
.fr:last-child{border-bottom:0}
.fr .t{font-family:var(--mono);font-size:11.5px;color:var(--amber);font-variant-numeric:tabular-nums;padding-top:2px}
.fr.ch .t{color:var(--prism-lift)}
.fr.r2{background:rgba(79,178,134,.06)} .fr.r2 .t{color:var(--good)}
.fr.r1{background:rgba(224,169,59,.06)}
.fr.r0{background:rgba(224,100,100,.07)} .fr.r0 .t{color:var(--bad)}
.fr.now{background:rgba(81,47,255,.08)}
.enter{animation:rise .3s ease}
@keyframes rise{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.q{font-family:var(--sub);font-weight:600;font-size:15.5px;margin:2px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--prism);background:var(--panel-3)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--prism-lift);padding-top:2px;min-width:16px;flex:0 0 auto}
.opt .ot{min-width:0;flex:1}
.opt.sel{border-color:var(--prism);background:var(--prism-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.part{border-color:var(--amber);background:var(--amber-soft)}
.opt:disabled{cursor:default}
.opt .ex{display:block;font-size:13px;color:var(--frost);opacity:.9;margin-top:6px}
.opt .tagr{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
.verdict{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.vt{font-family:var(--display);font-stretch:118%;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:18px;height:6px;border-radius:2px;background:var(--panel-3);border:1px solid var(--line)}
.pip.cur{border-color:var(--prism-lift);background:var(--prism-soft)}
.pip.ok{background:var(--good);border-color:var(--good)}
.pip.no{background:var(--bad);border-color:var(--bad)}
.explore{display:grid;gap:6px;margin:10px 0 0}
.exrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;font-size:13px}
.exrow .t{font-family:var(--mono);font-size:11px;color:var(--shark)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--shark)}
.dots span.r2{border-color:var(--good);color:#A8DFC6}
.dots span.r1{border-color:var(--amber);color:#F0D9A8}
.dots span.r0{border-color:var(--bad);color:#F2B9B9}

/* lab + tests */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.lc{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 16px;text-decoration:none;color:inherit;min-width:0}
.lc:hover{border-color:var(--prism)}
.lc .lt{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.tq{border-bottom:1px solid var(--line-soft);padding:16px 0}
.tq:last-child{border-bottom:0}
.tqh{font-family:var(--mono);font-size:10.5px;color:var(--shark);margin:0 0 6px;letter-spacing:.06em}
.result{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.meter{height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.meter i{display:block;height:6px}

/* record + trainer */
.rowbtn{background:none;border:0;padding:0;color:var(--frost);cursor:pointer;text-align:left;font:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.rowbtn:hover{text-decoration-color:var(--prism-lift)}
.log{font-size:13px}
.log td{padding:7px 10px}
.empty{border:1px dashed var(--line);border-radius:6px;padding:20px;color:var(--shark);text-align:center;font-size:14px}
.ref{border:1px solid var(--prism-line);background:rgba(81,47,255,.07);border-radius:5px;padding:10px 12px;margin:10px 0 0}
.rlab{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--prism-lift);margin:0 0 5px}
.rl{display:grid;gap:3px;margin:0 0 6px}.rl:last-child{margin:0}
.rp{font-family:var(--mono);font-size:11.5px;color:var(--frost);font-weight:500}
.rq{font-size:13px;color:#C9CCD4;font-style:italic}
.miss{border:1px solid #5A2420;background:rgba(224,100,100,.06);border-radius:6px;padding:14px 16px;margin:14px 0 0}
.mblk{margin:10px 0 0}.mblk p{margin:0 0 6px;font-size:14px}
.mblk p.good b{color:#A8DFC6}.fg{color:var(--frost)}
.risk .rlab,.miss>.mblk:first-of-type .rlab{color:#F2B9B9}
.dc .why.risk{color:#F2B9B9}.dc .rsm{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--prism-lift);line-height:1.4}
.oi .rsm{display:block;font-family:var(--mono);font-size:10.5px;color:var(--prism-lift);margin-top:3px}
.fr .ref{margin-top:8px}
.startcard{max-width:620px}
.lockrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.lockrow{grid-template-columns:minmax(0,1fr)}}
/* end-of-day assessment */
.actx{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:5px;background:#020306;padding:10px 14px;margin:6px 0 12px;font-size:14px}
.actx p{margin:0 0 6px}.actx p:last-child{margin:0}
.aquote{border-left:3px solid var(--prism);background:var(--prism-soft);border-radius:4px;padding:10px 14px;margin:6px 0 12px;font-family:var(--sub);font-size:15px;line-height:1.45}
.aquote .rlab{margin-bottom:3px}
details.mq{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin:0 0 8px}
details.mq summary{cursor:pointer;padding:11px 14px;list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
details.mq summary::-webkit-details-marker{display:none}
details.mq[open] summary{border-bottom:1px solid var(--line-soft)}
details.mq .in{padding:4px 14px 14px}
details.mq summary .tqh{margin:0 0 3px}
.mqs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.day.locked{opacity:.6}
.ck.lk{color:var(--shark)}
.lk svg{vertical-align:-1px}
.srcl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--prism-lift);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-3);border:1px solid var(--prism-line);color:var(--frost);padding:10px 16px;border-radius:6px;font-size:13.5px;z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:0;bottom:0;width:min(320px,86vw);height:auto;z-index:45;transform:translateX(-102%);transition:transform .25s;box-shadow:20px 0 40px rgba(0,0,0,.5);padding-left:env(safe-area-inset-left,0px)}
  body.menu .rail{transform:none}
  .menubtn{display:inline-block}
  .docid{display:none}
  main{padding-block:22px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cropmark{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .stat:last-child{grid-column:1/-1}
  .issued{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .stepper{grid-template-columns:repeat(3,minmax(0,1fr))}
  .blk{grid-template-columns:minmax(0,1fr);gap:4px}
  .mrow{grid-template-columns:minmax(0,1fr)}
  .fr{grid-template-columns:52px minmax(0,1fr);font-size:13.5px}
  .oi{grid-template-columns:22px 16px minmax(0,1fr);}
  .oi .ar{grid-column:1/-1;justify-content:flex-end}
  .savepill .txt{display:none}
  .issued{grid-template-columns:minmax(0,1fr)}
}

MOD({
  id: "002", title: "Operator Hiring, Onboarding and Certification", part: "Part B · Foundation", day: 1, mins: 30, comp: "Foundations",
  purpose: "How you become, and stay, authorized to sit a live console. Certification is what makes the rest of this manual enforceable.",
  ln: [
    { h: "What it means for you", l: [
      "<b>No system access of any kind</b> until your screening is complete and recorded. That includes the training environment.",
      "<b>Your credentials are yours alone,</b> issued at least privilege for the role. You sign an acknowledgement that you've read and understood this manual.",
      "<b>The path to certification.</b> Core curriculum under {s017}, a written test on procedure and escalation levels, a practical scenario set with at least one life-safety and one degraded-operations scenario, then supervised probation with a certified mentor.",
      "<b>Who signs off.</b> Learning and Development recommends you. The GSOC Supervisor approves. It's recorded with a date, a scope and an expiry.",
      "<b>As a trainee</b> you don't acknowledge, handle or close any alarm, escort or tour before supervised probation. Anything landing at your position goes to your mentor or the nearest certified operator, and that handover gets recorded.",
      "<b>Recertification</b> runs on a fixed cycle, and out of cycle after a procedure change, a platform change or a long absence from the console.",
      "<b>QA findings</b> that point to a gap get you retrained and reassessed on that competency only." ] },
    { h: "Decertified, same shift, for", l: ["A critical control deviation.", "Falsifying a record.", "Failing a reassessment.", "Coming back takes GSOC leadership approval and a written remediation plan."] },
    { h: "Know this", l: ["The target is 100 percent of console hours worked by certified operators. Anything less is a control failure, not a trend.", "Certification is recorded in the register with its expiry. Know yours."] }
  ],
  ct: ["Certification is per platform and per program. Being certified on one program doesn't certify you on another. The difference gets trained and assessed before you're assigned."],
  op: "Probation length, recertification interval and absence threshold are [CONFIRM].",
  rv: [
    ["Can you log in to the training environment before screening is recorded?", "No. No system access of any kind until screening is complete and recorded, training environment included."],
    ["An alarm lands at your position while you're a trainee.", "It goes to your mentor or the nearest certified operator, and that handover gets recorded. You don't acknowledge, handle or close it."],
    ["Who recommends certification, and who approves it?", "Learning and Development recommends. The GSOC Supervisor approves."],
    ["A QA finding shows a gap in your dispatch briefs.", "You're retrained and reassessed on that competency only."],
    ["What's the target for certified console hours?", "100 percent. Anything less is a control failure, not a trend."]
  ],
  dr: { k: "order", p: "Put the path to certification in order.", i: [
    ["Screening complete and recorded", "Nothing starts before this, system access included."],
    ["Credentials issued at least privilege", "Yours alone."],
    ["Core curriculum under SOP-017", "The eight core modules, plus Part G where alarms are in scope."],
    ["Written test on procedure and escalation levels", "Assessed by written test."],
    ["Practical scenario set", "At least one life-safety and one degraded-operations scenario."],
    ["Supervised probation with a certified mentor", "Length is [CONFIRM]."],
    ["L&D recommends, GSOC Supervisor approves", "Recorded with a date, scope and expiry."] ] },
  sc: { title: "One night on another program", brief: "You're certified on a retail program. Friday night, two operators call out on a logistics program running on the same LVT platform.", start: "a", beats: {
    a: { t: "1840", s: "The shift lead asks you to cover two of the logistics consoles tonight. Same platform, same floor, same manual.", q: "What do you say?", o: [
      { t: "Yes. It's the same platform, so you're covered.", r: 0, f: "Certification is per platform and per program. The program difference has to be trained and assessed before you're assigned.", n: "b" },
      { t: "Decline, explain that you're not certified on that program, and let the Supervisor solve the gap.", r: 2, f: "Right. A console left unassigned by short staffing is the Supervisor's to solve. Saying no gives them an accurate picture.", n: "b" },
      { t: "Agree, and read the logistics Annex in quiet moments.", r: 0, f: "Reading on shift isn't training or assessment. The things that would catch you out are the ones you wouldn't know to look up.", n: "b" } ] },
    b: { t: "2210", s: "A colleague on your floor mentions they backdated an entry last week to make a timeline look cleaner. Nobody noticed.", q: "What does the manual say happens to falsifying a record?", o: [
      { t: "Decertification the same shift, and coming back needs GSOC leadership approval and a written remediation plan.", r: 2, f: "Right. Falsifying a record is one of the three same-shift decertification triggers.", n: null },
      { t: "A coaching note at the next review.", r: 0, f: "Falsification isn't treated as a training matter. It's same-shift decertification.", n: null },
      { t: "Nothing, as long as the times were close.", r: 0, f: "Backdating is falsifying. Close isn't the test.", n: null } ] } } },
  qz: [
    { q: "When can a new operator get access to the training environment?", o: [
      ["On the first day of employment", 0, "Not before screening is recorded."],
      ["After screening is complete and recorded", 1, "No system access of any kind before that."],
      ["Read-only access any time", 0, "No access of any kind, read-only included."],
      ["After the written test", 0, "Training needs the environment before the test."] ] },
    { q: "Which trigger same-shift decertification? Select all that apply.", m: 1, o: [
      ["A critical control deviation", 1, "Named in the manual."],
      ["Falsifying a record", 1, "Named in the manual."],
      ["Failing a reassessment", 1, "Named in the manual."],
      ["Asking for a second view on a hard verification", 0, "Asking for a second view is always fine."],
      ["A good-faith escalation that turned out unnecessary", 0, "Nobody gets marked down for a good-faith escalation."] ] },
    { q: "You're certified on Program A. What does that cover on Program B, same platform?", o: [
      ["Everything, since the platform matches", 0, "Certification is per platform and per program."],
      ["Nothing until the difference is trained and assessed", 1, "That's the control."],
      ["Everything except life-safety events", 0, "No partial coverage exists."],
      ["Day shifts only", 0, "Shift has nothing to do with it."] ] },
    { q: "True or false: as a trainee, you can acknowledge an alarm if your mentor is right beside you.", o: [
      ["True", 0, "Not before supervised probation."],
      ["False", 1, "Before supervised probation it goes to your mentor or the nearest certified operator, and the handover is recorded."] ] },
    { q: "When does recertification happen out of cycle?", o: [
      ["Only when the operator asks", 0, "It's triggered by events, not requests."],
      ["After a procedure change, a platform change or a long absence", 1, "Those are the three out-of-cycle triggers."],
      ["Only after a QA finding", 0, "QA findings get targeted retraining on that competency."],
      ["Every January", 0, "The fixed cycle is [CONFIRM]. Out of cycle is event-driven."] ] }

MOD({
  id: "003", title: "Client Onboarding and Site Management", part: "Part B · Foundation", day: 2, mins: 35, comp: "Program specifics",
  purpose: "How a signed contract becomes a live program, how sites come on and off the roster, and how the escalation contact matrix stays right. The matrix is the spine. Every dispatch depends on it being correct at the moment you use it.",
  ln: [
    { h: "What it means for you", l: [
      "<b>If it isn't in the SOW and the Annex, it isn't in scope.</b> The GSOC doesn't monitor to a verbal understanding, an email or a slide.",
      "<b>Every site has a unique site ID.</b> It's the join key across every system and record, and it's never reused.",
      "<b>Check the site profile.</b> It holds hours of legitimate activity, known nuisance sources and documented non-event patterns.",
      "<b>The matrix</b> has one entry per site per level, a primary and at least one alternate, each with the date it was last verified. You check your sites' entries at shift start.",
      "<b>Responsible Parties can direct the GSOC. Key Holders can only be asked to respond.</b> A contact listed as (000) 000-0000 won't be called but must still be able to call in.",
      "<b>An RP can't create a permanent procedure.</b> Permanent changes go through the written change process.",
      "<b>The floor gets briefed before</b> a scope change or a site retirement takes effect, never after." ] },
    { h: "Report it when", l: ["A matrix entry fails your shift-start check.", "A contact has left or a number is dead.", "A site on the roster isn't in your view, or the reverse."] },
    { h: "Know this", l: ["Duty lines beat named people. A named contact who's left is a silent failure.", "Every site needs a primary and an alternate local emergency dispatch number in the Annex before it goes live.", "Retiring a site doesn't delete its records."] },
    { h: "Responsible Party or Key Holder", src: "the full SOP-GSOC-003, section 6.4, and the SOP-GSOC-000 glossary (A2.1)",
      x: "Every alarm-account contact on a site's list is one or the other. The designation decides what you can accept from that person, so check which one you're talking to before you act on anything they ask for.",
      tb: { c: ["", "Responsible Party (RP)", "Key Holder"], r: [
        ["<b>Who they are</b>", "A person on the site contact list authorized by the Client to give the GSOC direction on the account.", "A person on the contact list authorized to respond to the site when police or fire request it."],
        ["<b>Can they direct the GSOC?</b>", "Yes, once you've confirmed who they are: by passcode, or because you placed the call to the listed number.", "Never. Decline any instruction about the site, the equipment or the service, and route it to a confirmed RP."],
        ["<b>Panel codes</b>", "May change or create alarm panel codes.", "No. Process no panel code request from a Key Holder."],
        ["<b>Arm or disarm</b>", "May have the panel armed or disarmed remotely.", "No."],
        ["<b>Test or disregard</b>", "May place the system on test, or tell the GSOC to disregard alarms from the site.", "No."],
        ["<b>Dispatch of authorities</b>", "May request a dispatch, or cancel one.", "No. You take no direction from a Key Holder, so a Key Holder can't cancel one."],
        ["<b>Who's allowed on site</b>", "May verify personnel authorized to be on site.", "No."],
        ["<b>Talk-downs</b>", "May request talk-downs in specific zones.", "No."],
        ["<b>Site hours</b>", "May update site hours of operation.", "No."],
        ["<b>Video to authorities</b>", "May give permission to send video, audio and still images to the authorities.", "No."],
        ["<b>History and reports</b>", "May request alarm and site history, images and incident reports. They're released under SOP-GSOC-018.", "No."],
        ["<b>Going to the site</b>", "Can be asked whether they'll respond.", "Responds when police or fire request it, for example to reset the system or give entry. Is contacted to respond."],
        ["<b>After a dispatch</b>", "You try to notify an RP after each dispatch or significant incident, following the account's instructions.", "The notification rule names RPs, not Key Holders."] ] } },
    { h: "What's the same for both", src: "SOP-GSOC-003 section 6.4 and SOP-GSOC-012 section 6.4", l: [
      "<b>Both are on the site contact list.</b> Call contacts in the order listed unless the account says otherwise. If an RP is unavailable for any reason, move to the next RP on the list.",
      "<b>The call is the same.</b> Who you are, why you're calling, the activation times and areas, what you know and what you've done. Ask whether they'll respond and get an ETA if they will. Get a cell number, and a description of their vehicle if police are on site.",
      "<b>If police on site ask for an RP or Key Holder to respond,</b> relay that request.",
      "<b>Never tell either one whether to respond, dispatch or cancel.</b> If they ask whether they should respond: “Unfortunately, I am unable to make that decision for you. Please refer to your internal procedures for direction.”",
      "<b>A contact listed as (000) 000-0000 isn't called,</b> whichever they are. They can still call in.",
      "<b>Record every contact and every attempt</b> with its time." ] },
    { h: "Know who's on the line", src: "SOP-GSOC-003 section 6.4, SOP-GSOC-012 section 6.4 and SOP-GSOC-021 section 6.4", l: [
      "<b>You called the listed number.</b> That confirms identity. An RP can cancel a dispatch on that call with no passcode.",
      "<b>They called you.</b> Verify identity under the passcode rules in SOP-GSOC-021 before you share anything. If the account has no passcode, confirm them by full name against the contact list.",
      "<b>A passcode confirms who someone is, not what they're allowed to do.</b> A Key Holder who gives the right passcode is still a Key Holder.",
      "<b>RPs are listed by title as well as name,</b> so the list reads the same way at every site in a program.",

MOD({

MOD({
  id: "007", title: "Visual Verification", part: "Part C · Shift Operations", day: 5, mins: 45, comp: "Verification", crit: true,
  purpose: "Verify facts, not assumptions. You can record that someone is carrying an object and describe it. You can't record a weapon unless it's clearly identifiable as one. That difference decides what responders are told.",
  ln: [
    { h: "The sequence", n: [
      "Right site, right unit, right time window.",
      "Look at every available camera, not just the one that alerted. Wait for them all to display, then assess for at least 10 seconds.",
      "Is anything actually there, or is it environmental?",
      "<b>Subjects:</b> number, location, direction, behavior. Clothing and build in objective terms only. <b>Vehicles:</b> type, color, features. A plate only if it's legible.",
      "Retrieve recorded video from two minutes before the activation. Anything criminal in playback, act on it immediately.",
      "Does it match a documented legitimate pattern for this site at this hour?",
      "Classify against the Annex categories and record the observations that support it." ] },
    { h: "Default classification", tb: { c: ["Classification", "Means", "Goes to"], r: [
      ["<b>Non-actionable</b>", "Environment, wildlife, weather, or authorized activity", "Log it with the specific cause and conclude the event. The record still goes to the Supervisor, who closes it"],
      ["<b>Actionable, not life-safety</b>", "Unauthorized presence or activity, no immediate threat", "{s010} dispatch"],
      ["<b>Actionable, life-safety</b>", "Violence, weapon, fire, medical, person in distress", "{s011} now, alongside dispatch"],
      ["<b>Unresolved</b>", "Can't be classified from the view. It's a trigger, not a result", "Level 2 for the Supervisor"] ] } },
    { h: "Evidence", l: ["Capture the full event with a margin either side. The approach is often worth more than the act.", "Write the clip reference in the record when you capture it."] },
    { h: "Never", l: ["Classify on a person's characteristics. Behavior only.", "Ease off at a site with a false-alert history.", "Edit, crop, enhance or annotate source footage.", "Guess a plate. Asking for a second view is always fine."] },
    { h: "Does an object make it Level 5?", src: "the full SOP-GSOC-007, sections 6.1, 6.6, 6.7 and 10",
      x: "No, not on its own. You always describe exactly what you see. Whether you <i>act</i> as if it's a weapon follows one rule: <b>an object designed for combat, such as a gun, knife or sword, is always treated as a weapon. Any other object is treated as a weapon once you see it used against a person.</b> The rule decides how you act. The record still says exactly what you saw.",
      tb: { c: ["You see", "Act on it as", "Where it goes"], r: [

        ["Any other object, used against a person", "A weapon, from that moment", "Actionable, life-safety. {s011} now, alongside dispatch. {L5}"],
        ["Any other object, not used against anyone. A tool, a bag, a length of pipe", "Not a weapon. Describe it", "Classify on what the people are doing, not on the object"],
        ["An object you can't identify, and someone could plausibly get hurt", "Not a weapon. Describe it as not identifiable", "Escalate as if it were life-safety. {L5}"],
        ["An object you can't identify, and nobody is at risk", "Not a weapon. Describe it as not identifiable", "Classify on what the people are doing"] ] } }
  ],
  ct: ["Inconclusive, and a life-safety outcome is plausible? Escalate as if it were life-safety. Over-escalation is recoverable. Under-escalation is not."],

    ["How long do you assess before deciding?", "Wait for every camera to display, then at least 10 seconds."],

MOD({

      "<b>Any hint of litigation, a claim or a police request,</b> apply a legal hold now and tell the Supervisor.",
      "<b>Submit to the Supervisor within 30 minutes of the event concluding.</b> No blank field without “not applicable” and a reason." ] },
    { h: "Comment codes", tb: { c: ["Code", "Meaning"], r: [["21", "Video did not connect"], ["84", "Quality check"], ["90", "Authorities on site"], ["92", "Jurisdiction requirements applied: you followed the police agency's own instructions for that site ({s011})"], ["114", "Within grace"]] }, x: "Alarm events close with a resolution code as well." },

    { h: "Never dial 911 for a monitored site", x: "From the GSOC floor it reaches the wrong dispatch center. Call the site's local emergency dispatch number from the Program Annex. It's at your console with the address, primary and alternate." },
    { h: "Immediate action", l: [
      "<b>Verified life-safety threat: call now.</b> Don't wait for Supervisor approval, for dispatch to finish, or for more verification. Announce the call on the floor. The Supervisor reviews it afterward, and that review never delays the call.",
      "<b>Notify the Supervisor and the client contact in parallel,</b> using a second operator or channel where you can.",
      "<b>Ambiguous, but life-safety is plausible? Escalate.</b> The threshold is low on purpose." ] },
    { h: "What to say", tb: { c: ["Give them", "How"], r: [
      ["<b>Location</b>", "Full street address, city, state. Then where in the site, and the best way in for responders."],
      ["<b>Nature</b>", "What's happening in plain language. No codes. HPAD means nothing outside the GSOC."],
      ["<b>Subjects</b>", "Number, objective description, where they are now, direction of travel."],
      ["<b>Weapons</b>", "Whether one has been seen. If not, say so out loud. Don't leave it unaddressed."],
      ["<b>Injuries</b>", "Whether anyone looks hurt, and how many."],
      ["<b>Who you are</b>", "A remote monitoring operator watching by camera, not someone on scene. Give a callback number that's answered for the whole incident."] ] } },
    { h: "During and after", l: [
      "Stay on as long as the dispatcher needs you. Keep live updates coming and flag hazards responders can't see yet. Talk-down only if it won't raise risk. When in doubt, don't.",
      "Get the dispatcher ID and the agency event number. Follow up with the agency until the dispatch is cleared. Your part of the event isn't finished until then. Record the arrival time and outcome, apply a legal hold ({s018}), and raise Level 6 for a fatality, serious injury or media.",
      "Jurisdiction requirements take precedence, coded 92. Bypassing them needs recorded Supervisor approval." ] },
    { h: "Who closes what", src: "the full SOP-GSOC-011 (section 6.5), SOP-GSOC-008 (section 6.5) and SOP-GSOC-000 (A2.1 and A3)",
      x: "Two different things close, and only one of them is yours. <b>You never close your own incident.</b>",
      tb: { c: ["What closes", "Who closes it", "When"], r: [
        ["<b>The event</b>: your part of the response", "You, the operator", "When the agency has cleared the dispatch. Not when the call ends, and not when police arrive. On alarm events, you conclude the event with a resolution code."],
        ["<b>The incident record</b>", "The GSOC Supervisor", "After review. You submit the record within 30 minutes of the event concluding. The Supervisor approves closure or sends it back with named deficiencies, and closure is recorded with the Supervisor's name and the time."] ] } },
    { h: "Jurisdiction requirements, explained", src: "the full SOP-GSOC-011, section 6.8, and SOP-GSOC-003, section 6.2",
      x: "Some police agencies set their own rules for alarm calls from sites in their area. Those are the jurisdiction requirements. Where they differ from the site's notes or the program's notes, <b>the jurisdiction wins</b>.",
      l: [
        "<b>Where you find them:</b> in the jurisdiction section of the account, often as a pop-up when you select the police number. Read and acknowledge them before you call.",
        "<b>Verified-response jurisdictions</b> want evidence that a crime happened before they'll dispatch: live or recorded video, or an RP report. Broken glass, broken doors or windows, suspects inside or outside, and flashlights with the panel armed all count. With evidence, dispatch immediately, then make RP contact. Tell the dispatcher the event is visually verified and you're watching it live.",
        "<b>No human activity on video,</b> like a door that opens and closes with nobody on any camera, live or recorded, is suspicious but isn't evidence of a crime. Attempt the RP contacts the jurisdiction procedure requires before you dispatch. The RP decides how to proceed on what you tell them.",
        "<b>Permits and penalties.</b> Some sites carry alarm-permit requirements or false-alarm penalties, and some agencies want reports in a set format. Both are recorded in the site profile at onboarding.",
        "<b>Code 92</b> goes in the account history every time you use jurisdiction instructions.",
        "<b>Bypassing them</b> for any reason needs recorded Program Supervisor approval first. A bypass request is {L2}." ] },
    { h: "Example: the jurisdiction beats the site note", src: "a training example built on the full SOP-GSOC-011, section 6.8", l: [
        "<b>The situation.</b> 0212. A burglary signal at a store. The site note says: “Dispatch police on every burglary alarm.” The store is in a verified-response jurisdiction. Live and in playback, the rear door opens and closes. Nobody is on any camera.",
        "<b>What wins.</b> The jurisdiction. A door opening with nobody in view isn't evidence of a crime there, so the site note doesn't decide this one.",
        "<b>What you do.</b> Attempt the RP contacts the jurisdiction procedure requires before any dispatch, tell the RP what you've seen, and enter code 92. The RP decides how to proceed.",
        "<b>What changes it.</b> Playback shows a person forcing the door, or the RP reports a break-in. Now there's evidence. Dispatch immediately, say it's visually verified and you're watching live, then make RP contact." ] }
  ],
  ct: ["No operator is ever criticized for escalating an event that turned out less serious than it looked. Operators are held accountable for failing to escalate."],
  rv: [
    ["Why never 911?", "From the GSOC floor it reaches the wrong dispatch center. Use the site's local emergency dispatch number from the Annex."],
    ["What do you say first on the call?", "Location: full street address, city, state, then where in the site and the best way in."],
    ["No weapon has been seen.", "Say so out loud. Don't leave it unaddressed."],
    ["Can you say “HPAD” to the dispatcher?", "No codes. HPAD means nothing outside the GSOC. Plain language."],
    ["The dispatch is cleared. What do you record before you submit?", "Dispatcher ID, agency event number, arrival time and outcome. Apply a legal hold, then submit for Supervisor review. The Supervisor closes the incident, not you."],
    ["The Supervisor wants to review before you call.", "The review happens afterward and never delays the call."],
    ["Where do jurisdiction instructions show up?", "In the jurisdiction section of the account, often as a pop-up when you select the police number. Read and acknowledge them."],
    ["The site note and the jurisdiction instructions disagree.", "The jurisdiction wins. Enter code 92. Bypassing it needs recorded Program Supervisor approval first."],
    ["Verified-response jurisdiction. A door opens and closes, and nobody is on any camera.", "Not evidence of a crime there. Attempt the required RP contacts before dispatch. The RP decides."]
  ],
  dr: { k: "order", p: "Order what you give the dispatcher.", i: [["Location: address, city, state, where in the site, best way in", ""], ["Nature, in plain language", ""], ["Subjects: number, description, where now, direction", ""], ["Weapons: seen, or say out loud none observed", ""], ["Injuries: anyone hurt, how many", ""], ["Who you are: remote operator by camera, callback number", ""]] },
  sc: { title: "Distribution center, rear roll-door", brief: "0247. Two subjects pried the rear roll-door and went inside. An unarmed interior officer is on patrol and doesn't know they're there.", start: "a", beats: {
    a: { t: "0249", s: "Both subjects are inside. The officer's patrol route takes him to that aisle in about four minutes.", q: "Your call?", o: [
      { t: "Call the site's local emergency dispatch number now, brief the officer to hold position, and notify Supervisor and client in parallel.", r: 2, f: "Right. Your officer may walk into two intruders. That's life-safety, and you act now.", n: "b" },
      { t: "Send the officer to the rear to confirm before calling anyone.", r: 0, f: "You watched them go in. An officer is never the only response to a verified life-safety situation.", n: "b" },
      { t: "Page the Supervisor and ask whether the client wants police.", r: 0, f: "Life safety outranks client preference and chain of command. Approval comes afterward.", n: "b" } ] },
    b: { t: "0250", s: "Local dispatch answers.", q: "What do you lead with?", o: [
      { t: "The full street address, city and state, then the rear roll-door and the best gate for responders.", r: 2, f: "Right. If the call drops after eight seconds, the address still gets help moving.", n: "c" },
      { t: "That you're a remote monitoring operator.", r: 1, f: "It must be said, but location comes first.", n: "c" },
      { t: "Everything you've seen since 0247, in order.", r: 0, f: "Lead with the most important fact. On an emergency call that's always where.", n: "c" } ] },
    c: { t: "0254", s: "Police are five minutes out. On camera you see one subject climbing a roof access ladder on the north side, out of sight from the yard.", q: "What do you do with that?", o: [
      { t: "Tell the dispatcher now. It's a hazard responders can't see yet.", r: 2, f: "Right. Live updates and unseen hazards are what you're there for.", n: "d" },
      { t: "Save it for the incident record.", r: 0, f: "By the time anyone reads it, officers have approached without knowing someone is above them.", n: "d" },
      { t: "Use talk-down to order them off the ladder.", r: 0, f: "Talk-down only if it won't raise risk. Announcing yourself just before police arrive can. When in doubt, don't.", n: "d" } ] },
    d: { t: "0331", s: "One subject detained. Nobody hurt. Dispatch cleared.", q: "The dispatch is cleared. What now?", o: [
      { t: "Record dispatcher ID, agency event number, arrival time and outcome. Apply a legal hold. Submit for Supervisor review.", r: 2, f: "Right. A police response is grounds for a hold.", n: null },
      { t: "Close it yourself. Good outcome.", r: 0, f: "You don't close your own incident, and this record needs a legal hold.", n: null },
      { t: "Raise Level 6 because police attended.", r: 1, f: "Level 6 is for a fatality, serious injury or media. The thing this event needed was the legal hold.", n: null } ] } } },
  qz: [
    { q: "Which number do you call for a monitored site's emergency?", o: [["911", 0, "Never. It reaches the wrong center."], ["The site's local emergency dispatch number from the Annex", 1, "Primary and alternate are at your console."], ["The client's main line", 0, "Not emergency services."], ["The Supervisor", 0, "In parallel, not instead."]] },
    { q: "What must you tell the dispatcher about yourself?", o: [["Your full name", 0, "Not the point."], ["That you're a remote operator watching by camera, with a callback number answered for the whole incident", 1, "That's the requirement."], ["Your Supervisor's name", 0, "Not required."], ["Nothing", 0, "They must know the report is remote."]] },
    { q: "Which trigger Level 6? Select all that apply.", m: 1, o: [["A fatality", 1, "Listed."], ["A serious injury", 1, "Listed."], ["Media", 1, "Listed."], ["Any police attendance", 0, "Not on its own."], ["A detention", 0, "Not on its own."]] },
    { q: "What code marks that jurisdiction requirements were applied?", o: [["21", 0, "Video did not connect."], ["90", 0, "Authorities on site."], ["92", 1, "Jurisdiction requirements applied."], ["114", 0, "Within grace."]] },
    { q: "True or false: an operator who escalates an event that turns out minor can be criticized for it.", o: [["True", 0, "Never."], ["False", 1, "Operators are held accountable for failing to escalate."]] },
    { q: "When is your part of a police dispatch finished, and who closes the incident?", o: [
      ["When police arrive. You close the incident then", 0, "Police arriving isn't the end of it, and you never close your own incident."],
      ["When the agency clears the dispatch. You submit the record, and the GSOC Supervisor closes the incident after review", 1, "Right. Follow up until the dispatch is cleared, submit within 30 minutes, and the Supervisor approves closure."],
      ["When you hang up with the dispatcher. You close the incident then", 0, "Stopping when the call ends is the common mistake. Follow up until the dispatch is cleared, and never close your own incident."],
      ["Right after the call. The Supervisor closes the incident", 0, "The Supervisor does close it, but your part isn't done until the agency clears the dispatch."] ] },
    { q: "A store in a verified-response jurisdiction has a site note: “Dispatch police on every burglary alarm.” A door opens and closes with nobody on live or recorded video. What do you do?", o: [
      ["Follow the site note and dispatch now", 0, "Jurisdiction instructions outrank site notes where they differ."],
      ["Attempt the RP contacts the jurisdiction requires before any dispatch, and enter code 92", 1, "Right. With no human activity on video there's no evidence of a crime, so the jurisdiction's procedure decides it."],
      ["Close it as a false alarm", 0, "It's suspicious, not cleared. Work the jurisdiction's RP contacts first."],
      ["Dispatch, and tell police it's visually verified", 0, "Nothing was seen, so it isn't verified. Never claim verification you don't have."] ] },
    { q: "Same store. Playback now shows a person forcing the rear door. What changes?", o: [
      ["Nothing. Still call the RP first", 0, "Now there's evidence. Dispatch immediately, then make RP contact."],
      ["Dispatch immediately, say it's visually verified and you're watching live, then make RP contact", 1, "Right. Video of a person forcing the door is the evidence a verified-response jurisdiction wants."],
      ["Get Supervisor approval to bypass the jurisdiction first", 0, "No bypass is needed. The evidence meets the jurisdiction's requirement."],
      ["Wait for a second activation", 0, "Not a step. You have evidence now."] ] }
  ]

MOD({
  id: "012", title: "Communications and Notification Protocol", part: "Part D · Response and Communications", day: 8, mins: 35, comp: "Communications",
  purpose: "How you talk to everyone who isn't an emergency agency, so the message is accurate and the same no matter who's on shift.",
  ln: [
    { h: "Channels", tb: { c: ["Channel", "Use it for", "Never for"], r: [
      ["<b>Dispatch channel</b>", "Officer dispatch and live coordination", "Anything not time-critical"],
      ["<b>Floor channel</b>", "You to the GSOC Supervisor", "Client detail, if it isn't access-controlled"],
      ["<b>Client escalation</b>", "Level 4 notification per the Annex", "Routine updates"],
      ["<b>AURIX (or Annex system)</b>", "The record of everything", "Urgent, real-time communication"],
      ["<b>Email</b>", "Non-urgent confirmations and reports", "Anything urgent or life-safety, ever"] ] } },
    { h: "On every call", l: [
      "<b>Open with</b> “Operator [number] with Specialized Security,” then the site. Lead with the most important fact.",
      "<b>Plain language.</b> No internal codes with anyone outside the GSOC. Separate confirmed fact from unconfirmed report, every time. On a critical instruction, get a read-back.",
      "<b>RP contact.</b> Who you are, why you're calling, times and zones, what you know, what you did, will they respond, ETA, vehicle, cell number, any police request. An RP isn't contacted until you reach a live person. Messages stay standard: date, time, site number.",
      "<b>Client notification at Level 4.</b> What's known, what isn't yet, what you did, what happens next. Never speculate on cause, liability or loss." ] },
    { h: "Never", l: ["Give media, insurers, attorneys or the public anything, not even whether an incident happened. Route to GSOC leadership and log the call.", "Share with client staff who aren't on the authorized list before an authorized contact verifies them. Never tell a site its monitoring is being discontinued."] },
    { h: "RP or Key Holder?", src: "the full SOP-GSOC-003, section 6.4", x: "Make the same call to both. What changes is what you can accept from them. An RP whose identity is confirmed can direct the account, including cancelling a dispatch. A Key Holder responds when police or fire ask, and never directs. The full side-by-side comparison is in the SOP-GSOC-003 module on Day 2." }
  ],
  ct: ["Urgency never goes by a channel that doesn't guarantee an immediate human response. Time-critical is spoken, not written.", "The GSOC reports, it doesn't direct. Never tell an RP, Key Holder, employee or vendor whether to respond, dispatch or cancel."],
  rv: [
    ["How do you open every call?", "“Operator [number] with Specialized Security,” then the site, then the most important fact."],
    ["A reporter asks whether there was an incident last night.", "Give nothing, not even whether it happened. Route to GSOC leadership and log the call."],
    ["You left a voicemail for the RP. Are they contacted?", "No. An RP isn't contacted until you reach a live person."],
    ["The four parts of a Level 4 notification?", "What's known, what isn't yet, what you did, what happens next."],
    ["The RP asks, “Should I go down there?”", "The GSOC reports, it doesn't direct. Give them what you know. The decision is theirs."]
  ],
  dr: { k: "sort", p: "Route each message to the right channel.", b: ["Dispatch channel", "Floor channel", "Client escalation", "AURIX record", "Email", "GSOC leadership"], i: [
    ["An officer needs to move to a verified event now", 0, "Time-critical, spoken."],
    ["You're unsure whether an event meets the Annex threshold", 1, "Procedural doubt goes to the Supervisor."],
    ["The event meets the Level 4 threshold", 2, "Per the Annex."],
    ["The full timeline of tonight's incident", 3, "The record of everything."],
    ["Confirming next week's report format with a client", 4, "Non-urgent confirmation."],
    ["An attorney asks you to confirm an incident time", 5, "Route, confirm nothing, log the call."],
    ["A local reporter calls about a client site", 5, "Media goes to GSOC leadership."] ] },
  sc: { title: "The duty manager", brief: "0304. Earlier, a trespasser at a client yard fell from a pallet stack. EMS transported. Police took a report.", start: "a", beats: {
    a: { t: "0304", s: "The client's authorized duty manager calls and asks what happened and whether they're exposed to a claim.", q: "What do you give them?", o: [
      { t: "What's known, what isn't yet, what the GSOC did and what happens next. Nothing on liability.", r: 2, f: "Right. Never speculate on cause, liability or loss.", n: "b" },
      { t: "Your view that the fall was the trespasser's own fault, so they should be fine.", r: 0, f: "That's speculation on cause and liability from someone watching a camera.", n: "b" },
      { t: "Nothing. Route them to GSOC leadership.", r: 1, f: "That's the handling for media, insurers, attorneys and the public. An authorized client contact gets the four-part update.", n: "b" } ] },
    b: { t: "0320", s: "A caller says they're the client's regional loss prevention manager. They aren't on the authorized list.", q: "What now?", o: [
      { t: "Share the update. The role clearly needs it.", r: 0, f: "Not before an authorized contact verifies them.", n: "c" },
      { t: "Verify them with an authorized contact before sharing anything.", r: 2, f: "Right. The list decides, not the job title.", n: "c" } ] },
    c: { t: "0330", s: "The duty manager hasn't picked up a follow-up call about a new development that needs a decision soon.", q: "How do you reach them?", o: [
      { t: "Email the details so there's a written record.", r: 0, f: "Email is never for anything urgent. Time-critical is spoken.", n: null },
      { t: "Keep working the phone and escalate one level up if they stay unreachable.", r: 2, f: "Right. An unanswered call isn't discharged, and urgency goes by voice.", n: null } ] } } },
  qz: [
    { q: "Email can be used for:", o: [["Urgent updates when phones fail", 0, "Never anything urgent."], ["Non-urgent confirmations and reports", 1, "That's its only use."], ["Life-safety backup", 0, "Never life-safety."], ["Officer dispatch", 0, "Dispatch channel."]] },
    { q: "An RP asks whether to cancel the officer. You:", o: [["Tell them to cancel", 0, "The GSOC doesn't direct."], ["Give them the facts. Whether to cancel is their call", 1, "Report, don't direct."], ["Tell them to keep the officer", 0, "Still directing."], ["Refuse to discuss it", 0, "They're a Responsible Party."]] },
    { q: "Which belong in a Level 4 notification? Select all that apply.", m: 1, o: [["What's known", 1, ""], ["What isn't known yet", 1, ""], ["What you did", 1, ""], ["What happens next", 1, ""], ["Your estimate of the loss", 0, "Never speculate on loss."]] },
    { q: "True or false: with a reporter, you give nothing, not even whether an incident happened, and route the call to GSOC leadership.", o: [["True", 1, "That's the rule, and you log the call."], ["False", 0, "It's exactly the rule. Nothing to media, route to GSOC leadership, log it."]] },
    { q: "Client staff not on the authorized list ask for detail.", o: [["Share basics only", 0, "Nothing before verification."], ["Verify with an authorized contact first", 1, "That's the rule."], ["Share if they sound senior", 0, "The list decides."], ["Hang up", 0, "Verify instead."]] }
  ]
});

MOD({
  id: "013", title: "Equipment Failure and Degraded Operations", part: "Part D · Response and Communications", day: 8, mins: 40, comp: "Degraded operations", crit: true,
  purpose: "Keep operating, and stay honest, when monitoring is impaired. Degraded operations get declared and managed. The floor never quietly absorbs them.",
  ln: [
    { h: "When something fails", l: [
      "<b>Log it the moment you see it:</b> site, component, symptom, time, impact.",
      "<b>Check a second site</b> before calling it a single-site fault. Systemic faults often look local at first.",
      "<b>Only documented first-line fixes.</b> Don't improvise on production systems." ] },
    { h: "How bad is it", tb: { c: ["Impact", "Looks like", "Action"], r: [
      ["<b>Minor</b>", "One camera or a non-critical capability. Site still mostly covered", "Log, ticket, monitor. Gap goes in the passdown"],
      ["<b>Significant</b>", "A whole site dark, or a capability lost across sites", "Level 2. Degraded ops. Client told"],
      ["<b>Critical</b>", "Incident system, dispatch channel, or several high-criticality sites", "Level 4. Degraded ops. {s014} if the floor is hit"] ] } },
    { h: "Compensate", l: [
      "<b>Camera lost:</b> sweep the remaining views more often. Note the blind area in the record and the passdown.",
      "<b>Incident system down:</b> manual log, every entry timed as it happens, back-loaded later and marked reconstructed.",
      "<b>Dispatch channel down:</b> switch to the fallback, prove it works first, tell the officers.",
      "<b>Workstation down:</b> move to a spare console. Never share one.",
      "<b>Zones.</b> Check the zone number before placing it on test. The wrong zone leaves the faulty one live. Third dispatch to one location in 24 hours: the RP decides on further dispatch, and a service case gets raised." ] }
  ],
  ct: ["The client is told what isn't being monitored as soon as it's known. Understating the impact is the worst option there is.", "A zone on test, a disabled zone and a no-dispatch note each take part of a site out of response. None applies without approving initials and an end time, a no-dispatch note also needs RP authorization by name, and each stays in the passdown until it's lifted."],
  rv: [
    ["A site goes dark. Is it just that site?", "Check a second site before calling it a single-site fault. Systemic faults often look local at first."],
    ["The incident system is down mid-event.", "Manual log, every entry timed as it happens, back-loaded later and marked reconstructed."],
    ["Dispatch channel down. Switch to the fallback and go?", "Prove the fallback works first, then tell the officers."],
    ["Your workstation dies.", "Move to a spare console. Never share one."],
    ["Third dispatch to the same location in 24 hours.", "The RP decides on further dispatch, and a service case gets raised."],
    ["What's the worst thing you can do when telling the client?", "Understate the impact."]
  ],
  dr: { k: "sort", p: "Size each failure.", b: ["Minor", "Significant", "Critical"], i: [
    ["One camera down at a low-criticality site", 0, "Log, ticket, monitor, passdown."],
    ["A whole site dark", 1, "Level 2, degraded ops, client told."],
    ["Talk-down lost across every site on one platform", 1, "A capability lost across sites."],
    ["Incident system unavailable", 2, "Level 4, degraded ops."],
    ["Dispatch channel down", 2, "Level 4, degraded ops."],
    ["Several high-criticality sites dark at once", 2, "Level 4, and SOP-014 if the floor is hit."] ] },
  sc: { title: "The quiet failure", brief: "0120. Night shift, eleven sites.", start: "a", beats: {
    a: { t: "0120", s: "Site 0412 goes dark. Every feed offline.", q: "First move?", o: [
      { t: "Log it with site, component, symptom, time and impact, then check a second site.", r: 2, f: "Right. Systemic faults often look local at first.", n: "b" },
      { t: "Reboot the unit from the console. That usually fixes it.", r: 0, f: "Only documented first-line fixes. Don't improvise on production systems.", n: "b" } ] },
    b: { t: "0122", s: "Sites 0413 and 0420 are dark too. Then AURIX stops saving records.", q: "How bad is it, and what follows?", o: [
      { t: "Critical. Level 4, degraded operations, manual log with every entry timed.", r: 2, f: "Right. Incident system down plus several sites dark is critical.", n: "c" },
      { t: "Minor. Ticket it and keep going.", r: 0, f: "Several sites dark and the incident system down is critical.", n: "c" },
      { t: "Significant. Level 2 and wait for it to come back.", r: 1, f: "Several sites dark alone would be significant. The incident system failing makes it critical, Level 4.", n: "c" } ] },
    c: { t: "0130", s: "The Supervisor asks you to draft what the client is told.", q: "Which line?", o: [
      { t: "“Brief technical issue, monitoring continuing normally.”", r: 0, f: "Understating the impact is the worst option there is.", n: "d" },
      { t: "“Sites 0412, 0413 and 0420 have been offline since 0120 and aren't being monitored. Records are being kept manually. Next update at 0200.”", r: 2, f: "Right. Tell the client what isn't monitored as soon as it's known.", n: "d" } ] },
    d: { t: "0215", s: "AURIX is back. Your manual log has eleven timed entries.", q: "How do they go into AURIX?", o: [
      { t: "Back-loaded with original times and marked reconstructed.", r: 2, f: "Right. The marking keeps the record honest.", n: null },
      { t: "Entered as if they were made live.", r: 0, f: "An unmarked reconstruction looks contemporaneous. That's a falsified record.", n: null } ] } } },
  qz: [
    { q: "Before placing a zone on test, what do you check?", o: [["The zone number", 1, "The wrong zone leaves the faulty one live."], ["The weather", 0, "Not the control."], ["The client's mood", 0, "No."], ["Nothing", 0, "Check the zone number."]] },
    { q: "What does a no-dispatch note need? Select all that apply.", m: 1, o: [["Approving initials", 1, ""], ["An end time", 1, ""], ["RP authorization by name", 1, "No-dispatch notes need this too."], ["Stays in the passdown until lifted", 1, ""], ["A verbal OK from any client employee", 0, "RP by name."]] },
    { q: "A significant failure means:", o: [["Log and ticket only", 0, "That's minor."], ["Level 2, degraded ops, client told", 1, "That's the row."], ["Level 4", 0, "That's critical."], ["Floor failover", 0, "Only if the floor itself is hit."]] },
    { q: "True or false: you can share a console with another operator while yours is down.", o: [["True", 0, "Never share one."], ["False", 1, "Move to a spare console."]] },
    { q: "When is the client told what isn't monitored?", o: [["After it's fixed", 0, "Too late."], ["As soon as it's known", 1, "That's the control."], ["At the monthly review", 0, "No."], ["Only if they ask", 0, "Always, as soon as known."]] }
  ]
});

MOD({
  id: "014", title: "Business Continuity and Floor Failover", part: "Part D · Response and Communications", day: 9, mins: 30, comp: "Degraded operations", crit: true,
  purpose: "Keep monitoring when the primary floor in Plano is impaired or gone. Atlanta is the failover. A GSOC that stops when its own building has a problem hasn't delivered continuous monitoring.",
  ln: [
    { h: "Going to failover", n: [
      "The GSOC Supervisor or GSOC leadership declares it and records the time and reason. Typical triggers are power, network, evacuation, severe weather, or not enough staff.",
      "The failover floor confirms it has capacity and certified operators.",

MOD({

  ln: [

      "<b>A vendor entering a disarmed site</b> gets the duress check.",

  rv: [

      { t: "Raise a service ticket and move to the next lower branch. Call the premise since video can't settle it.", r: 2, f: "Right. Can't retrieve two minutes within three minutes? Always raise a service ticket.", n: "c" } ] },
    c: { t: "0124", s: "Camera 4 comes back: someone in a hoodie stuffing boxed items into a bag in the stockroom. This is a Priority site, so a Quality Check is required. The person who'd give it is on a call.", q: "What do you do?", o: [
      { t: "Wait for the Quality Check, then dispatch.", r: 0, f: "A Quality Check never delays a dispatch on criminal activity.", n: null },
      { t: "Dispatch now on verified criminal activity, and get the Quality Check as soon as it's available.", r: 2, f: "Right.", n: null },
