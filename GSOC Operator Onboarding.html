/* Field Manual references: page, SOP, section and paragraph. Generated from GSOC-FLD-001 and reviewed. */
function refLine(r){if(r.d)return `${r.d} ${SRC_TITLES[r.d]||''} (full SOP) · section ${r.c}${r.i?' · '+r.i:''}`;const where=r.p===2?'How to Use This Manual':`SOP-GSOC-${r.s} ${FM_TITLES[r.s]||''}`;return `Field Manual page ${r.p} · ${where} · ${r.c}${r.i?', '+r.i:''}`}
function refBlock(key,label){const rs=REFS[key];if(!rs||!rs.length)return'';let lab=label||'Where to find it in the Field Manual';if(rs.some(r=>r.d))lab=lab.replace(' in the Field Manual','');
  return `<div class="ref"><span class="rlab">${lab}</span>${rs.map(r=>`<div class="rl"><span class="rp">${esc(refLine(r))}</span><span class="rq">“${esc(r.t)}”</span></div>`).join('')}</div>`}
const refPlain=key=>(REFS[key]||[]).map(refLine).join(' | ');
const refShort=key=>(REFS[key]||[]).map(r=>r.d?`${r.d} (full SOP) · ${r.c}${r.i?', '+r.i:''}`:`Field Manual p. ${r.p} · ${r.p===2?'How to Use This Manual':'SOP-GSOC-'+r.s} · ${r.c}${r.i?', '+r.i:''}`).join(' | ');
function missPanel(q,chosen,key){
  const ok=q.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);const wrong=chosen.filter(i=>!ok.includes(i));const left=ok.filter(i=>!chosen.includes(i));
  let h=`<div class="miss"><p class="vt risk" style="margin:0">Not quite</p><div class="mblk"><span class="rlab">Why your answer is wrong</span>`;
  h+=wrong.map(i=>`<p><b>You chose “${fmt(q.o[i][0])}.”</b> ${fmt(q.o[i][2])}</p>`).join('');
  if(left.length&&q.m)h+=`<p><b>You left out ${left.length===1?'one correct answer':left.length+' correct answers'}:</b> ${left.map(i=>'“'+fmt(q.o[i][0])+'”').join(', ')}. ${q.m?'Every correct option has to be selected.':''}</p>`;
  h+=`</div><div class="mblk"><span class="rlab" style="color:#A8DFC6">Correct answer</span>${ok.map(i=>`<p class="good"><b>${fmt(q.o[i][0])}.</b> <span class="fg">${fmt(q.o[i][2])}</span></p>`).join('')}</div>`;
  return h+refBlock(key)+`</div>`;
}

/* ===================================================== helpers ===================================================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LVN=["","Monitor and document","Supervisor notification","Direct-to-guard dispatch","Client and management","Emergency response","Executive notification"];
function fmt(s){return String(s==null?'':s)
  .replace(/\{L([1-6])\}/g,(m,n)=>`<span class="lv l${n}" title="${LVN[n]}">Level ${n}</span>`)
  .replace(/\{s(\d{3})\}/g,(m,n)=>MOD_BY[n]?`<a class="sop" href="#sop-${n}">SOP-${n}</a>`:`<span class="sop">SOP-${n}</span>`)
  .replace(/\[CONFIRM\]/g,'<span class="confirm">[CONFIRM]</span>');}
const lvBadge=s=>String(s).split('/').map(x=>{const n=x.trim().replace('L','');return `<span class="lv l${n}">Level ${n}</span>`}).join(' ');
const pad2=n=>String(n).padStart(2,'0');
const now=()=>Date.now();
function shuffle(a,seed){a=a.slice();let s=seed||Math.floor(Math.random()*1e9);const r=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtDate(t){if(!t)return'';const d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ===================================================== state + storage ===================================================== */
const LKEY='gsoc-trn005-v1';
function blank(){return {v:1,profile:{name:'',start:''},mods:{},notes:{},lab:{},tests:[],assess:{},aw:{},last:'',created:now(),updated:now()}}
let S=blank();
const SAVE={mode:'memory',db:null,user:null,uid:null,canEdit:false,dl:null,timer:null,writing:false,pending:false,signoffs:{}};
/* Floor PCs are shared, so the browser cache is keyed per signed-in person. The anonymous key is used only when there's no shared record at all. */
const lkey=()=>SAVE.uid?LKEY+':'+SAVE.uid:LKEY;
function lsGet(k){try{const r=localStorage.getItem(k||lkey());return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(o){try{localStorage.setItem(lkey(),JSON.stringify(o));return true}catch(e){return false}}
function setPill(kind,text){const p=$('#savepill');p.className='savepill '+kind;$('#savetxt').textContent=text;}
function pillIdle(){
  if(SAVE.mode==='db')setPill('db','Saved to your training record');
  else if(SAVE.mode==='local')setPill('local','Saved in this browser');
  else setPill('','Not saved');
}
function summary(){
  let done=0,mast=0,sum=0,n=0;
  MODS.forEach(m=>{const st=modStatus(m.id);if(st.complete){done++;sum+=st.pct;n++;if(st.pct>=MASTERY)mast++}});
  const labDone=LABS.filter(l=>S.lab[l.id]&&S.lab[l.id].first).length;
  const full=S.tests.filter(t=>t.kind==='full');const best=full.length?Math.max(...full.map(t=>t.pct)):null;
  let miss=0;ADAYS.forEach(d=>aList(d).forEach(a=>{miss+=a.n-a.ok}));
  return {done,mast,avg:n?Math.round(sum/n):null,lab:labDone,test:best,days:ADAYS.filter(passed).length,miss,at:S.updated};
}
function touch(){S.updated=now();S.sum=summary();queueSave();paintProgress();}
function queueSave(){
  if(SAVE.mode==='loading')return;
  if(SAVE.mode==='local'){lsSet(S);pillIdle();return}
  if(SAVE.mode!=='db'){lsSet(S);return}
  setPill('busy','Saving');
  clearTimeout(SAVE.timer);SAVE.timer=setTimeout(flush,900);
}
async function flush(){
  if(SAVE.mode!=='db')return;
  if(SAVE.writing){SAVE.pending=true;return}
  SAVE.writing=true;
  try{
    await SAVE.db.doc('trainees/'+SAVE.uid).set(JSON.parse(JSON.stringify(S)));
    lsSet(S);pillIdle();
  }catch(e){
    const code=e&&e.code;
    if(code==='invalid_argument'||code==='not_granted'||code==='revoked'||code==='capability_disabled'){
      SAVE.mode='local';lsSet(S);pillIdle();
      showNotice('Your access level can’t save to the shared training record, so progress is being kept in this browser for now. Ask your trainer for Contributor access to this page.');
    }else if(code==='quota_exceeded'){setPill('local','Record is full');lsSet(S);showNotice('The shared training record is full. Progress is kept in this browser. Tell your trainer.');}
    else{setPill('local','Retrying save');lsSet(S);setTimeout(()=>{SAVE.writing=false;flush()},2500+Math.random()*1500);return}
  }
  SAVE.writing=false;
  if(SAVE.pending){SAVE.pending=false;flush()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&SAVE.mode==='db'){clearTimeout(SAVE.timer);flush()}});
let NOTICE='';
function showNotice(t){NOTICE=t;const n=$('#notice');if(n){n.hidden=false;n.textContent=t}}

function loadAnon(){const l=lsGet(LKEY);if(l&&l.v===1)S=Object.assign(blank(),l);SAVE.mode=lsSet(S)?'local':'memory';pillIdle();}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
async function initCaps(){
  const runtime=!!(window.claude&&typeof window.claude.use==='function');
  if(!runtime){loadAnon();route();return}
  SAVE.mode='loading';setPill('busy','Loading your record');route();
  let db=null,user=null,dl=null;
  try{[db,user,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')])}catch(e){}
  SAVE.dl=dl||null;SAVE.user=user||null;
  if(user){try{SAVE.uid=await user.id()}catch(e){}try{SAVE.canEdit=!!(await user.canEdit())||!!(await user.isOwner())}catch(e){}}
  if(db&&SAVE.uid){
    SAVE.db=db;
    const cache=lsGet();
    try{
      const snap=await withTimeout(db.doc('trainees/'+SAVE.uid).get(),10000);
      const doc=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;
      SAVE.mode='db';
      if(cache&&cache.v===1&&(!doc||(cache.updated||0)>(doc.updated||0))){S=Object.assign(blank(),cache);touch();await flush()}
      else if(doc){S=Object.assign(blank(),doc);lsSet(S);pillIdle()}
      else{S=blank();touch();await flush()}
      watchSignoffs();
    }catch(e){
      S=cache&&cache.v===1?Object.assign(blank(),cache):blank();SAVE.mode='local';lsSet(S);pillIdle();
      showNotice('The shared training record isn’t answering right now, so progress is being kept in this browser. It’ll sync the next time the record is reachable when you reopen this page.');
    }
  }else{
    SAVE.uid=null;loadAnon();
    showNotice('You’re not signed in to a shared training record here, so progress is saved in this browser only. Open this page from claude.ai while signed in, with Contributor access, so your trainer can see your results.');
  }
  route();
}
function watchSignoffs(){
  try{SAVE.db.doc('signoffs/'+SAVE.uid).onSnapshot(s=>{SAVE.signoffs=s.exists?(s.data()||{}):{};
    const fx=SAVE.signoffs.profileFix;if(fx&&fx.name&&(!S.profile.fixedAt||fx.at>S.profile.fixedAt)){S.profile=Object.assign({},S.profile,{name:fx.name,start:fx.start,fixedAt:fx.at});if(!S.profile.at)S.profile.at=fx.at;touch();route(true);return}
    if(/^(home|day-)/.test(curRoute()))route(true)},()=>{})}catch(e){}
}
async function nameOf(ids){
  const out={};if(!SAVE.user)return out;
  try{const ps=await SAVE.user.profiles(ids);for(const id of ids)out[id]=(ps[id]&&ps[id].name)||''}catch(e){}
  return out;
}
async function saveFile(name,text){
  if(!SAVE.dl){toast('File downloads aren’t available in this view.');return}
  try{await SAVE.dl.save({filename:name,data:new Blob([text],{type:'text/csv'})});toast('Saved '+name)}
  catch(e){if(e&&e.code==='declined')return;toast('Couldn’t save the file here.')}
}
const csvCell=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');

/* ===================================================== scoring ===================================================== */
function rec(id){return S.mods[id]||(S.mods[id]={st:{},rv:[],dr:null,sc:null,qz:{},att:1,hist:[],step:0})}
function peek(id){return S.mods[id]||null}
function scenPts(first){return first?Math.round(6*first.sum/(2*first.n)):0}
function modStatus(id){
  const m=MOD_BY[id],r=peek(id);
  const fin=!!(r&&r.st&&['brief','reveal','drill','scen','check'].every(k=>r.st[k]));
  const dmax=r&&r.dr&&r.dr.first&&r.dr.first.tot?r.dr.first.tot:m.dr.i.length;
  const qn=r?Object.keys(r.qz||{}).length:0,qmax=fin&&qn?qn:m.qz.length;
  const max=dmax+6+qmax;
  if(!r)return {started:false,complete:false,pct:0,pts:0,max,best:0,steps:0,dmax,qmax};
  const dp=r.dr&&r.dr.first?r.dr.first.ok:0;
  const sp=r.sc&&r.sc.first?scenPts(r.sc.first):0;
  const qp=Object.values(r.qz||{}).filter(x=>x.ok).length;
  const pts=dp+sp+qp;const pct=Math.round(100*pts/max);
  const steps=['brief','reveal','drill','scen','check'].filter(k=>r.st&&r.st[k]).length;
  const complete=steps===5;
  const best=Math.max(complete?pct:0,...(r.hist||[]).map(h=>h.pct));
  return {started:true,complete,pct,pts,max,best,steps,dp,sp,qp,dmax,qmax,att:r.att||1};
}
function statusClass(id){const s=modStatus(id);if(!s.started)return'';if(!s.complete)return'ip';return s.pct>=MASTERY?'ok':'lo'}
function dayStatus(d){
  const ms=d.mods;let done=ms.filter(id=>modStatus(id).complete).length,tot=ms.length;
  if(d.lab){tot+=LABS.length;done+=LABS.filter(l=>S.lab[l.id]&&S.lab[l.id].first).length}
  if(ADAYS.includes(d.d)){tot+=1;done+=passed(d.d)?1:0}
  return {done,tot,pct:tot?Math.round(100*done/tot):0};
}
function nextUp(){
  for(const d of PLAN.days){if(!ADAYS.includes(d.d))break;
    for(const id of d.mods)if(!modStatus(id).complete)return {type:'mod',id};
    if(d.lab)for(const l of LABS)if(!(S.lab[l.id]&&S.lab[l.id].first))return {type:'lab',id:l.id};
    if(!passed(d.d))return {type:'assess',d:d.d};
  }
  return null;
}
function paintProgress(){
  const s=summary();const total=MODS.length+LABS.length+ADAYS.length;const done=s.done+s.lab+s.days;
  $('#progbar').style.width=Math.round(100*done/total)+'%';
}


/* ===================================================== end-of-day assessments ===================================================== */
/* Every day from 1 to 13 ends with an assessment drawn from that day's SOPs. 80% to pass, unlimited retakes, next day locked until passed.
   Every attempt is kept with each question, the answer given and whether it was right, so misses stay on the record. */
const ADAYS=PLAN.days.filter(d=>d.mods.length||d.lab).map(d=>d.d);
const assessN=n=>n===13?30:(PLAN.days[n-1].mods.length===1?10:15);
const needOk=n=>Math.ceil(assessN(n)*MASTERY/100);
const LOCK='<svg width="10" height="11" viewBox="0 0 10 11" aria-hidden="true"><rect x="1" y="4.6" width="8" height="6" rx="1" fill="currentColor"/><path d="M3 4.6V3.2a2 2 0 0 1 4 0v1.4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>';
function aList(n,st){st=st||S;return (st.assess&&st.assess['d'+n])||[]}
function passed(n){return aList(n).some(a=>a.pass)}
function passedAt(n,st){const a=aList(n,st).find(a=>a.pass);return a?a.at:null}
function bestPct(n,st){const L=aList(n,st);return L.length?Math.max(...L.map(a=>a.pct)):null}
function dayUnlocked(n){return n<=1||passed(n-1)}
const modLocked=id=>!SAVE.canEdit&&!dayUnlocked(MOD_BY[id].day);
const labLocked=()=>!SAVE.canEdit&&!dayUnlocked(13);
function assessLeft(n){const d=PLAN.days[n-1];const left=d.mods.filter(id=>!modStatus(id).complete).map(id=>({h:'#sop-'+id,t:'SOP-GSOC-'+id+' · '+MOD_BY[id].title}));
  if(d.lab)LABS.forEach(l=>{if(!(S.lab[l.id]&&S.lab[l.id].first))left.push({h:'#lab-'+l.id,t:'Lab · '+l.title})});return left}
const assessOpen=n=>!assessLeft(n).length;
function mainPath(sc){const p=[];let b=sc.start;const seen=new Set();while(b&&sc.beats[b]&&!seen.has(b)){seen.add(b);p.push(b);const best=sc.beats[b].o.find(o=>o.r===2);b=best&&best.n}return p}
function bankFor(mid){const m=MOD_BY[mid];
  return {q:m.qz.map((_,i)=>'q:'+mid+':'+i),d:m.dr.k==='sort'?m.dr.i.map((_,i)=>'d:'+mid+':'+i):m.dr.i.slice(0,-1).map((_,i)=>'o:'+mid+':'+i),s:mainPath(m.sc).map(b=>'s:'+mid+':'+b)}}
function mixBank(b){const q=shuffle(b.q),d=shuffle(b.d),s=shuffle(b.s),out=[];while(q.length||d.length||s.length)[q,d,s].forEach(a=>{if(a.length)out.push(a.shift())});return out}
const dot=s=>{s=String(s==null?'':s).trim();return /[.!?:”"]$/.test(s)?s:s+'.'};
/* Turns a key into a question. q: practice question, d: drag-and-drop sort card, o: sequence step ("what comes next"), s: module scenario decision, l: lab decision. */
function buildQ(k,ids){
  const [t,a,b]=String(k).split(':');let q=null;
  if(t==='q'){const m=MOD_BY[a],x=m&&m.qz[+b];if(!x)return null;
    q={k,sop:a,src:'Practice question',stem:x.q,multi:!!x.m,opts:x.o.map((o,i)=>({id:i,t:o[0],ok:!!o[1],why:o[2]||''})),ref:k,keep:x.o.length===2&&/^true$/i.test(String(x.o[0][0]).trim())}}
  else if(t==='d'){const m=MOD_BY[a],it=m&&m.dr.k==='sort'&&m.dr.i[+b];if(!it)return null;const bk=m.dr.b,c=it[1];
    q={k,sop:a,src:'Drag-and-drop card',stem:DQ[a]||'Where does this belong?',quote:it[0],opts:bk.map((nm,i)=>({id:i,t:nm,ok:i===c,why:i===c?(it[2]||''):`It goes in ${bk[c]}, not ${nm}. ${it[2]||''}`})),ref:k,cap:4,keep:true}}
  else if(t==='o'){const m=MOD_BY[a],i=+b,L=m&&m.dr.k==='order'&&m.dr.i;if(!L||!L[i+1])return null;
    q={k,sop:a,src:'Sequence step',stem:DQ[a]||'What comes right after this?',quote:L[i][0],step:i+1,
      opts:L.map((x,j)=>({id:j,t:x[0],ok:j===i+1,why:j===i+1?`Step ${i+2} of ${L.length}. ${x[1]||''}`:`That's step ${j+1} of ${L.length}, ${j<i?'earlier':'later'} in the sequence. Step ${i+2} comes right after step ${i+1}.`})).filter(o=>o.id!==i),ref:'d:'+a+':'+(i+1),cap:4}}
  else if(t==='s'||t==='l'){const sc=t==='s'?(MOD_BY[a]&&MOD_BY[a].sc):LAB_BY[a];const beat=sc&&sc.beats[b];if(!beat)return null;
    const path=mainPath(sc),pi=path.indexOf(b);let prev='';if(pi>0){const bo=sc.beats[path[pi-1]].o.find(o=>o.r===2);prev=bo?bo.t:''}
    q={k,sop:t==='s'?a:null,lab:t==='l'?a:null,src:t==='s'?'Scenario decision':'Lab decision',title:sc.title,brief:sc.brief,prev,bt:beat.t,bs:beat.s,stem:beat.q,best:true,
      opts:beat.o.map((o,i)=>({id:i,t:o.t,ok:o.r===2,why:(o.r===1?'Acceptable, but not the best call. ':'')+(o.f||'')})),ref:k}}
  if(!q||!q.opts.some(o=>o.ok))return null;
  if(ids&&ids.length){const by={};q.opts.forEach(o=>by[o.id]=o);const o=ids.map(id=>by[id]).filter(Boolean);if(o.some(x=>x.ok))q.opts=o}
  else{let o=q.opts;if(q.cap&&o.length>q.cap)o=o.filter(x=>x.ok).concat(shuffle(o.filter(x=>!x.ok)).slice(0,q.cap-1));q.opts=q.keep?o.slice().sort((x,y)=>x.id-y.id):shuffle(o)}
  q.ids=q.opts.map(o=>o.id);return q;
}
const gradeQ=(q,sel)=>{const ok=q.opts.filter(o=>o.ok).map(o=>o.id);return sel.length===ok.length&&sel.every(i=>ok.includes(i))};
const qWhere=q=>q.lab?'Lab '+q.lab+' · '+LAB_BY[q.lab].title:'SOP-GSOC-'+q.sop;
const qWhereShort=q=>q.lab?'Lab '+q.lab:'SOP-GSOC-'+q.sop;
const qMode=q=>q.multi?'Select all that apply':q.best?'Choose the best call':'Choose one';
const qText=(q,full)=>strip2((q.bt!=null?q.title+' · '+q.bt+(full?' · '+q.bs:'')+' · ':'')+(q.quote?'“'+q.quote+'” ':'')+q.stem);
const ansText=(q,ids)=>{const by={};q.opts.forEach(o=>by[o.id]=o);return ids.map(i=>by[i]?strip2(by[i].t):'').filter(Boolean).join('; ')||'(no answer)'};
const okIds=q=>q.opts.filter(o=>o.ok).map(o=>o.id);
function qBody(q){let h='';
  if(q.bt!=null)h+=`<div class="actx"><span class="rlab">${q.lab?'Lab':'Scenario'} · ${esc(q.title)}</span><p>${fmt(q.brief)}</p>${q.prev?`<p class="small"><span class="muted">Your call before this:</span> ${fmt(q.prev)}</p>`:''}<p><span class="mono" style="color:var(--amber)">${esc(q.bt)}</span> ${fmt(q.bs)}</p></div>`;
  if(q.quote)h+=`<div class="aquote">${q.step?`<span class="rlab">Step ${q.step}</span>`:''}${fmt(q.quote)}</div>`;
  return h+`<p class="q">${fmt(q.stem)}</p>`}
function missPanelB(q,sel){
  const by={};q.opts.forEach(o=>by[o.id]=o);const ok=okIds(q);const wrong=sel.filter(i=>!ok.includes(i)&&by[i]),left=ok.filter(i=>!sel.includes(i));
  let h=`<div class="miss"><p class="vt risk" style="margin:0">Missed</p><div class="mblk"><span class="rlab">Why your answer is wrong</span>`;
  h+=wrong.map(i=>`<p><b>You chose “${fmt(by[i].t)}”</b> ${fmt(by[i].why)}</p>`).join('');
  if(!sel.length)h+='<p>No answer was given.</p>';
  if(left.length&&q.multi)h+=`<p><b>You left out ${left.length===1?'one correct answer':left.length+' correct answers'}:</b> ${left.map(i=>'“'+fmt(by[i].t)+'”').join(', ')}. Every correct option has to be selected.</p>`;
  h+=`</div><div class="mblk"><span class="rlab" style="color:#A8DFC6">Correct answer</span>${ok.map(i=>`<p class="good"><b>${fmt(dot(by[i].t))}</b> <span class="fg">${fmt(by[i].why)}</span></p>`).join('')}</div>`;
  return h+refBlock(q.ref)+'</div>';
}
/* A fresh draw each attempt. Questions missed on the last attempt come back (up to half the test) so a pass shows the gap is closed. */
function drawAssess(n){
  const N=assessN(n);const prev=aList(n).slice(-1)[0];
  const carry=prev&&!prev.pass?shuffle(prev.it.filter(x=>!x[3]).map(x=>x[0])).filter(k=>buildQ(k)).slice(0,Math.floor(N/2)):[];
  let keys=[];
  if(n===13){
    const sopOf=k=>k[0]==='l'?'LAB':k.split(':')[1];const covered=new Set();let labs=0;
    for(const k of carry){const c=sopOf(k);const proj=keys.length+1+(MODS.length-[...covered,c].filter((x,i,a)=>x!=='LAB'&&a.indexOf(x)===i).length)+Math.max(0,3-labs-(c==='LAB'?1:0));if(proj>N)continue;keys.push(k);covered.add(c);if(c==='LAB')labs++}
    MODS.forEach(m=>{if(!covered.has(m.id)){const b=bankFor(m.id);keys.push(shuffle(b.q.concat(b.d,b.s))[0])}});
    shuffle(LABS).forEach(l=>{if(labs<3&&!keys.some(k=>k.startsWith('l:'+l.id+':'))){keys.push('l:'+l.id+':'+shuffle(mainPath(l))[0]);labs++}});
    const rest=shuffle(MODS.flatMap(m=>{const b=bankFor(m.id);return b.q.concat(b.d,b.s)})).filter(k=>!keys.includes(k));
    while(keys.length<N&&rest.length)keys.push(rest.shift());
  }else{
    const pools=PLAN.days[n-1].mods.map(id=>mixBank(bankFor(id)).filter(k=>!carry.includes(k)));
    keys=carry.slice();let i=0;
    while(keys.length<N&&pools.some(p=>p.length)){const p=pools[i%pools.length];if(p.length)keys.push(p.shift());i++}
  }
  const items=shuffle(keys.slice(0,N)).map(k=>{const q=buildQ(k);return q?[k,q.ids]:null}).filter(Boolean);
  return {n,items,sel:{},at:now(),carried:carry.length};
}
function missedUnique(n,st){
  const m=new Map();
  aList(n,st).forEach((a,ai)=>a.it.forEach(([k,ids,sel,ok])=>{let e=m.get(k);if(!e){if(ok)return;e={k,miss:0,last:null,fixed:false};m.set(k,e)}
    if(!ok){e.miss++;e.last={ids,sel,at:a.at,ai};e.fixed=false}else e.fixed=true}));
  return [...m.values()];
}
function missLog(st){const rows=[];
  ADAYS.forEach(n=>aList(n,st).forEach((a,ai)=>a.it.forEach(([k,ids,sel,ok])=>{if(ok)return;const q=buildQ(k,ids);if(q)rows.push({n,ai,at:a.at,q,sel})})));
  return rows.sort((x,y)=>y.at-x.at)}

/* ===================================================== router ===================================================== */
function curRoute(){return(location.hash||'#home').slice(1)||'home'}
let lastRoute='';
let REV=null;
function route(soft){
  const r=curRoute();if(r!==lastRoute)REV=null;
  document.body.classList.remove('menu');$('#menubtn').setAttribute('aria-expanded','false');
  paintRail(r);paintProgress();
  const main=$('#main');
  const scrollTop=soft&&r===lastRoute;
  let m;
  if(SAVE.mode==='loading'&&r!=='trainer'){main.innerHTML=`<p class="eyebrow">GSOC operator onboarding</p><h1>Loading your record</h1><div class="empty">Opening your training record…</div>`;lastRoute=r;return}
  if(!(S.profile&&S.profile.name)&&r!=='trainer'){viewStart(main);lastRoute=r;return}
  if(r==='home')viewHome(main);
  else if((m=r.match(/^day-(\d{1,2})$/))&&PLAN.days[+m[1]-1])viewDay(main,+m[1]);
  else if((m=r.match(/^sop-(\d{3})$/))&&MOD_BY[m[1]])viewModule(main,m[1]);
  else if(r==='lab')viewLab(main);
  else if((m=r.match(/^lab-(L\d)$/))&&LAB_BY[m[1]])viewSim(main,m[1]);
  else if((m=r.match(/^assess-(\d{1,2})$/))&&ADAYS.includes(+m[1]))viewAssess(main,+m[1]);
  else if(r==='test')viewTest(main);
  else if(r==='record')viewRecord(main);
  else if(r==='trainer')viewTrainer(main);
  else viewHome(main);
  if(!scrollTop){window.scrollTo(0,0)}
  lastRoute=r;
  if(r!=='trainer'&&S.last!==r&&/^(sop|lab-|day)/.test(r)){S.last=r;if(SAVE.mode==='local')lsSet(S)}
}
window.addEventListener('hashchange',()=>route());
$('#menubtn').onclick=e=>{e.stopPropagation();const o=document.body.classList.toggle('menu');$('#menubtn').setAttribute('aria-expanded',String(o))};

  let h=`<div class="rg">Start</div>

      if(d.lab){h+=`<a class="ni sub ${/^lab/.test(r)?'on':''}" href="#lab"><span class="n">LAB</span><span>Critical Situations Lab</span></a>`}

  $('#rail').innerHTML=h;

/* ===================================================== home ===================================================== */
function viewHome(main){
  const s=summary();const nx=nextUp();

  <section class="panel" id="panel"></section>
  <div class="btnrow" id="mnav"></div>

  const refreshScore=()=>{const s=modStatus(id);$('#mscore').innerHTML=`${s.pts}<span class="muted" style="font-size:15px">/${s.max}</span>`};
  const navBtns=(nextLabel)=>{nav.innerHTML=(step>0?`<button class="btn ghost" id="prevS">Back</button>`:prevId?`<a class="btn ghost" href="#sop-${prevId}">Previous SOP</a>`:'')+(step<5?`<button class="btn" id="nextS">${nextLabel||'Next step'}</button>`:'');const p=$('#prevS');if(p)p.onclick=()=>go(step-1);const n=$('#nextS');if(n)n.onclick=()=>go(step+1)};
  if(step===0){renderBrief(panel,m);done('brief');navBtns('Next: click and reveal')}

function renderBrief(panel,m){

  if(m.es){h+=`<h2>Escalate</h2><div class="tw"><table><thead><tr><th>When</th><th>Level</th></tr></thead><tbody>${m.es.map(e=>`<tr><td>${fmt(e[0])}</td><td>${lvBadge(e[1])}</td></tr>`).join('')}</tbody></table></div>`}
  if(m.op){h+=`<div class="ctrl amber"><span class="lab">Still open</span><p>${fmt(m.op)} Don't guess a [CONFIRM] value. Ask the Supervisor.</p></div>`.replace('[CONFIRM] value','<span class="confirm">[CONFIRM]</span> value')}

}

function renderReveal(panel,m,r,onDone){
  const seen=new Set(r.rv||[]);
  panel.innerHTML=`<p class="subline">Read the prompt, answer it in your head, then click the card to check yourself.</p>
  <div class="row" style="margin:0 0 14px"><span class="chip" id="rvc"></span><button class="btn ghost sm" id="rvall">Reveal all</button></div>
  <div class="flips">${m.rv.map((c,i)=>`<button class="flip ${seen.has(i)?'seen':''}" data-i="${i}" aria-pressed="false"><span class="face front"><span class="tag">Card ${pad2(i+1)} · ${seen.has(i)?'Seen':'Click to reveal'}</span><span class="q">${fmt(c[0])}</span><span class="hint">Tap to flip</span></span><span class="face back"><span class="tag">Answer</span><span class="a">${fmt(c[1])}</span><span class="hint">Tap to flip back</span></span></button>`).join('')}</div>`;
  const count=()=>{$('#rvc').textContent=`${seen.size} of ${m.rv.length} revealed`;if(seen.size===m.rv.length)onDone()};
  const mark=i=>{if(!seen.has(i)){seen.add(i);r.rv=[...seen];touch()}count()};
  $$('.flip').forEach(b=>b.onclick=e=>{if(e.target.closest('a'))return;const o=b.classList.toggle('open');b.setAttribute('aria-pressed',String(o));if(o){b.classList.add('seen');b.querySelector('.front .tag').textContent=`Card ${pad2(+b.dataset.i+1)} · Seen`;mark(+b.dataset.i)}});

}

/* ---------- pointer drag (mouse, pen, touch) ---------- */
function dropAt(x,y){const n=document.elementFromPoint(x,y);return n?n.closest('[data-drop]'):null}
function draggable(el,enabled,onDrop){
  el.addEventListener('pointerdown',e=>{
    if(!enabled())return;if(e.pointerType==='mouse'&&e.button!==0)return;
    const rc=el.getBoundingClientRect(),ox=e.clientX-rc.left,oy=e.clientY-rc.top,sx=e.clientX,sy=e.clientY,pid=e.pointerId;
    let ghost=null,over=null;try{el.setPointerCapture(pid)}catch(_){}
    const move=ev=>{if(ev.pointerId!==pid)return;
      if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;ghost=el.cloneNode(true);ghost.classList.add('dragghost');ghost.classList.remove('sel');ghost.style.width=rc.width+'px';document.body.appendChild(ghost);el.classList.add('lifting');document.body.classList.add('dragging')}
      ev.preventDefault();ghost.style.transform=`translate(${ev.clientX-ox}px,${ev.clientY-oy}px) rotate(-1.5deg)`;
      const t=dropAt(ev.clientX,ev.clientY);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over')}};
    const end=ev=>{if(ev.pointerId!==pid)return;el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);
      if(!ghost)return;ghost.remove();el.classList.remove('lifting');document.body.classList.remove('dragging');over&&over.classList.remove('over');el._dragEnd=performance.now();
      const t=ev.type==='pointerup'?dropAt(ev.clientX,ev.clientY):null;if(t)onDrop(t)};
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  });
}
const justDragged=el=>el._dragEnd&&performance.now()-el._dragEnd<400;

function renderSort(panel,m,r,onDone,refresh){

  const order=r.dr.order||shuffle(dr.i.map((_,i)=>i));r.dr.order=order;
  const place=r.dr.place||{};let sel=null;let locked=new Set(r.dr.locked||[]);
  panel.innerHTML=`<p class="subline">${fmt(dr.p)}</p>
  <div class="tray" data-drop="tray" id="tray"><div class="trayh"><span>Cards · <span id="left"></span> left</span><span>Drag, or tap a card then tap a box</span></div><div class="cards" id="trayc"></div></div>
  <div class="buckets">${dr.b.map((b,i)=>`<div class="bk" data-drop="b${i}" tabindex="0" role="button" aria-label="Drop into ${esc(b)}"><div class="bh">${esc(b)}</div><div class="cards" id="bk${i}"></div></div>`).join('')}</div>
  <div class="btnrow"><button class="btn" id="chk">Check</button><button class="btn ghost" id="back" hidden>Send misses back</button><button class="btn ghost" id="reset">Reset</button><span class="chip" id="dscore"></span></div>
  <p class="msg small" id="dmsg" style="margin-top:12px"></p>`;
  const cards={};
  order.forEach(i=>{const c=document.createElement('button');c.className='dc';c.dataset.i=i;c.innerHTML=`<span>${fmt(dr.i[i][0])}</span>`;cards[i]=c;
    draggable(c,()=>!locked.has(i),t=>put(i,t.dataset.drop));
    c.addEventListener('click',e=>{e.stopPropagation();if(justDragged(c)||locked.has(i))return;if(sel===i){sel=null;c.classList.remove('sel')}else{$$('.dc.sel').forEach(x=>x.classList.remove('sel'));sel=i;c.classList.add('sel')}panel.classList.toggle('armed',sel!==null)})});
  const put=(i,dest)=>{const c=cards[i];c.classList.remove('sel','no');sel=null;panel.classList.remove('armed');
    if(dest==='tray'){delete place[i];$('#trayc').appendChild(c)}else{place[i]=+dest.slice(1);$('#bk'+place[i]).appendChild(c)}
    r.dr.place=place;$('#left').textContent=dr.i.length-Object.keys(place).length;touch()};
  order.forEach(i=>{if(place[i]!=null)$('#bk'+place[i]).appendChild(cards[i]);else $('#trayc').appendChild(cards[i]);if(locked.has(i))mark(i,true)});
  $('#left').textContent=dr.i.length-Object.keys(place).length;
  $$('[data-drop]').forEach(z=>{z.addEventListener('click',e=>{if(e.target.closest('.dc'))return;if(sel!==null)put(sel,z.dataset.drop)});z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===z&&sel!==null){e.preventDefault();put(sel,z.dataset.drop)}})});
  function mark(i,ok){const c=cards[i];c.classList.toggle('ok',ok);c.classList.toggle('no',!ok);c.querySelectorAll('.why,.rsm').forEach(w=>w.remove());const rk='d:'+m.id+':'+i;
    if(ok){if(dr.i[i][2])c.insertAdjacentHTML('beforeend',`<span class="why good">${fmt(dr.i[i][2])}</span>`)}
    else c.insertAdjacentHTML('beforeend',`<span class="why risk"><b>Not ${esc(dr.b[place[i]]||'that box')}.</b> It goes in <b>${esc(dr.b[dr.i[i][1]])}</b>. ${fmt(dr.i[i][2]||'')}</span>`);
    c.insertAdjacentHTML('beforeend',`<span class="rsm">${esc(refShort(rk))}</span>`)}
  const sc=()=>{if(r.dr.first)$('#dscore').textContent=`First check: ${r.dr.first.ok}/${r.dr.first.tot||dr.i.length}`};sc();
  $('#chk').onclick=()=>{
    const left=dr.i.length-Object.keys(place).length;if(left){$('#dmsg').innerHTML=`<span class="risk">${left} card${left>1?'s':''} still in the tray. Place every card, then check.</span>`;return}
    let ok=0,miss=0;dr.i.forEach((it,i)=>{const good=place[i]===it[1];if(good){ok++;locked.add(i)}else miss++;mark(i,good)});
    r.dr.locked=[...locked];
    if(!r.dr.first){r.dr.first={ok,tot:dr.i.length,place:Object.assign({},place),t:now()};refresh()}
    r.dr.tries=(r.dr.tries||0)+1;sc();
    if(miss){$('#back').hidden=false;$('#dmsg').innerHTML=`${ok} of ${dr.i.length} right. Each red card now says why it's in the wrong box, where it belongs, and the Field Manual page to check. Send them back and place them again. Your first check is what's scored.`}
    else{$('#back').hidden=true;r.dr.done=now();$('#dmsg').innerHTML=`<span class="good">All ${dr.i.length} placed correctly.</span> Read the reason under each card, then move on.`;onDone()}
    touch();
  };
  $('#back').onclick=()=>{dr.i.forEach((it,i)=>{if(!locked.has(i)&&place[i]!=null)put(i,'tray')});$('#back').hidden=true;$('#dmsg').textContent='Misses are back in the tray.'};
  $('#reset').onclick=()=>{dr.i.forEach((it,i)=>{if(!locked.has(i))put(i,'tray')});$('#dmsg').textContent=''};
  if(r.dr.done){$('#dmsg').innerHTML='<span class="good">Completed.</span> You can review the reasons on each card.'}
}

function renderOrder(panel,m,r,onDone,refresh){
  const dr=m.dr;r.dr=r.dr||{};
  let cur=r.dr.cur;
  if(!cur){cur=shuffle(dr.i.map((_,i)=>i));if(cur.every((v,i)=>v===i))cur=cur.slice().reverse()}
  r.dr.cur=cur;let checked=!!r.dr.done;
  panel.innerHTML=`<p class="subline">${fmt(dr.p)}</p>
  <ul class="olist" id="ol"></ul>
  <div class="btnrow"><button class="btn" id="chk">Check order</button><span class="chip" id="dscore"></span></div>
  <p class="small" id="dmsg" style="margin-top:12px"></p>`;
  const ol=$('#ol');
  const paint=(res)=>{ol.innerHTML='';cur.forEach((i,pos)=>{const li=document.createElement('li');li.className='oi'+(res?(res[pos]?' ok':' no'):'');li.dataset.i=i;
      li.innerHTML=`<span class="pos">${pos+1}</span><span class="hd" aria-hidden="true"></span><span class="tx">${fmt(dr.i[i][0])}${res&&res[pos]&&dr.i[i][1]?`<span class="why good" style="display:block;padding:0">${fmt(dr.i[i][1])}</span>`:''}${res&&!res[pos]?`<span class="why risk" style="display:block;padding:0">Not step ${pos+1}. This belongs at <b>step ${i+1}</b>. ${fmt(dr.i[i][1]||'')}</span><span class="rsm">${esc(refShort('d:'+m.id+':'+i))}</span>`:''}</span><span class="ar"><button aria-label="Move up" data-u="${pos}">↑</button><button aria-label="Move down" data-d="${pos}">↓</button></span>`;
      ol.appendChild(li)});
    ol.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const p=+b.dataset.u;if(p>0){[cur[p-1],cur[p]]=[cur[p],cur[p-1]];after()}});
    ol.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const p=+b.dataset.d;if(p<cur.length-1){[cur[p+1],cur[p]]=[cur[p],cur[p+1]];after()}});
    ol.querySelectorAll('.hd').forEach(hd=>dragRow(hd.parentElement));};
  const after=()=>{r.dr.cur=cur;touch();paint(null)};
  function dragRow(li){const hd=li.querySelector('.hd');
    hd.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();const pid=e.pointerId;try{hd.setPointerCapture(pid)}catch(_){}
      li.classList.add('lifting');document.body.classList.add('dragging');
      const from=[...ol.children].indexOf(li);let to=from;
      const move=ev=>{if(ev.pointerId!==pid)return;const items=[...ol.children];let t=items.length-1;for(let k=0;k<items.length;k++){const b=items[k].getBoundingClientRect();if(ev.clientY<b.top+b.height/2){t=k;break}}
        if(t!==to){to=t;items.forEach((x,k)=>x.classList.toggle('ph',k===to&&k!==from))}};
      const end=ev=>{if(ev.pointerId!==pid)return;hd.removeEventListener('pointermove',move);hd.removeEventListener('pointerup',end);hd.removeEventListener('pointercancel',end);document.body.classList.remove('dragging');
        if(to!==from){const v=cur.splice(from,1)[0];cur.splice(to,0,v);after()}else{li.classList.remove('lifting');[...ol.children].forEach(x=>x.classList.remove('ph'))}};
      hd.addEventListener('pointermove',move);hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);});}
  const sc=()=>{if(r.dr.first)$('#dscore').textContent=`First check: ${r.dr.first.ok}/${r.dr.first.tot||dr.i.length} in place`};
  paint(checked?cur.map((v,p)=>v===p):null);sc();
  $('#chk').onclick=()=>{const res=cur.map((v,p)=>v===p);const ok=res.filter(Boolean).length;
    if(!r.dr.first){r.dr.first={ok,tot:dr.i.length,cur:cur.slice(),t:now()};refresh()}
    r.dr.tries=(r.dr.tries||0)+1;paint(res);sc();
    if(ok===dr.i.length){r.dr.done=now();$('#dmsg').innerHTML='<span class="good">Correct order.</span>';onDone()}
    else $('#dmsg').innerHTML=`${ok} of ${dr.i.length} in the right position. Each red step shows where it belongs and the Field Manual page to check. Move them and check again. Your first check is what's scored.`;
    touch()};
  if(checked)$('#dmsg').innerHTML='<span class="good">Completed.</span>';
}

/* ---------- branching scenario (modules and lab) ---------- */
const RLAB=['Risky','Acceptable','Best call'];
function renderScenario(panel,sc,r,key,onDone,refresh,ctxId,isLab){
  r[key]=r[key]||{};const S2=r[key];S2.explored=S2.explored||{};
  let run=[];let beat=sc.start;
  panel.innerHTML=`${isLab?'':`<p class="subline">${esc(sc.title)}. Make the call at each moment. Your choices change what happens next. Your first full run is scored. After that, replay to explore the other paths.</p>`}
  <div class="feed"><div class="feedh"><span>${esc(sc.title)}</span><span id="runlab">${S2.first?'Replay · not scored':'Scored run'}</span></div>
  <div class="fr ch"><div class="t">Brief</div><div>${fmt(sc.brief)}</div></div><div id="beats"></div></div>
  <div id="decide"></div><div id="sdeb"></div>`;
  const host=$('#beats'),dec=$('#decide');
  const showBeat=()=>{const b=sc.beats[beat];
    host.insertAdjacentHTML('beforeend',`<div class="fr now enter"><div class="t">${esc(b.t)}</div><div>${fmt(b.s)}</div></div>`);
    dec.innerHTML=`<p class="q">${fmt(b.q)}</p><div class="opts">${b.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span class="ot">${fmt(o.t)}</span></button>`).join('')}</div>`;
    dec.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>choose(+btn.dataset.i));
  };
  const choose=i=>{const b=sc.beats[beat],o=b.o[i];
    (S2.explored[beat]=S2.explored[beat]||[]).includes(i)||S2.explored[beat].push(i);
    run.push([beat,i,o.r]);
    dec.querySelectorAll('.opt').forEach((btn,k)=>{btn.disabled=true;if(k===i)btn.classList.add(o.r===2?'right':o.r===1?'part':'wrong')});
    const last=host.lastElementChild;last.classList.remove('now');
    host.insertAdjacentHTML('beforeend',`<div class="fr r${o.r} enter"><div class="t">${o.r===2?'✓':o.r===1?'~':'✕'}</div><div><b>${RLAB[o.r]}.</b> ${fmt(o.t)}<span class="why" style="display:block;padding:0;margin-top:5px">${o.r<2?'<b>Why this is '+(o.r===1?'not the best call':'wrong')+':</b> ':''}${fmt(o.f)}</span>${o.r<2?(()=>{const best=b.o.find(x=>x.r===2);return best?`<span class="why good" style="display:block;padding:0;margin-top:6px"><b>Best call:</b> ${fmt(best.t)}</span>`:''})():''}${refBlock((isLab?'l:':'s:')+ctxId+':'+beat,o.r<2?'Where to find it in the Field Manual':'Source in the Field Manual')}</div></div>`);
    dec.insertAdjacentHTML('beforeend',`<div class="btnrow" style="margin-top:6px"><button class="btn" id="cont">${o.n?'Continue':'See the debrief'}</button></div>`);
    $('#cont').onclick=()=>{if(o.n){beat=o.n;showBeat();$('#cont')&&$('#cont').remove();host.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'})}else finish()};
    touch();
  };
  const finish=()=>{const sum=run.reduce((a,x)=>a+x[2],0),n=run.length;
    const firstRun=!S2.first;if(firstRun){S2.first={sum,n,path:run.slice(),t:now()};refresh&&refresh()}
    S2.runs=(S2.runs||0)+1;S2.last={sum,n,path:run.slice(),t:now()};touch();
    dec.innerHTML='';const pct=Math.round(100*sum/(2*n));
    const totalOpts=Object.values(sc.beats).reduce((a,b)=>a+b.o.length,0);const seen=Object.values(S2.explored).reduce((a,v)=>a+v.length,0);
    $('#sdeb').innerHTML=`<div class="card"><div class="result"><div><div class="score">${pct}%</div><div class="mono muted" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px">${firstRun?'Scored run':'This replay'}${S2.first&&!firstRun?` · scored run ${Math.round(100*S2.first.sum/(2*S2.first.n))}%`:''}</div></div>
      <div class="meter"><i style="width:${pct}%;background:${pct>=MASTERY?'var(--good)':pct>=50?'var(--amber)':'var(--bad)'}"></i></div></div>
      ${isLab&&sc.debrief?`<h3 style="margin-top:16px">Carry this onto the floor</h3><ul style="margin:0">${sc.debrief.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`:''}
      <h3 style="margin-top:16px">Paths explored · ${seen} of ${totalOpts} choices</h3>
      <div class="explore">${Object.entries(sc.beats).map(([k,b])=>`<div class="exrow"><span class="t">${esc(b.t)}</span><div class="dots">${b.o.map((o,i)=>`<span class="${(S2.explored[k]||[]).includes(i)?'r'+o.r:''}" title="${esc(o.t)}">${String.fromCharCode(65+i)}${(S2.explored[k]||[]).includes(i)?' '+(o.r===2?'✓':o.r===1?'~':'✕'):''}</span>`).join('')}</div></div>`).join('')}</div>
      <p class="small muted" style="margin-top:10px">Green is the best call, amber is acceptable, red is risky. Replay to try the paths you haven't seen. Replays aren't scored.</p>
      <div class="btnrow"><button class="btn ghost" id="replay">Replay and explore another path</button></div></div>`;
    $('#replay').onclick=()=>{renderScenario(panel,sc,r,key,onDone,refresh,ctxId,isLab)};
    onDone&&onDone();
  };
  showBeat();
}

/* ---------- practice check ---------- */
function renderQuiz(panel,m,r,onDone,refresh){
  r.qz=r.qz||{};let qi=r.qi||0;if(qi>=m.qz.length)qi=0;
  const draw=()=>{
    const q=m.qz[qi],ans=r.qz[qi];const multi=!!q.m;
    const pips=m.qz.map((x,i)=>{const a=r.qz[i];return `<span class="pip ${a?(a.ok?'ok':'no'):(i===qi?'cur':'')}"></span>`}).join('');
    panel.innerHTML=`<div class="row" style="justify-content:space-between;margin:0 0 14px"><div class="pips">${pips}</div><span class="chip">${Object.values(r.qz).filter(x=>x.ok).length} correct of ${Object.keys(r.qz).length} answered</span></div>
    <div class="card"><p class="mono muted" style="font-size:10.5px;margin:0 0 6px">QUESTION ${qi+1} OF ${m.qz.length} · ${multi?'SELECT ALL THAT APPLY':'CHOOSE ONE'}</p><p class="q">${fmt(q.q)}</p>
    <div class="opts" id="qo">${q.o.map((o,i)=>`<button class="opt" data-i="${i}" role="${multi?'checkbox':'radio'}" aria-checked="false"><span class="k">${multi?'▢':String.fromCharCode(65+i)}</span><span class="ot">${fmt(o[0])}</span></button>`).join('')}</div>
    <div class="btnrow"><button class="btn" id="qs">Submit answer</button><span class="small muted" id="qmsg"></span></div><div id="qv"></div></div>
    <div class="btnrow"><button class="btn ghost" id="qp" ${qi===0?'disabled':''}>Previous question</button><button class="btn ghost" id="qn" ${qi===m.qz.length-1?'disabled':''}>Next question</button></div>`;
    const sel=new Set();
    const btns=[...panel.querySelectorAll('#qo .opt')];
    const reveal=(chosen)=>{const okSet=new Set(q.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0));const right=chosen.length===okSet.size&&chosen.every(i=>okSet.has(i));
      btns.forEach((b,i)=>{b.disabled=true;const isOk=okSet.has(i),picked=chosen.includes(i);
        b.classList.add(isOk?'right':picked?'wrong':'x');
        b.querySelector('.k').textContent=isOk?'✓':picked?'✕':String.fromCharCode(65+i);
        b.querySelector('.ot').insertAdjacentHTML('beforeend',`<span class="ex"><span class="tagr ${isOk?'good':picked?'risk':'muted'}">${isOk?'Correct':picked?'Your pick':'Not this'}</span>${fmt(q.o[i][2]||'')}</span>`)});
      $('#qs').hidden=true;
      const qkey='q:'+m.id+':'+qi;
      $('#qv').innerHTML=(right?`<div class="verdict"><p class="vt good">Correct</p><p class="small" style="margin:0">${fmt(q.o.find(o=>o[1])[2])}</p>${refBlock(qkey,'Source in the Field Manual')}</div>`:missPanel(q,chosen,qkey))+(qi<m.qz.length-1?'<div class="btnrow"><button class="btn" id="qnext">Next question</button></div>':'');
      const nb=$('#qnext');if(nb)nb.onclick=()=>{qi++;r.qi=qi;draw()};
      return right;};
    if(ans){reveal(ans.sel)}
    else{btns.forEach((b,i)=>b.onclick=()=>{if(multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i));b.setAttribute('aria-checked',String(sel.has(i)));b.querySelector('.k').textContent=sel.has(i)?'▣':'▢'}else{sel.clear();sel.add(i);btns.forEach((x,k)=>{x.classList.toggle('sel',k===i);x.setAttribute('aria-checked',String(k===i))})}});
      $('#qs').onclick=()=>{if(!sel.size){$('#qmsg').textContent='Choose an answer first.';return}const chosen=[...sel].sort((a,b)=>a-b);const ok=reveal(chosen);r.qz[qi]={sel:chosen,ok,t:now()};touch();refresh();
        draw2();if(Object.keys(r.qz).length===m.qz.length)onDone()}}
    $('#qp').onclick=()=>{qi--;r.qi=qi;draw()};$('#qn').onclick=()=>{qi++;r.qi=qi;draw()};
    const draw2=()=>{panel.querySelector('.pips').innerHTML=m.qz.map((x,i)=>{const a=r.qz[i];return `<span class="pip ${a?(a.ok?'ok':'no'):(i===qi?'cur':'')}"></span>`}).join('');panel.querySelector('.chip').textContent=`${Object.values(r.qz).filter(x=>x.ok).length} correct of ${Object.keys(r.qz).length} answered`};
    if(Object.keys(r.qz).length===m.qz.length)onDone();
  };
  draw();
}

/* ---------- debrief ---------- */

  panel.innerHTML=`<div class="card"><div class="result"><div><div class="score">${s.pct}%</div><div class="mono muted" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px">${s.pts} of ${s.max} points</div></div><div class="meter"><i style="width:${s.pct}%;background:${s.pct>=MASTERY?'var(--good)':s.pct>=50?'var(--amber)':'var(--bad)'}"></i></div>${status}</div>
  <div class="tw" style="margin-top:16px"><table><thead><tr><th>Part</th><th class="num">Score</th><th>Counts</th></tr></thead><tbody>

  <tr><td>Scenario</td><td class="num">${s.sp}/6</td><td class="small muted">${r.sc&&r.sc.first?'First full run, '+r.sc.first.n+' decisions':'Not run yet'}</td></tr>
  <tr><td>Practice check</td><td class="num">${s.qp}/${s.qmax}</td><td class="small muted">First answer to each question</td></tr></tbody></table></div>
  ${(r.hist||[]).length?`<p class="small muted" style="margin:0">Earlier attempts: ${r.hist.map((h,i)=>`#${i+1} ${h.pct}%`).join(' · ')}</p>`:''}</div>
  ${missed.length?`<h2>Questions to look at again</h2>${missed.map(x=>`<div class="card"><p class="q" style="margin-bottom:0">${fmt(x.q.q)}</p>${missPanel(x.q,x.a.sel,'q:'+m.id+':'+x.i)}</div>`).join('')}`:''}
  <h2>Controls to carry onto the floor</h2>${(m.ct||[]).map(c=>`<div class="ctrl ${m.crit?'red':''}"><span class="lab">Control</span><p>${fmt(c)}</p></div>`).join('')}
  <h2>My notes</h2><p class="small muted">Like the lined space on the Field Manual page. Site quirks, numbers you keep reaching for, questions for your mentor. Saved with your record.</p>
  <textarea id="notes" rows="5" maxlength="4000" placeholder="Yours to fill in.">${esc(S.notes[m.id]||'')}</textarea>
  <div class="btnrow">${!nextId?`<a class="btn" href="#lab">Open the Critical Situations Lab</a>`:MOD_BY[nextId].day!==m.day&&!passed(m.day)?`<a class="btn" href="#assess-${m.day}">Next: Day ${m.day} assessment</a>`:`<a class="btn" href="#sop-${nextId}">Next: SOP-GSOC-${nextId}</a>`}<a class="btn ghost" href="#day-${m.day}">Back to Day ${m.day}</a>${s.complete?`<button class="btn ghost" id="retake">Retake this module</button>`:''}</div>
  <div id="retakeconfirm"></div>`;
  let nt=null;$('#notes').addEventListener('input',e=>{clearTimeout(nt);nt=setTimeout(()=>{S.notes[m.id]=e.target.value;touch()},700)});
  const rt=$('#retake');if(rt)rt.onclick=()=>{$('#retakeconfirm').innerHTML=`<div class="card" style="margin-top:12px"><p style="margin:0 0 10px">Start a new attempt? This attempt's ${s.pct}% stays in your history and your trainer still sees it.</p><div class="row"><button class="btn" id="rtyes">Start new attempt</button><button class="btn ghost" id="rtno">Cancel</button></div></div>`;
    $('#rtno').onclick=()=>{$('#retakeconfirm').innerHTML=''};
    $('#rtyes').onclick=()=>{const old=S.mods[m.id];const hist=(old.hist||[]).concat([{pct:s.pct,pts:s.pts,max:s.max,at:now(),qz:old.qz,dr:old.dr&&old.dr.first,sc:old.sc&&old.sc.first}]).slice(-5);
      S.mods[m.id]={st:{brief:old.st.brief,reveal:old.st.reveal},rv:old.rv,dr:null,sc:null,qz:{},att:(old.att||1)+1,hist,step:2,started:now()};touch();route()}};
}

/* ===================================================== lab ===================================================== */
function viewLab(main){

  if(kind==='full'){pool.forEach(m=>{const i=Math.floor(Math.random()*m.qz.length);items.push([m.id,i])});
    const rest=shuffle(pool.flatMap(m=>m.qz.map((_,i)=>[m.id,i])).filter(x=>!items.some(y=>y[0]===x[0]&&y[1]===x[1])));items=items.concat(rest.slice(0,30-items.length))}
  else items=shuffle(pool.flatMap(m=>m.qz.map((_,i)=>[m.id,i]))).slice(0,20);
  return {kind,items:shuffle(items),sel:{},started:now()};
}

    $('#tres').innerHTML=`<div class="card" style="margin-top:16px"><div class="result"><div><div class="score">${pct}%</div><div class="mono muted" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px">${ok} of ${T.items.length} correct</div></div><div class="meter"><i style="width:${pct}%;background:${pct>=MASTERY?'var(--good)':'var(--amber)'}"></i></div><span class="pill ${pct>=MASTERY?'ok':'lo'}">${pct>=MASTERY?'At target':'Below '+MASTERY+'%'}</span></div><p class="small" style="margin:12px 0 0">Scroll up: every question you missed shows why your answer was wrong, the correct answer, and the Field Manual page and section to read. ${pct<MASTERY?'Revisit the SOPs behind your misses before you retake it.':''}</p></div>`;
    $('#tres').scrollIntoView({behavior:'smooth',block:'start'})};
}

/* ===================================================== my record ===================================================== */
function answerLog(st,mods){
  const rows=[];
  (mods||MODS).forEach(m=>{const r=st.mods&&st.mods[m.id];if(!r)return;
    if(r.dr&&r.dr.first)rows.push([m.id,'Drag and drop',m.dr.p,`First check ${r.dr.first.ok}/${r.dr.first.tot}`,r.dr.first.ok===r.dr.first.tot?'Correct':'Partly correct',r.dr.first.t,'','']);
    if(r.sc&&r.sc.first){r.sc.first.path.forEach(([b,i,rr])=>{const beat=m.sc.beats[b];if(beat){const best=beat.o.find(o=>o.r===2);rows.push([m.id,'Scenario · '+beat.t,beat.q,beat.o[i]?beat.o[i].t:'',RLAB[rr],r.sc.first.t,refShort('s:'+m.id+':'+b),best?best.t:''])}})}
    Object.entries(r.qz||{}).forEach(([qi,a])=>{const q=m.qz[qi];if(q)rows.push([m.id,'Practice check',q.q,a.sel.map(i=>q.o[i][0]).join('; '),a.ok?'Correct':'Incorrect',a.t,refShort('q:'+m.id+':'+qi),q.o.filter(o=>o[1]).map(o=>o[0]).join('; ')])});
  });
  return rows;
}
const strip2=s=>String(s).replace(/<[^>]+>/g,'').replace(/\{L(\d)\}/g,'Level $1').replace(/\{s(\d{3})\}/g,'SOP-$1');
function recordTable(st,prefix){
  return `<div class="tw"><table><thead><tr><th>SOP</th><th>Module</th><th>Status</th><th class="num">Drill</th><th class="num">Scenario</th><th class="num">Check</th><th class="num">Score</th><th class="num">Tries</th></tr></thead><tbody>${MODS.map(m=>{
    const r=st.mods&&st.mods[m.id];const save=S;S=st;const s=modStatus(m.id);S=save;
    const stt=!s.started?'<span class="muted">Not started</span>':!s.complete?`<span class="pill ip">${s.steps}/5</span>`:s.pct>=MASTERY?'<span class="pill ok">Mastered</span>':'<span class="pill lo">Below</span>';
    return `<tr><td class="mono">${m.id}</td><td>${r?`<button class="rowbtn" data-x="${prefix}${m.id}">${esc(m.title)}</button>`:esc(m.title)}</td><td>${stt}</td><td class="num">${r&&r.dr&&r.dr.first?r.dr.first.ok+'/'+(r.dr.first.tot||m.dr.i.length):'·'}</td><td class="num">${r&&r.sc&&r.sc.first?scenPts(r.sc.first)+'/6':'·'}</td><td class="num">${r?Object.values(r.qz||{}).filter(x=>x.ok).length+'/'+Object.keys(r.qz||{}).length:'·'}</td><td class="num">${s.started?s.pct+'%':'·'}</td><td class="num">${r?(r.att||1):'·'}</td></tr>
    <tr hidden id="${prefix}${m.id}"><td colspan="8" style="background:#020306">${detailHTML(st,m)}</td></tr>`}).join('')}</tbody></table></div>`;
}
function detailHTML(st,m){
  const rows=answerLog(st,[m]);const r=st.mods[m.id];
  return `${rows.length?`<table class="log"><thead><tr><th>Part</th><th>Question or decision</th><th>Answer given</th><th>Result</th><th>Reference</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="small">${esc(x[1])}</td><td class="small">${esc(strip2(x[2]))}</td><td class="small">${esc(strip2(x[3]))}</td><td class="small ${/^(Correct|Best)/.test(x[4])?'good':/Accept|Partly/.test(x[4])?'warn':'risk'}">${esc(x[4])}</td><td class="small mono" style="font-size:10.5px">${esc(x[6]||'')}</td></tr>`).join('')}</tbody></table>`:'<p class="small muted">No answers yet.</p>'}
  ${r&&r.hist&&r.hist.length?`<p class="small muted" style="margin:8px 0 0">Earlier attempts: ${r.hist.map((h,i)=>`#${i+1} ${h.pct}% (${fmtDate(h.at)})`).join(' · ')}</p>`:''}
  ${st.notes&&st.notes[m.id]?`<p class="small" style="margin:8px 0 0"><span class="muted">Notes:</span> ${esc(st.notes[m.id])}</p>`:''}`;
}
function bindRows(scope){scope.querySelectorAll('.rowbtn[data-x]').forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.x);t.hidden=!t.hidden})}
function recordCSV(st,who){
  const sd=st.profile&&st.profile.start||'';
  const iso=t=>t?new Date(t).toISOString():'';
  const head=[['Trainee','Start date','SOP','Part','Question or decision','Answer given','Correct answer','Result','Reference (Field Manual page or SOP section)','When']];
  const rows=answerLog(st).map(x=>[who,sd,'SOP-GSOC-'+x[0],x[1],strip2(x[2]),strip2(x[3]),strip2(x[7]||''),x[4],x[6]||'',iso(x[5])]);
  LABS.forEach(l=>{const x=st.lab&&st.lab[l.id];if(x&&x.first)x.first.path.forEach(([b,i,rr])=>{const beat=l.beats[b];if(beat){const best=beat.o.find(o=>o.r===2);rows.push([who,sd,'Lab '+l.id,'Lab · '+l.title+' · '+beat.t,strip2(beat.q),strip2(beat.o[i].t),best?strip2(best.t):'',RLAB[rr],refShort('l:'+l.id+':'+b),iso(x.first.t)])}})});
  ADAYS.forEach(n=>aList(n,st).forEach((a,ai)=>{const part=`Day ${n} assessment · attempt ${ai+1}`;
    rows.push([who,sd,'',part,'Attempt result','',`${Math.ceil(a.n*MASTERY/100)} of ${a.n} to pass`,`${a.ok}/${a.n} · ${a.pct}% · ${a.pass?'Passed':'Not passed'}`,'',iso(a.at)]);
    a.it.forEach(([k,ids,sel,ok])=>{const q=buildQ(k,ids);if(q)rows.push([who,sd,q.lab?'Lab '+q.lab:'SOP-GSOC-'+q.sop,part+' · '+q.src,qText(q,true),ansText(q,sel),ansText(q,okIds(q)),ok?'Correct':'Incorrect',refShort(q.ref),iso(a.at)])})}));
  (st.tests||[]).forEach(t=>{rows.push([who,sd,'',t.kind==='full'?'Full practice test':'Week 1 check','','','',`${t.ok}/${t.n} · ${t.pct}%`,'',iso(t.at)]);(t.log||[]).forEach(([mid,qi,sel,ok])=>{const q=MOD_BY[mid]&&MOD_BY[mid].qz[qi];if(q)rows.push([who,sd,'SOP-GSOC-'+mid,(t.kind==='full'?'Full practice test':'Week 1 check')+' question',strip2(q.q),sel.map(i=>strip2(q.o[i][0])).join('; '),q.o.filter(o=>o[1]).map(o=>strip2(o[0])).join('; '),ok?'Correct':'Incorrect',refShort('q:'+mid+':'+qi),iso(t.at)])})});
  return toCSV(head.concat(rows));
}
function missCSV(st,who,head){const sd=st.profile&&st.profile.start||'';
  const rows=missLog(st).map(x=>[who,sd,'Day '+x.n,x.ai+1,new Date(x.at).toISOString(),x.q.lab?'Lab '+x.q.lab:'SOP-GSOC-'+x.q.sop,x.q.src,qText(x.q,true),ansText(x.q,x.sel),ansText(x.q,okIds(x.q)),refShort(x.q.ref)]);
  return (head?[['Trainee','Start date','Day','Attempt','When','Source','Question type','Question','Answer given','Correct answer','Reference (Field Manual page or SOP section)']]:[]).concat(rows)}
function viewRecord(main){
  const s=summary();
  main.innerHTML=`${noticeHTML()}<p class="eyebrow">My record</p><h1>My training record</h1>
  <p class="subline">Every answer you've given, whether it was right, and your scores. ${SAVE.mode==='db'?'This is the same record your trainer sees.':'This record is saved in this browser only.'}</p>
  <div class="stats"><div class="stat"><b>${s.done}/${MODS.length}</b><span>Modules done</span></div><div class="stat"><b>${s.avg==null?'··':s.avg+'%'}</b><span>Module average</span></div><div class="stat"><b>${s.lab}/${LABS.length}</b><span>Lab</span></div><div class="stat"><b>${s.days}/${ADAYS.length}</b><span>Days passed</span></div><div class="stat"><b>${s.miss}</b><span>Assessment misses</span></div></div>
  <div class="btnrow" style="margin:0 0 6px"><button class="btn ghost" id="exp">Export my answers (CSV)</button></div>
  <h2>End-of-day assessments</h2><p class="small muted">${MASTERY}% to pass. Every attempt counts toward this record, passed or not.</p>${assessTable(S,true)}
  <h2>Missed questions log</h2><p class="small muted">Every question missed on an end-of-day assessment, newest first, with the answer given, the correct answer and the Field Manual page. It stays on the record after you pass, for review and improvement.</p>${missLogTable(S)}
  <h2>Modules</h2><p class="small muted">Click a module to see each answer.</p>${recordTable(S,'me')}
  <h2>Critical Situations Lab</h2><div class="tw"><table><thead><tr><th>Sim</th><th>Title</th><th class="num">Scored run</th><th class="num">Replays</th></tr></thead><tbody>${LABS.map(l=>{const x=S.lab[l.id];return `<tr><td class="mono">${l.id}</td><td>${esc(l.title)}</td><td class="num">${x&&x.first?Math.round(100*x.first.sum/(2*x.first.n))+'%':'·'}</td><td class="num">${x&&x.runs?Math.max(0,x.runs-1):'·'}</td></tr>`}).join('')}</tbody></table></div>
  ${strip('My record','')}`;
  bindRows(main);
  $('#exp').onclick=()=>saveFile('gsoc-training-record.csv',recordCSV(S,S.profile.name||'Me'));
}

/* ===================================================== trainer roster ===================================================== */
let ROSTER=null,ROSTER_UNSUB=null,PICK=null,NAMES={};
function viewTrainer(main){
  if(!(SAVE.canEdit&&SAVE.db)){main.innerHTML=`<h1>Trainee roster</h1><div class="empty">The roster is for trainers with edit access to this page.</div>`;return}
  if(!ROSTER_UNSUB){ROSTER_UNSUB=SAVE.db.collection('trainees').onSnapshot(async snap=>{ROSTER=snap.docs.map(d=>({id:d.id,st:d.data()}));NAMES=await nameOf(ROSTER.map(x=>x.id));if(curRoute()==='trainer')route(true)},e=>{ROSTER=ROSTER||[];if(curRoute()==='trainer')route(true)})}
  if(ROSTER===null){main.innerHTML=`<p class="eyebrow">Trainer</p><h1>Trainee roster</h1><div class="empty">Loading trainee records…</div>`;setTimeout(()=>{if(ROSTER===null&&curRoute()==='trainer'){main.querySelector('.empty').textContent='Can’t reach the training records yet. They’ll appear here when the connection answers.'}},10000);return}
  const save=S;
  const nameFor=x=>(x.st.profile&&x.st.profile.name)||NAMES[x.id]||'Not started yet';
  const rows=ROSTER.map(x=>{S=Object.assign(blank(),x.st);const s=summary();const nd=nextUp();S=save;return {x,s,nd}}).sort((a,b)=>(b.s.at||0)-(a.s.at||0));
  main.innerHTML=`<p class="eyebrow">Trainer · ${rows.length} trainee record${rows.length===1?'':'s'}</p><h1>Trainee roster</h1>
  <p class="subline">Every trainee who has opened this portal. Click a name to see their answers, scores and attempts, and to sign off days.</p>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Trainee</th><th>Start date</th><th class="num">Done</th><th class="num">Mastered</th><th class="num">Avg</th><th class="num">Lab</th><th class="num">Days passed</th><th class="num">Misses</th><th>Working on</th><th>Last active</th></tr></thead><tbody>${rows.map(({x,s,nd})=>`<tr><td><button class="rowbtn" data-pick="${esc(x.id)}">${esc(nameFor(x))}</button></td><td class="mono">${esc(x.st.profile&&x.st.profile.start||'·')}</td><td class="num">${s.done}/${MODS.length}</td><td class="num">${s.mast}</td><td class="num">${s.avg==null?'·':s.avg+'%'}</td><td class="num">${s.lab}/${LABS.length}</td><td class="num">${s.days}/${ADAYS.length}</td><td class="num">${s.miss}</td><td class="small">${nd?nd.type==='mod'?'SOP-'+nd.id:nd.type==='lab'?'Lab':'Day '+nd.d+' assessment':'Ready for Day 14'}</td><td class="mono small">${fmtDate(s.at)}</td></tr>`).join('')}</tbody></table></div>
  <div class="btnrow"><button class="btn ghost" id="rexp">Export roster (CSV)</button><button class="btn ghost" id="aexp">Export every answer (CSV)</button><button class="btn ghost" id="mexp">Export missed questions (CSV)</button></div>
  ${mostMissedHTML()}`:'<div class="empty">No trainee has opened the portal yet. Share this page with trainees at Contributor level so their progress saves here.</div>'}
  <div id="pick"></div>${strip('Trainer roster','')}`;
  main.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{PICK=b.dataset.pick;renderPick(true)});
  const rx=$('#rexp');if(rx)rx.onclick=()=>saveFile('gsoc-trainee-roster.csv',toCSV([['Trainee','Start date','Modules done','Mastered','Average %','Lab done','Days passed','Assessment misses'].concat(ADAYS.map(n=>'Day '+n+' best %'),ADAYS.map(n=>'Day '+n+' attempts'),['Last active'])].concat(rows.map(({x,s})=>{const st=Object.assign(blank(),x.st);return [nameFor(x),x.st.profile&&x.st.profile.start,s.done,s.mast,s.avg,s.lab,s.days,s.miss].concat(ADAYS.map(n=>bestPct(n,st)),ADAYS.map(n=>aList(n,st).length),[s.at?new Date(s.at).toISOString():''])})) ));
  const mx=$('#mexp');if(mx)mx.onclick=()=>saveFile('gsoc-missed-questions.csv',toCSV(rows.flatMap(({x},k)=>missCSV(Object.assign(blank(),x.st),nameFor(x),k===0))));
  const ax=$('#aexp');if(ax)ax.onclick=()=>saveFile('gsoc-trainee-answers.csv',rows.map(({x},k)=>{const c=recordCSV(Object.assign(blank(),x.st),nameFor(x));return k?c.split('\n').slice(1).join('\n'):c}).join('\n'));
  if(PICK)renderPick();
}
function mostMissedHTML(){
  const agg=new Map();
  (ROSTER||[]).forEach(x=>{const st=Object.assign(blank(),x.st);const seen=new Set();ADAYS.forEach(n=>aList(n,st).forEach(a=>a.it.forEach(([k,ids,sel,ok])=>{if(ok)return;let e=agg.get(k);if(!e){e={k,ids,people:0,total:0,days:new Set()};agg.set(k,e)}e.total++;e.days.add(n);if(!seen.has(k)){seen.add(k);e.people++}})))});
  const top=[...agg.values()].sort((a,b)=>b.people-a.people||b.total-a.total).slice(0,15);if(!top.length)return'';
  return `<h2>Most-missed assessment questions</h2><p class="small muted">Across every trainee on this roster. When several people miss the same question, check the module and the Field Manual page it points to before retraining anyone. The gap may be in the material.</p>
  <div class="tw"><table class="log"><thead><tr><th class="num">Trainees</th><th class="num">Times</th><th>Day</th><th>Source</th><th>Question</th><th>Correct answer</th><th>Reference</th></tr></thead><tbody>${top.map(e=>{const q=buildQ(e.k,e.ids);if(!q)return'';return `<tr><td class="num">${e.people}</td><td class="num">${e.total}</td><td class="mono small">${[...e.days].map(d=>'D'+pad2(d)).join(' ')}</td><td class="small mono">${esc(qWhereShort(q))}</td><td class="small">${esc(qText(q))}</td><td class="small good">${esc(ansText(q,okIds(q)))}</td><td class="small mono" style="font-size:10.5px">${esc(refShort(q.ref))}</td></tr>`}).join('')}</tbody></table></div>`}
let PICK_SO={},PICK_UNSUB=null,PICK_FOR=null;
function renderPick(scroll){

  const save=S;S=st;const days=PLAN.days.map(d=>({d,ds:dayStatus(d),has:ADAYS.includes(d.d),ps:passed(d.d),b:bestPct(d.d),tries:aList(d.d).length}));S=save;

  host.innerHTML=`<h2>${esc(pnm)} · ${st.profile&&st.profile.start?'started '+esc(fmtDay(st.profile.start)):'no start date yet'}</h2>
  <div class="btnrow" style="margin:0 0 14px"><button class="btn ghost sm" id="fixbtn">Correct name or start date</button></div><div id="fixform"></div>
  <h3>Day sign-off</h3><p class="small muted">Days 1 to 13 can be signed off once that day's end-of-day assessment is passed at ${MASTERY}%. Read the missed questions further down before you sign.</p><div class="tw"><table><thead><tr><th>Day</th><th>Title</th><th class="num">Progress</th><th>Assessment</th><th>Sign-off</th></tr></thead><tbody>${days.map(({d,ds,has,ps,b,tries})=>{const so=PICK_SO['d'+d.d];return `<tr><td class="mono">D${pad2(d.d)}</td><td>${esc(d.title)}</td><td class="num">${ds.tot?ds.done+'/'+ds.tot:'·'}</td><td>${!has?'<span class="muted small">Day 14 written test</span>':ps?`<span class="pill ok">Passed · ${b}%</span> <span class="small muted">${tries} tr${tries===1?'y':'ies'}</span>`:tries?`<span class="pill lo">Best ${b}%</span> <span class="small muted">${tries} tr${tries===1?'y':'ies'}</span>`:'<span class="muted small">Not taken</span>'}</td><td>${so?`<span class="pill ok">Signed ${fmtDate(so.at)}</span> <button class="btn ghost sm" data-un="${d.d}">Undo</button>`:has&&!ps?'<span class="small muted">Waits for a pass</span>':`<button class="btn sm" data-so="${d.d}">Sign off</button>`}</td></tr>`}).join('')}</tbody></table></div>
  <h3>End-of-day assessments</h3>${assessTable(st)}
  <h3>Missed questions log</h3>${missLogTable(st)}
  <h3>Modules</h3>${recordTable(st,'t'+x.id.replace(/[^a-z0-9]/gi,'')+'_')}
  <h3>Practice tests</h3>${st.tests.length?`<div class="tw"><table><thead><tr><th>When</th><th>Test</th><th class="num">Score</th></tr></thead><tbody>${st.tests.slice().reverse().map(t=>`<tr><td class="mono">${fmtDate(t.at)}</td><td>${t.kind==='full'?'Full':'Week 1'}</td><td class="num ${t.pct>=MASTERY?'good':'risk'}">${t.ok}/${t.n} · ${t.pct}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">None yet.</p>'}
  <div class="btnrow"><button class="btn ghost" id="pexp">Export this trainee (CSV)</button><button class="btn ghost" id="pmexp">Export missed questions (CSV)</button></div>`;
  bindRows(host);
  $('#fixbtn').onclick=()=>{$('#fixform').innerHTML=`<div class="card startcard"><div class="field"><label for="fx_name">Name</label><input id="fx_name" maxlength="80" value="${esc(st.profile&&st.profile.name||'')}"></div><div class="field" style="margin-top:10px"><label for="fx_date">Start date</label><input id="fx_date" type="date" value="${esc(st.profile&&st.profile.start||'')}"></div><p class="small risk" id="fx_msg" style="margin:8px 0 0"></p><div class="btnrow"><button class="btn sm" id="fx_save">Save correction</button><button class="btn ghost sm" id="fx_cancel">Cancel</button></div></div>`;
    $('#fx_cancel').onclick=()=>{$('#fixform').innerHTML=''};
    $('#fx_save').onclick=async()=>{const name=$('#fx_name').value.replace(/\s+/g,' ').trim(),start=$('#fx_date').value;if(name.length<2||!/^\d{4}-\d{2}-\d{2}$/.test(start)){$('#fx_msg').textContent='Enter a name and a start date.';return}
      const at=now();try{await SAVE.db.doc('signoffs/'+PICK).set(Object.assign({},PICK_SO,{profileFix:{name,start,at,by:SAVE.uid}}));
        try{await SAVE.db.doc('trainees/'+PICK).update({profile:{name,start,fixedAt:at}})}catch(e){}
        toast('Corrected. The trainee\u2019s record updates the next time their page is open.');$('#fixform').innerHTML=''}catch(e){$('#fx_msg').textContent='Couldn\u2019t save the correction. Check your access level.'}}};
  host.querySelectorAll('[data-so]').forEach(b=>b.onclick=async()=>{b.disabled=true;const next=Object.assign({},PICK_SO);next['d'+b.dataset.so]={at:now(),by:SAVE.uid};try{await SAVE.db.doc('signoffs/'+PICK).set(next);toast('Day '+b.dataset.so+' signed off')}catch(e){toast('Sign-off didn’t save. Check your access level.');b.disabled=false}});
  host.querySelectorAll('[data-un]').forEach(b=>b.onclick=async()=>{const next=Object.assign({},PICK_SO);delete next['d'+b.dataset.un];try{await SAVE.db.doc('signoffs/'+PICK).set(next)}catch(e){toast('Couldn’t undo the sign-off.')}});
  const slug=pnm.replace(/[^\w-]+/g,'-').toLowerCase()||'record';
  $('#pexp').onclick=()=>saveFile('gsoc-trainee-'+slug+'.csv',recordCSV(st,pnm));
  $('#pmexp').onclick=()=>saveFile('gsoc-missed-questions-'+slug+'.csv',toCSV(missCSV(st,pnm,true)));
  if(scroll)host.scrollIntoView({behavior:'smooth',block:'start'});
}
