LAB({
  id: "L2", title: "Fire at a UL-listed warehouse", sops: ["021", "023", "027", "010"], comp: "Alarm operations",
  brief: "Alarm queue, 0215. You're midway through a burglary at a retail site. The warehouse account is UL-listed.",
  start: "a", beats: {
    a: { t: "0215", s: "A fire signal lands from the warehouse, zone 3. It shows in the same color as the burglary you're working.", q: "What do you do?", o: [
      { t: "Read the event type. Fire is life safety, so it comes first.", r: 2, f: "Right. Read the event type, not the color. Life safety, then burglary.", n: "b" },
      { t: "Finish the burglary. It arrived first.", r: 0, f: "Oldest first applies within a band. Life safety outranks burglary.", n: "a2" } ] },
    a2: { t: "0219", s: "Four minutes later the fire signal is still waiting. You can't confirm the warehouse is safe.", q: "What should have happened, and what now?", o: [
      { t: "Move to the fire now, and if you're pinned, call Lead Orange.", r: 2, f: "Right. Can't confirm a life-safety site safe within three minutes? Calling Lead Orange is the standard.", n: "b" } ] },
    b: { t: "0216", s: "You open the fire event.", q: "First action?", o: [
      { t: "Dispatch fire on the local emergency number, with the complete address and every zone.", r: 2, f: "Right. Fire: dispatch first, assess after the call has started.", n: "c" },
      { t: "Assess every camera first to make sure it's real.", r: 0, f: "Fire is dispatch first. Assess after the call has started.", n: "c" },
      { t: "Send the site guard to check zone 3.", r: 0, f: "Guards are never the response to fire.", n: "c" } ] },
    c: { t: "0218", s: "Fire is dispatched. The account is UL-listed.", q: "What about the UL partner center?", o: [
      { t: "UL-listed accounts go to the UL partner center. Don't work the UL signal past the fire dispatch.", r: 2, f: "Right. A dispatchable fire gets dispatched first, then the UL routing.", n: "d" },
      { t: "Keep working the UL signal yourself to the end.", r: 0, f: "Don't work a UL signal past the fire dispatch.", n: "d" } ] },
    d: { t: "0222", s: "A second fire signal, zone 5, same building.", q: "Grace period? It's the same fire.", o: [
      { t: "No grace period. Call the agency again for this signal.", r: 2, f: "Right. No grace period for fire, however soon it follows. Call again for every further signal.", n: "e" },
      { t: "It's within grace. Log it and move on.", r: 0, f: "Grace periods never apply to fire.", n: "e" } ] },
    e: { t: "0235", s: "Cameras show no smoke. The premise line rings out. No one has called back.", q: "Can you close it as false?", o: [
      { t: "Yes. No smoke, nobody there.", r: 0, f: "Silence, no answer or no picture is never evidence of safety. None of these closes as false for that reason.", n: null },
      { t: "No. It stays open until the site is established safe or every required dispatch and contact step is done.", r: 2, f: "Right.", n: null } ] } },
  debrief: ["Read the event type, not the color. Life safety goes first.", "Fire: dispatch first, complete address and every zone, assess after.", "Call the agency again for every further signal. No grace period.", "UL-listed: dispatch the fire first, then the UL partner center.", "Guards never respond to fire. Silence is never safety."]
});

LAB({
  id: "L3", title: "The vendor at 0530", sops: ["022", "023", "025", "012"], comp: "Alarm operations",
  brief: "A store that opens at 0700. The panel is disarmed at 0530 by a code assigned to a refrigeration vendor.",
  start: "a", beats: {
    a: { t: "0530", s: "On camera, one person in a vendor jacket enters through the rear door. A second person follows close behind.", q: "What does a vendor entering a disarmed site get?", o: [
      { t: "The duress check.", r: 2, f: "Right. A vendor entering a disarmed site gets the duress check.", n: "b" },
      { t: "Nothing. The code is valid.", r: 0, f: "A valid code isn't proof of safety. Run the duress check.", n: "b" },
      { t: "A talk-down asking who the second person is.", r: 1, f: "Talk-down isn't the check. The duress check comes first.", n: "b" } ] },
    b: { t: "0532", s: "The duress check comes back with the duress response.", q: "First move?", o: [
      { t: "Dispatch immediately on the local emergency number.", r: 2, f: "Right. Duress: dispatch immediately.", n: "c" },
      { t: "Call the store to make sure it wasn't a mistake.", r: 0, f: "After duress, no call to the site until police secure it.", n: "c" } ] },
    c: { t: "0534", s: "A colleague says, “Let's talk down through the speakers. It might scare the second guy off.”", q: "Your call?", o: [
      { t: "No. Silence until police secure the site. Observe and update dispatch.", r: 2, f: "Right. No talk-down after a duress signal until police secure the site.", n: "d" },
      { t: "Try it. It might help.", r: 0, f: "Making your presence known could put the vendor in danger. Silence comes first.", n: "d" } ] },
    d: { t: "0545", s: "Police secure the site. The second person was detained. The client's duty manager calls for an update.", q: "What do they get?", o: [
      { t: "What's known, what isn't yet, what the GSOC did and what happens next. No speculation on cause or loss.", r: 2, f: "Right. The four-part Level 4 update.", n: "e" },
      { t: "Your view on whether the vendor was in on it.", r: 0, f: "Never speculate on cause, liability or loss, and never characterize intent.", n: "e" } ] },
    e: { t: "0600", s: "Writing the record.", q: "What else does this record need?", o: [
      { t: "A legal hold, since police responded and there's a detention.", r: 2, f: "Right. Apply it now, don't wait for formal notice.", n: null },
      { t: "Nothing extra.", r: 0, f: "A police response is grounds for a legal hold.", n: null } ] } },
  debrief: ["A vendor entering a disarmed site gets the duress check.", "Duress: dispatch immediately, then no contact with the site and no talk-down until police secure it.", "The client gets the four-part update, with no speculation.", "Police response means a legal hold."]
});

LAB({
  id: "L4", title: "The officer who went quiet", sops: ["010", "011", "008", "012"], comp: "Escalation judgment",
  brief: "Seasonal goods warehouse, 0226. One subject in a mask is wandering the trailer rows. No weapon observed. One unarmed officer on site.",
  start: "a", beats: {
    a: { t: "0226", s: "Verified, actionable, not life-safety. You dispatch.", q: "Which brief?", o: [
      { t: "“Trailer rows, west yard. One subject on foot, masked, heading north along row C. No weapon observed, that doesn't mean none is present. Forklift parked across row D. Read it back.”", r: 2, f: "Right. In order, the unknown said out loud, and a read-back.", n: "b" },
      { t: "“Someone's out by the trailers. Go have a look.”", r: 0, f: "No exact spot, subject count, weapon status, direction or hazards. The officer is walking in blind.", n: "b" } ] },
    b: { t: "0231", s: "The officer reports in at the trailer rows, then walks behind row D, out of every camera.", q: "What's your job now?", o: [
      { t: "Stay on live view, keep updating him on the subject's movement, and log each update with its time.", r: 2, f: "Right. You're his eyes on the wider scene.", n: "c" },
      { t: "Pick up the next alert in the queue while he handles it.", r: 0, f: "Stay on the live view and keep updating. Every update gets recorded.", n: "c" } ] },
    c: { t: "0241", s: "No report-back in the expected interval. You try his radio. Nothing. His phone rings out. The subject is off camera too.", q: "What level?", o: [
      { t: "Level 5, officer welfare. Local emergency dispatch now, Supervisor in parallel.", r: 2, f: "Right. No report-back and no answer is officer welfare, Level 5.", n: "d" },
      { t: "Level 2. Probably a dead radio.", r: 0, f: "An unanswered call isn't a discharged obligation, and this one is officer welfare.", n: "c2" },
      { t: "Send the officer from the next site to find him.", r: 0, f: "That makes another lone person the only response.", n: "c2" } ] },
    c2: { t: "0249", s: "Eight more minutes. Still nothing.", q: "Recover.", o: [
      { t: "Level 5 now. Local emergency dispatch, Supervisor in parallel, and record why it's later than it should have been.", r: 2, f: "Right.", n: "d" } ] },
    d: { t: "0242", s: "Dispatch asks what you know.", q: "Which is right?", o: [
      { t: "Address, location in the site, an unanswered officer last seen behind row D at 0231, one masked subject not visible, no weapon observed, and that you're a remote camera operator with a callback number.", r: 2, f: "Right.", n: "e" },
      { t: "“Our guard isn't answering, probably nothing.”", r: 0, f: "Plain language, yes. Minimizing, no. Give them what they need.", n: "e" } ] },
    e: { t: "0300", s: "Police find the officer. He's fine; he'd dropped his radio. The subject left.", q: "Looking back, was Level 5 a mistake?", o: [
      { t: "No. Nobody is criticized for escalating something that turned out less serious.", r: 2, f: "Right. Operators are held accountable for failing to escalate.", n: "f" },
      { t: "Yes. It wasted police time.", r: 0, f: "Over-escalation is recoverable. Under-escalation is not.", n: "f" } ] },
    f: { t: "0315", s: "Writing up the dispatch.", q: "What goes in?", o: [
      { t: "Dispatch details, every update, every unanswered attempt with its time, the escalation, and the outcome.", r: 2, f: "Right. The unanswered attempts are often the most important lines.", n: null },
      { t: "Just the outcome. He was fine.", r: 0, f: "Log every attempted contact, not only the ones that worked.", n: null } ] } },
  debrief: ["Brief in order and say what hasn't been established.", "Stay on the live view and keep updating.", "No report-back and no answer is officer welfare, Level 5.", "Never send another lone officer as the only response.", "Log every unanswered attempt. Nobody is criticized for escalating."]
});

LAB({
  id: "L5", title: "Lights out on the floor", sops: ["013", "008", "012", "014", "009"], comp: "Degraded operations",
  brief: "Plano floor, 0118. Eleven sites on your console.",
  start: "a", beats: {
    a: { t: "0118", s: "AURIX stops saving records. Two minutes later the dispatch channel drops.", q: "How bad is it?", o: [
      { t: "Critical. Level 4, degraded operations.", r: 2, f: "Right. Incident system and dispatch channel are both critical.", n: "b" },
      { t: "Minor. Ticket it.", r: 0, f: "Minor is one camera or a non-critical capability.", n: "b" },
      { t: "Significant. Level 2.", r: 1, f: "Close, but losing the incident system or dispatch channel is critical, Level 4.", n: "b" } ] },
    b: { t: "0121", s: "A verified intrusion lands at site 0412. You need to record it and dispatch.", q: "How do you record it?", o: [
      { t: "Manual log, every entry timed as it happens.", r: 2, f: "Right. Back-loaded later and marked reconstructed.", n: "c" },
      { t: "From memory once AURIX is back.", r: 0, f: "Contemporaneous entry is the standard, even on paper.", n: "c" } ] },
    c: { t: "0122", s: "The dispatch channel is still down.", q: "How do you reach the officer?", o: [
      { t: "Switch to the fallback, prove it works first, and tell the officers.", r: 2, f: "Right.", n: "d" },
      { t: "Email the officer the details.", r: 0, f: "Urgency is spoken, never emailed.", n: "d" } ] },
    d: { t: "0130", s: "The Supervisor asks what the client should be told.", q: "Which?", o: [
      { t: "Exactly what isn't monitored and since when, how records are being kept, and when the next update comes.", r: 2, f: "Right. Understating the impact is the worst option there is.", n: "e" },
      { t: "“Minor technical issue, all sites monitored.”", r: 0, f: "That's understating the impact.", n: "e" } ] },
    e: { t: "0140", s: "Building power fails. The Supervisor declares failover to Atlanta.", q: "How do your sites move?", o: [
      { t: "Site by site with named acceptance, every open incident with full status, and Plano stands down only when Atlanta confirms AURIX, the matrix and every feed.", r: 2, f: "Right. Target gap: zero minutes.", n: "f" },
      { t: "Log off. Atlanta's taking everything.", r: 0, f: "A gap during transfer is the failure the procedure exists to prevent.", n: "f" } ] },
    f: { t: "0300", s: "Systems are back. Your manual log has fourteen timed entries.", q: "How do they go into AURIX?", o: [
      { t: "With their original times, marked reconstructed.", r: 2, f: "Right.", n: null },
      { t: "Entered as if made live.", r: 0, f: "An unmarked reconstruction is a falsified record.", n: null } ] } },
  debrief: ["Incident system or dispatch channel down is critical, Level 4.", "Manual log, timed as it happens, marked reconstructed later.", "Prove the fallback works before you rely on it.", "Tell the client exactly what isn't monitored.", "Failover is site by site with named acceptance. Zero-minute gap."]
});

LAB({
  id: "L6", title: "Storm night", sops: ["027", "021", "023", "009"], comp: "Alarm operations",
  brief: "A storm line crosses three states. The alarm queue is climbing.",
  start: "a", beats: {
    a: { t: "2302", s: "Your queue: a burglary shown in red from 2251, an HPAD shown in yellow from 2259, a late-to-close from 2240.", q: "Which first?", o: [
      { t: "The HPAD. Read the type, not the color. Life safety first.", r: 2, f: "Right.", n: "b" },
      { t: "The late-to-close. It's oldest.", r: 0, f: "Oldest first only within a band. Life safety, then burglary, then secondary.", n: "b" },
      { t: "The burglary. It's red.", r: 0, f: "Some events arrive in the wrong color. Read the type.", n: "b" } ] },
    b: { t: "2306", s: "You're on the HPAD. Another life-safety signal lands and you can't confirm that site safe inside three minutes.", q: "What now?", o: [
      { t: "Call Lead Orange to the floor.", r: 2, f: "Right. Calling it is the standard. Level 2.", n: "c" },
      { t: "Push through on your own.", r: 0, f: "Not calling Lead Orange is the failure.", n: "c" } ] },
    c: { t: "2315", s: "Code Red is declared. You hold a fire, a panic, a medical, two burglaries and four trouble signals.", q: "Which is never shortened?", o: [
      { t: "The fire.", r: 2, f: "Right. Fire is never shortened.", n: "d" },
      { t: "The burglaries.", r: 0, f: "Medical and burglary get one call-list attempt and a short suspend.", n: "d" } ] },
    d: { t: "2320", s: "The four trouble signals.", q: "Code Red handling?", o: [
      { t: "Low-priority signals go on hold.", r: 2, f: "Right.", n: "e" },
      { t: "Close them. They're only trouble signals.", r: 0, f: "On hold, then finished afterward. Code Red never closes anything early.", n: "e" } ] },
    e: { t: "0110", s: "Code Red ends. Handover is at 0600.", q: "What's left?", o: [
      { t: "Finish every shortened event, and put Code Red status in the passdown.", r: 2, f: "Right. Code Red never ends without every shortened event completed.", n: null },
      { t: "Nothing. The storm's past.", r: 0, f: "Every shortened event gets finished.", n: null } ] } },
  debrief: ["Read the event type, not the color.", "Life safety, then burglary, then secondary. Oldest first within each band.", "Call Lead Orange when you're pinned on life safety for three minutes.", "Code Red: fire never shortened, panic dispatched then suspended, medical and burglary one attempt then short suspend, low priority on hold.", "Afterward: finish everything and put Code Red in the passdown."]
});

LAB({
  id: "L7", title: "Weapon or not", sops: ["007", "025", "010", "011"], comp: "Verification",
  brief: "Authorized talk-down site. Convenience store lot, 2350.",
  start: "a", beats: {
    a: { t: "2350", s: "Three people loiter by the ice machine after closing. One holds a long dark object down by his leg. You can't tell what it is.", q: "How do you record the object?", o: [
      { t: "“Elongated dark object, about arm's length, not identifiable from the view.”", r: 2, f: "Right. Describe, don't conclude.", n: "b" },
      { t: "“Armed with a bat or a rifle.”", r: 0, f: "You can't record a weapon unless it's clearly identifiable as one.", n: "b" } ] },
    b: { t: "2351", s: "You've assessed for 15 seconds across every camera. The object is still unclear. Nobody is threatening anyone.", q: "Talk down?", o: [
      { t: "It's authorized and nobody is endangered by it right now. Use the loitering script, describing them by clothing, location and behavior.", r: 2, f: "Right. Within the 10 to 30 second window.", n: "c" },
      { t: "Stay silent in case the object is a weapon.", r: 1, f: "Caution is reasonable, and when in doubt, don't. But an unidentified object with no threat isn't the weapon-present rule. Either choice gets logged with the reason.", n: "c" } ] },
    c: { t: "2352", s: "One of them turns. The object is a shotgun, clearly visible on two cameras. He points it toward the store door.", q: "What now?", o: [
      { t: "Stop talking. Observe only. Level 5 on the local emergency number now.", r: 2, f: "Right. Weapon present: silence, observe and report to police.", n: "d" },
      { t: "Raise your voice and order him to drop it.", r: 0, f: "Where a weapon is present, observe only.", n: "d" } ] },
    d: { t: "2353", s: "The site officer is inside the store.", q: "What does the officer get?", o: [
      { t: "A brief to stay inside and out of sight, with police engaged in parallel. He's not the response.", r: 2, f: "Right. An officer is never the only response to verified life-safety.", n: "e" },
      { t: "Sent out to confront them.", r: 0, f: "That makes him the sole response to an armed subject.", n: "e" } ] },
    e: { t: "2354", s: "Dispatch asks about weapons.", q: "Your answer?", o: [
      { t: "“One subject with a shotgun, clearly visible, pointed toward the store door. The other two, no weapon observed.”", r: 2, f: "Right. Now it's clearly identifiable, so you say it, and you keep the others' status honest.", n: null },
      { t: "“They're all armed.”", r: 0, f: "Only one weapon has been seen.", n: null } ] } },
  debrief: ["Describe what you can't identify. Name a weapon only when it's clearly identifiable.", "Talk-down needs authorization and a 10 to 30 second assessment.", "Weapon present: silence, observe and report to police.", "Officer is never the only response. Keep each subject's weapon status accurate."]
});

LAB({
  id: "L8", title: "HPAD at a non-interactive site", sops: ["023", "021", "010"], comp: "Alarm operations",
  brief: "Non-interactive site: no audio, no video. Calls and dispatch only. 0012.",
  start: "a", beats: {
    a: { t: "0012", s: "HPAD signal.", q: "What's the pattern?", o: [
      { t: "One premise call, then immediate dispatch, then a 20-minute suspend for disposition.", r: 2, f: "Right.", n: "b" },
      { t: "Assess cameras, talk down, then call.", r: 0, f: "A non-interactive site has neither. That's the interactive HPAD pattern.", n: "b" },
      { t: "Call the premise every three minutes until someone answers.", r: 0, f: "That's the follow-up on an interactive HPAD. Non-interactive is one call, then dispatch.", n: "b" } ] },
    b: { t: "0013", s: "The premise call rings out.", q: "Who do you dispatch?", o: [
      { t: "Police, on the local emergency number.", r: 2, f: "Right. Guards are never the response to HPAD.", n: "c" },
      { t: "The contracted guard service.", r: 0, f: "HPAD gets police.", n: "c" } ] },
    c: { t: "0033", s: "The 20-minute suspend ends. You need a disposition.", q: "Before the follow-up call to the site?", o: [
      { t: "Make a safe-to-call decision first.", r: 2, f: "Right. Before each follow-up.", n: "d" },
      { t: "Just call.", r: 0, f: "A call could put someone at risk. Decide whether it's safe first.", n: "d" } ] },
    d: { t: "0040", s: "Police report nobody at the site and nothing visible from outside.", q: "Close as false?", o: [
      { t: "No. None closes as false because nobody answered or nothing could be seen. Conclude only on established safety or completed steps.", r: 2, f: "Right.", n: null },
      { t: "Yes. Nothing's there.", r: 0, f: "Silence is never safety.", n: null } ] } },
  debrief: ["Non-interactive HPAD: one premise call, immediate dispatch, 20-minute suspend.", "Safe-to-call decision before each follow-up.", "Police, never guards.", "Nothing seen and nobody answering never closes it as false."]
});

ation. Displays, keyboard and mouse, headset or handset. Nothing blocking a monitor."}],"d:005:2":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 3","t":"Log in with your own credentials. Never shared or borrowed, not even for a forgotten password. That one goes to the Supervisor."}],"d:005:3":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 4","t":"Platform health. Every assigned site is live. Watch the timestamps move. A frozen feed looks normal and is the easiest one to miss."}],"d:005:4":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 5","t":"Test comms. Place a test call on the dispatch, floor and escalation channels. A lit indicator isn't a test."}],"d:005:5":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 6","t":"Escalation matrix. Every assigned site has entries, current dates and no gaps at any level."}],"d:005:6":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 7","t":"Read the passdown in full (SOP-GSOC-009): open incidents, watch sites, tech issues, zones on test, events on hold, temporary notes and schedules, and whether Code Red is in force."}],"d:005:7":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 8","t":"Open incidents. Know the status and next action of each one."}],"d:005:8":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 9","t":"Declare readiness to the Supervisor and record it with the time."}],"s:005:a":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 1","t":"Sign on. Record your arrival time and console assignment. Running late? Tell the Supervisor right away."}],"s:005:b":[{"p":8,"s":"005","c":"Control box","i":"","t":"You don't take the console until readiness is declared and recorded. Report a failed check before you declare. Never fix it silently, and never leave it for “when it gets quiet.”"}],"s:005:c":[{"p":8,"s":"005","c":"Before You Take the Console","i":"check 7","t":"Read the passdown in full (SOP-GSOC-009): open incidents, watch sites, tech issues, zones on test, events on hold, temporary notes and schedules, and whether Code Red is in force."}],"q:006:0":[{"p":9,"s":"006","c":"At the Console","i":"bullet 2","t":"Run patrol sweeps on cadence, high-criticality sites and vulnerable times first."}],"q:006:1":[{"p":9,"s":"006","c":"Escalate table","i":"row \"Loss at a high-criticality site (also triggers SOP-013)\"","t":"Loss at a high-criticality site (also triggers SOP-013): Level 2"}],"q:006:2":[{"p":9,"s":"006","c":"Never","i":"bullet 3","t":"Share what you saw on a feed outside the operational chain. That holds after you leave, too."}],"q:006:3":[{"p":9,"s":"006","c":"Control box","i":"","t":"An unattended console is an unmonitored client. Arrange coverage before you stand up: a verbal handover to a named operator, with both names and the time recorded."}],"q:006:4":[{"p":9,"s":"006","c":"At the Console","i":"bullet 8","t":"Take your scheduled breaks. They're a control, not a courtesy, and you don't skip them to clear a backlog. Break guidance is on the GSOC SharePoint page."}],"d:006:0":[{"p":9,"s":"006","c":"At the Console","i":"bullet 3","t":"Watch for what comes before an alert. Loitering, repeat passes, a vehicle parked with sight lines to an asset, activity at an odd hour for that site."}],"d:006:1":[{"p":9,"s":"006","c":"Never","i":"bullet 1","t":"Personal devices, personal media or non-work browsing at the console."}],"d:006:2":[{"p":9,"s":"006","c":"Never","i":"bullet 2","t":"Open a feed out of curiosity. Every access is logged."}],"d:006:3":[{"p":9,"s":"006","c":"At the Console","i":"bullet 6","t":"Tours run whenever you're not on an alarm. Outside escort hours, no more than two tours and two alarms open at once without recorded authorization."}],"d:006:4":[{"p":9,"s":"006","c":"At the Console","i":"bullet 9","t":"Tell the Supervisor if you're fatigued or impaired. That's a professional obligation, and it's treated as one."}],"d:006:5":[{"p":9,"s":"006","c":"Control box","i":"","t":"An unattended console is an unmonitored client. Arrange coverage before you stand up: a verbal handover to a named operator, with both names and the time recorded."}],"d:006:6":[{"p":9,"s":"006","c":"At the Console","i":"bullet 6","t":"Tours run whenever you're not on an alarm. Outside escort hours, no more than two tours and two alarms open at once without recorded authorization."}],"s:006:a":[{"p":9,"s":"006","c":"At the Console","i":"bullet 4","t":"Anything you spot yourself becomes a manually raised alert under SOP-GSOC-001. An observation without a record doesn't exist."}],"s:006:b":[{"p":9,"s":"006","c":"At the Console","i":"bullet 9","t":"Tell the Supervisor if you're fatigued or impaired. That's a professional obligation, and it's treated as one."},{"p":9,"s":"006","c":"Control box","i":"","t":"An unattended console is an unmonitored client. Arrange coverage before you stand up: a verbal handover to a named operator, with both names and the time recorded."}],"s:006:c":[{"p":9,"s":"006","c":"Control box","i":"","t":"An unattended console is an unmonitored client. Arrange coverage before you stand up: a verbal handover to a named operator, with both names and the time recorded."}],"q:007:0":[{"p":10,"s":"007","c":"Opening paragraph","i":"","t":"Verify facts, not assumptions. You can record that someone is carrying an object and describe it. You can't record a weapon unless it's clearly identifiable as one. That difference decides what responders are told."}],"q:007:1":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Unresolved\"","t":"Unresolved: Can't be classified from the view. It's a trigger, not a result: Level 2 for the Supervisor"}],"q:007:2":[{"p":10,"s":"007","c":"Never","i":"bullet 1","t":"Classify on a person's characteristics. Behavior only."},{"p":10,"s":"007","c":"Never","i":"bullet 2","t":"Ease off at a site with a false-alert history."}],"q:007:3":[{"p":10,"s":"007","c":"Never","i":"bullet 3","t":"Edit, crop, enhance or annotate source footage."}],"q:007:4":[{"p":10,"s":"007","c":"The Sequence","i":"step 5","t":"Retrieve recorded video from two minutes before the activation. Anything criminal in playback, act on it immediately."}],"q:007:5":[{"p":10,"s":"007","c":"Control box","i":"","t":"Inconclusive, and a life-safety outcome is plausible? Escalate as if it were life-safety. Over-escalation is recoverable. Under-escalation is not."}],"d:007:0":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Non-actionable\"","t":"Non-actionable: Environment, wildlife, weather, or authorized activity: Log and close with the specific cause"}],"d:007:1":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Actionable, not life-safety\"","t":"Actionable, not life-safety: Unauthorized presence or activity, no immediate threat: SOP-GSOC-010 dispatch"}],"d:007:2":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Actionable, life-safety\"","t":"Actionable, life-safety: Violence, weapon, fire, medical, person in distress: SOP-GSOC-011 now, alongside dispatch"}],"d:007:3":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Unresolved\"","t":"Unresolved: Can't be classified from the view. It's a trigger, not a result: Level 2 for the Supervisor"}],"d:007:4":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Actionable, life-safety\"","t":"Actionable, life-safety: Violence, weapon, fire, medical, person in distress: SOP-GSOC-011 now, alongside dispatch"}],"d:007:5":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Non-actionable\"","t":"Non-actionable: Environment, wildlife, weather, or authorized activity: Log and close with the specific cause"},{"p":10,"s":"007","c":"The Sequence","i":"step 6","t":"Does it match a documented legitimate pattern for this site at this hour?"}],"d:007:6":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Actionable, life-safety\"","t":"Actionable, life-safety: Violence, weapon, fire, medical, person in distress: SOP-GSOC-011 now, alongside dispatch"}],"s:007:a":[{"p":10,"s":"007","c":"The Sequence","i":"step 2","t":"Look at every available camera, not just the one that alerted. Wait for them all to display, then assess for at least 10 seconds."}],"s:007:b":[{"p":10,"s":"007","c":"Opening paragraph","i":"","t":"Verify facts, not assumptions. You can record that someone is carrying an object and describe it. You can't record a weapon unless it's clearly identifiable as one. That difference decides what responders are told."}],"s:007:c":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Actionable, life-safety\"","t":"Actionable, life-safety: Violence, weapon, fire, medical, person in distress: SOP-GSOC-011 now, alongside dispatch"}],"q:008:0":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 5 (Codes)","t":"Comment code 90: Authorities on site"}],"q:008:1":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 4","t":"Log what you didn't see, too, including when video failed to connect. Say where each fact came from: observed, reported by the officer, advised by the client, or inferred."}],"q:008:2":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 7","t":"Submit to the Supervisor within 30 minutes of the event concluding. No blank field without “not applicable” and a reason."}],"q:008:3":[{"p":11,"s":"008","c":"Control box","i":"first","t":"You don't close your own incident. Supervisor review before closure is never waived for a busy shift."}],"q:008:4":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 6","t":"Any hint of litigation, a claim or a police request, apply a legal hold now and tell the Supervisor."}],"d:008:0":[{"p":11,"s":"008","c":"Write This, Not This table","i":"row \"Two subjects entered the yard through the northeast gate at 02:14 and approached the equipment row.\"","t":"Two subjects entered the yard through the northeast gate at 02:14 and approached the equipment row.: A couple of guys broke in."}],"d:008:1":[{"p":11,"s":"008","c":"Never","i":"bullet 1","t":"Characterize intent, motive or state of mind, or record a personal opinion on anyone."}],"d:008:2":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 4","t":"Log what you didn't see, too, including when video failed to connect. Say where each fact came from: observed, reported by the officer, advised by the client, or inferred."}],"d:008:3":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 2","t":"Log every action as it happens, each with a full timestamp including the date. “Ten minutes later” is useless in evidence."}],"d:008:4":[{"p":11,"s":"008","c":"Never","i":"bullet 1","t":"Characterize intent, motive or state of mind, or record a personal opinion on anyone."}],"d:008:5":[{"p":11,"s":"008","c":"Write This, Not This table","i":"row \"Officer contacted 02:16, no answer. Second attempt 02:18, no answer. Escalated to Supervisor 02:19.\"","t":"Officer contacted 02:16, no answer. Second attempt 02:18, no answer. Escalated to Supervisor 02:19.: Couldn't reach the officer so escalated."}],"d:008:6":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 4","t":"Log what you didn't see, too, including when video failed to connect. Say where each fact came from: observed, reported by the officer, advised by the client, or inferred."}],"s:008:a":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 1","t":"Open it at acknowledgement: incident ID, site ID, alert time and acknowledgement time as separate values, source unit, alert type, your name, initial priority."}],"s:008:b":[{"p":11,"s":"008","c":"Control box","i":"second","t":"Code 90 goes in only when you see police arrive on live video. Never from an estimate or a dispatcher's word."}],"s:008:c":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 7","t":"Submit to the Supervisor within 30 minutes of the event concluding. No blank field without “not applicable” and a reason."}],"q:009:0":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 1","t":"Finish the passdown before the 30-minute overlap starts. Shift info, a summary of the shift, each open incident with its status, last action and next action, escalations raised, tech issues with ticket references, watch sites and why, priority actions, and anything promised to a client."}],"q:009:1":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 3","t":"Cameras back on their home presets. Nothing left disarmed unless the incoming Supervisor accepts it by name."}],"q:009:2":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 1","t":"Finish the passdown before the 30-minute overlap starts. Shift info, a summary of the shift, each open incident with its status, last action and next action, escalations raised, tech issues with ticket references, watch sites and why, priority actions, and anything promised to a client."},{"p":12,"s":"009","c":"Outgoing","i":"bullet 2","t":"Alarm items. Zones on test with come-off time and approving initials, events on hold with return times, temporary notes including any no-dispatch note, temporary schedules, unsecured-door holds, and whether Code Red is in force."}],"q:009:3":[{"p":12,"s":"009","c":"The Handover","i":"bullet 4","t":"Outgoing stays on the floor until acceptance is recorded. The Supervisor countersigns."}],"q:009:4":[{"p":12,"s":"009","c":"Control box","i":"","t":"No gap and no overlap of accountability. At every moment, exactly one named operator owns each console."}],"d:009:0":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 2","t":"Alarm items. Zones on test with come-off time and approving initials, events on hold with return times, temporary notes including any no-dispatch note, temporary schedules, unsecured-door holds, and whether Code Red is in force."}],"d:009:1":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 1","t":"Finish the passdown before the 30-minute overlap starts. Shift info, a summary of the shift, each open incident with its status, last action and next action, escalations raised, tech issues with ticket references, watch sites and why, priority actions, and anything promised to a client."}],"d:009:2":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 1","t":"Finish the passdown before the 30-minute overlap starts. Shift info, a summary of the shift, each open incident with its status, last action and next action, escalations raised, tech issues with ticket references, watch sites and why, priority actions, and anything promised to a client."}],"d:009:3":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 2","t":"Alarm items. Zones on test with come-off time and approving initials, events on hold with return times, temporary notes including any no-dispatch note, temporary schedules, unsecured-door holds, and whether Code Red is in force."}],"d:009:4":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 2","t":"Alarm items. Zones on test with come-off time and approving initials, events on hold with return times, temporary notes including any no-dispatch note, temporary schedules, unsecured-door holds, and whether Code Red is in force."}],"d:009:5":[{"p":12,"s":"009","c":"Outgoing","i":"bullet 1","t":"Finish the passdown before the 30-minute overlap starts. Shift info, a summary of the shift, each open incident with its status, last action and next action, escalations raised, tech issues with ticket references, watch sites and why, priority actions, and anything promised to a client."}],"s:009:a":[{"p":12,"s":"009","c":"If it isn't Complete","i":"bullet 1","t":"Incoming says so before accepting, and outgoing stays until it's fixed."}],"s:009:x":[{"p":12,"s":"009","c":"Know This","i":"bullet 2","t":"The real test of a handover: a follow-up missed across a shift boundary."}],"s:009:b":[{"p":12,"s":"009","c":"The Handover","i":"bullet 3","t":"Incoming runs their own readiness check (SOP-GSOC-005), then accepts by name and time. Accountability moves at that recorded acceptance, not at the roster boundary."}],"q:010:0":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."}],"q:010:1":[{"p":13,"s":"010","c":"Control box","i":"","t":"An officer is never sent into a verified life-safety situation as the only response. Emergency services are engaged in parallel under SOP-GSOC-011, not after the officer reports back."}],"q:010:2":[{"p":13,"s":"010","c":"Failed Dispatch table","i":"row \"No officer assigned to the site. Client decides\"","t":"No officer assigned to the site. Client decides: Level 4"}],"q:010:3":[{"p":13,"s":"010","c":"Alarm Sites","i":"bullet 1","t":"Contracted guard service and nobody at the site reachable? The guard service gets a welfare check request before police, unless you see direct criminal activity."}],"q:010:4":[{"p":13,"s":"010","c":"Dispatching","i":"step 5","t":"Get a read-back of the location and what's happening."}],"d:010:0":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."}],"d:010:1":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."}],"d:010:2":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."}],"d:010:3":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."}],"d:010:4":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."}],"d:010:5":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."}],"s:010:a":[{"p":13,"s":"010","c":"Dispatching","i":"step 2","t":"Call on the approved primary method. No answer? Go straight to the alternate. Don't sit through a second full ring cycle."}],"s:010:b":[{"p":13,"s":"010","c":"Dispatching","i":"step 3","t":"Brief in this order: site and exact spot, what's happening, how many subjects, any weapon or threat seen, direction of travel, hazards like animals, vehicles or conditions."},{"p":13,"s":"010","c":"Dispatching","i":"step 4","t":"Say what hasn't been established. “No weapon observed” isn't “no weapon present.” They need to know which one you mean."}],"s:010:c":[{"p":13,"s":"010","c":"Failed Dispatch table","i":"row \"No report-back in the expected interval, no answer. Officer welfare\"","t":"No report-back in the expected interval, no answer. Officer welfare: Level 5"}],"q:011:0":[{"p":14,"s":"011","c":"The box at the top of the page","i":"","t":"Never dial 911 for a monitored site. From the GSOC floor it reaches the wrong dispatch center. Call the site's local emergency dispatch number from the Program Annex. It's at your console with the address, primary and alternate."}],"q:011:1":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Who you are\"","t":"Who you are: A remote monitoring operator watching by camera, not someone on scene. Give a callback number that's answered for the whole incident."}],"q:011:2":[{"p":14,"s":"011","c":"During and After","i":"bullet 2","t":"Get the dispatcher ID, agency event number, arrival time and outcome. Close only when the dispatch is cleared. Apply a legal hold (SOP-GSOC-018). Level 6 for a fatality, serious injury or media."}],"q:011:3":[{"p":14,"s":"011","c":"During and After","i":"bullet 3","t":"Jurisdiction requirements take precedence, coded 92. Bypassing them needs recorded Supervisor approval."}],"q:011:4":[{"p":14,"s":"011","c":"Control box","i":"","t":"No operator is ever criticized for escalating an event that turned out less serious than it looked. Operators are held accountable for failing to escalate."}],"q:011:5":[{"p":14,"s":"011","c":"During and After","i":"bullet 2","t":"Get the dispatcher ID, agency event number, arrival time and outcome. Close only when the dispatch is cleared. Apply a legal hold (SOP-GSOC-018). Level 6 for a fatality, serious injury or media."}],"d:011:0":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Location\"","t":"Location: Full street address, city, state. Then where in the site, and the best way in for responders."}],"d:011:1":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Nature\"","t":"Nature: What's happening in plain language. No codes. HPAD means nothing outside the GSOC."}],"d:011:2":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Subjects\"","t":"Subjects: Number, objective description, where they are now, direction of travel."}],"d:011:3":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Weapons\"","t":"Weapons: Whether one has been seen. If not, say so out loud. Don't leave it unaddressed."}],"d:011:4":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Injuries\"","t":"Injuries: Whether anyone looks hurt, and how many."}],"d:011:5":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Who you are\"","t":"Who you are: A remote monitoring operator watching by camera, not someone on scene. Give a callback number that's answered for the whole incident."}],"s:011:a":[{"p":14,"s":"011","c":"The box at the top of the page","i":"","t":"Never dial 911 for a monitored site. From the GSOC floor it reaches the wrong dispatch center. Call the site's local emergency dispatch number from the Program Annex. It's at your console with the address, primary and alternate."}],"s:011:b":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Location\"","t":"Location: Full street address, city, state. Then where in the site, and the best way in for responders."}],"s:011:c":[{"p":14,"s":"011","c":"During and After","i":"bullet 1","t":"Stay on as long as the dispatcher needs you. Keep live updates coming and flag hazards responders can't see yet. Talk-down only if it won't raise risk. When in doubt, don't."}],"s:011:d":[{"p":14,"s":"011","c":"During and After","i":"bullet 2","t":"Get the dispatcher ID, agency event number, arrival time and outcome. Close only when the dispatch is cleared. Apply a legal hold (SOP-GSOC-018). Level 6 for a fatality, serious injury or media."}],"q:012:0":[{"p":15,"s":"012","c":"Channels table","i":"row \"Email\"","t":"Email: Non-urgent confirmations and reports: Anything urgent or life-safety, ever"}],"q:012:1":[{"p":15,"s":"012","c":"Control box","i":"second","t":"The GSOC reports, it doesn't direct. Never tell an RP, Key Holder, employee or vendor whether to respond, dispatch or cancel."}],"q:012:2":[{"p":15,"s":"012","c":"On Every Call","i":"bullet 4","t":"Client notification at Level 4. What's known, what isn't yet, what you did, what happens next. Never speculate on cause, liability or loss."}],"q:012:3":[{"p":15,"s":"012","c":"Never","i":"bullet 1","t":"Give media, insurers, attorneys or the public anything, not even whether an incident happened. Route to GSOC leadership and log the call."}],"q:012:4":[{"p":15,"s":"012","c":"Never","i":"bullet 2","t":"Share with client staff who aren't on the authorized list before an authorized contact verifies them. Never tell a site its monitoring is being discontinued."}],"d:012:0":[{"p":15,"s":"012","c":"Channels table","i":"row \"Dispatch channel\"","t":"Dispatch channel: Officer dispatch and live coordination: Anything not time-critical"}],"d:012:1":[{"p":15,"s":"012","c":"Channels table","i":"row \"Floor channel\"","t":"Floor channel: You to the GSOC Supervisor: Client detail, if it isn't access-controlled"}],"d:012:2":[{"p":15,"s":"012","c":"Channels table","i":"row \"Client escalation\"","t":"Client escalation: Level 4 notification per the Annex: Routine updates"}],"d:012:3":[{"p":15,"s":"012","c":"Channels table","i":"row \"AURIX (or Annex system)\"","t":"AURIX (or Annex system): The record of everything: Urgent, real-time communication"}],"d:012:4":[{"p":15,"s":"012","c":"Channels table","i":"row \"Email\"","t":"Email: Non-urgent confirmations and reports: Anything urgent or life-safety, ever"}],"d:012:5":[{"p":15,"s":"012","c":"Never","i":"bullet 1","t":"Give media, insurers, attorneys or the public anything, not even whether an incident happened. Route to GSOC leadership and log the call."}],"d:012:6":[{"p":15,"s":"012","c":"Never","i":"bullet 1","t":"Give media, insurers, attorneys or the public anything, not even whether an incident happened. Route to GSOC leadership and log the call."}],"s:012:a":[{"p":15,"s":"012","c":"On Every Call","i":"bullet 4","t":"Client notification at Level 4. What's known, what isn't yet, what you did, what happens next. Never speculate on cause, liability or loss."}],"s:012:b":[{"p":15,"s":"012","c":"Never","i":"bullet 2","t":"Share with client staff who aren't on the authorized list before an authorized contact verifies them. Never tell a site its monitoring is being discontinued."}],"s:012:c":[{"p":15,"s":"012","c":"Control box","i":"first","t":"Urgency never goes by a channel that doesn't guarantee an immediate human response. Time-critical is spoken, not written."},{"p":3,"s":"000","c":"Escalation Levels","i":"note under the table","t":"Can't complete an escalation? Contact unreachable or channel down, it goes one level up without delay. An unanswered call is not a discharged obligation."}],"q:013:0":[{"p":16,"s":"013","c":"Compensate","i":"bullet 3","t":"Zones. Check the zone number before placing it on test. The wrong zone leaves the faulty one live. Third dispatch to one location in 24 hours: the RP decides on further dispatch, and a service case gets raised."}],"q:013:1":[{"p":16,"s":"013","c":"Control box","i":"second","t":"A zone on test, a disabled zone and a no-dispatch note each take part of a site out of response. None applies without approving initials and an end time, a no-dispatch note also needs RP authorization by name, and each stays in the passdown until it's lifted."}],"q:013:2":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Significant\"","t":"Significant: A whole site dark, or a capability lost across sites: Level 2. Degraded ops. Client told"}],"q:013:3":[{"p":16,"s":"013","c":"Compensate","i":"bullet 2","t":"Workstation down: move to a spare console. Never share one."}],"q:013:4":[{"p":16,"s":"013","c":"Control box","i":"first","t":"The client is told what isn't being monitored as soon as it's known. Understating the impact is the worst option there is."}],"d:013:0":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Minor\"","t":"Minor: One camera or a non-critical capability. Site still mostly covered: Log, ticket, monitor. Gap goes in the passdown"}],"d:013:1":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Significant\"","t":"Significant: A whole site dark, or a capability lost across sites: Level 2. Degraded ops. Client told"}],"d:013:2":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Significant\"","t":"Significant: A whole site dark, or a capability lost across sites: Level 2. Degraded ops. Client told"}],"d:013:3":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Critical\"","t":"Critical: Incident system, dispatch channel, or several high-criticality sites: Level 4. Degraded ops. SOP-GSOC-014 if the floor is hit"}],"d:013:4":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Critical\"","t":"Critical: Incident system, dispatch channel, or several high-criticality sites: Level 4. Degraded ops. SOP-GSOC-014 if the floor is hit"}],"d:013:5":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Critical\"","t":"Critical: Incident system, dispatch channel, or several high-criticality sites: Level 4. Degraded ops. SOP-GSOC-014 if the floor is hit"}],"s:013:a":[{"p":16,"s":"013","c":"When Something Fails","i":"bullet 2","t":"Check a second site before calling it a single-site fault. Systemic faults often look local at first."}],"s:013:b":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Critical\"","t":"Critical: Incident system, dispatch channel, or several high-criticality sites: Level 4. Degraded ops. SOP-GSOC-014 if the floor is hit"}],"s:013:c":[{"p":16,"s":"013","c":"Control box","i":"first","t":"The client is told what isn't being monitored as soon as it's known. Understating the impact is the worst option there is."}],"s:013:d":[{"p":16,"s":"013","c":"Compensate","i":"bullet 1","t":"Incident system down: manual log, every entry timed as it happens, back-loaded later and marked reconstructed."}],"q:014:0":[{"p":17,"s":"014","c":"Opening paragraph","i":"","t":"Keep monitoring when the primary floor in Plano is impaired or gone. Atlanta is the failover. A GSOC that stops when its own building has a problem hasn't delivered continuous monitoring."}],"q:014:1":[{"p":17,"s":"014","c":"Going to Failover","i":"step 1","t":"The GSOC Supervisor or GSOC leadership declares it and records the time and reason. Typical triggers are power, network, evacuation, severe weather, or not enough staff."}],"q:014:2":[{"p":17,"s":"014","c":"In Failover, and Coming Back","i":"bullet 1","t":"Every procedure applies unchanged. Location changes, the standard doesn't. Anything reduced gets managed as degraded operations under SOP-GSOC-013."}],"q:014:3":[{"p":17,"s":"014","c":"Going to Failover","i":"step 3","t":"The client is notified at Level 4 with the expected duration. Officers are told about any change to the dispatch channel."}],"q:014:4":[{"p":17,"s":"014","c":"In Failover, and Coming Back","i":"bullet 2","t":"Before returning, check every system on the primary floor, not only the one that failed. Hand back site by site, then tell the client."}],"d:014:0":[{"p":17,"s":"014","c":"Going to Failover","i":"step 1","t":"The GSOC Supervisor or GSOC leadership declares it and records the time and reason. Typical triggers are power, network, evacuation, severe weather, or not enough staff."}],"d:014:1":[{"p":17,"s":"014","c":"Going to Failover","i":"step 2","t":"The failover floor confirms it has capacity and certified operators."}],"d:014:2":[{"p":17,"s":"014","c":"Going to Failover","i":"step 3","t":"The client is notified at Level 4 with the expected duration. Officers are told about any change to the dispatch channel."}],"d:014:3":[{"p":17,"s":"014","c":"Going to Failover","i":"step 4","t":"Transfer site by site with named acceptance, to the SOP-GSOC-009 standard. Urgency is exactly when handover discipline gets dropped, and when dropping it costs the most."}],"d:014:4":[{"p":17,"s":"014","c":"Going to Failover","i":"step 5","t":"Every open incident moves with its full status."}],"d:014:5":[{"p":17,"s":"014","c":"Going to Failover","i":"step 6","t":"The failover floor confirms access to AURIX, the matrix and every feed before the primary stands down. Record the exact moment each site moves."}],"s:014:a":[{"p":17,"s":"014","c":"Going to Failover","i":"step 4","t":"Transfer site by site with named acceptance, to the SOP-GSOC-009 standard. Urgency is exactly when handover discipline gets dropped, and when dropping it costs the most."}],"s:014:b":[{"p":17,"s":"014","c":"Going to Failover","i":"step 5","t":"Every open incident moves with its full status."}],"s:014:c":[{"p":17,"s":"014","c":"Going to Failover","i":"step 6","t":"The failover floor confirms access to AURIX, the matrix and every feed before the primary stands down. Record the exact moment each site moves."}],"q:015:0":[{"p":18,"s":"015","c":"Opening paragraph","i":"","t":"Independent proof that procedures get followed in practice, turned into corrective action instead of a report nobody reads. The GSOC Supervisor runs QA."}],"q:015:1":[{"p":18,"s":"015","c":"Know This","i":"bullet 2","t":"Critical control failures go to the SOP Lead and GSOC leadership within one shift."}],"q:015:2":[{"p":18,"s":"015","c":"What Gets Looked At","i":"bullet 1","t":"A random sample across every operator, every shift and every day of the week. Weekends and overnights are included on purpose."}],"q:015:3":[{"p":18,"s":"015","c":"What They Check table","i":"row \"Alarm events\"","t":"Alarm events: QC done where required, resolution code fits the evidence, grace in window, passcode verified, code 90 backed by video"}],"q:015:4":[{"p":18,"s":"015","c":"What Gets Looked At","i":"bullet 3","t":"Sites with a false-alert history get sampled to catch complacency."}],"d:015:0":[{"p":18,"s":"015","c":"What Gets Looked At","i":"bullet 1","t":"A random sample across every operator, every shift and every day of the week. Weekends and overnights are included on purpose."}],"d:015:1":[{"p":18,"s":"015","c":"What Gets Looked At","i":"bullet 2","t":"Everything, not a sample, for these: Level 5 and 6 events, false-alert dispatches, failed dispatches, degraded-ops periods, Code Red periods and abbreviated events, VM and VU resolutions, no-dispatch notes, and zones on test past four hours."}],"d:015:2":[{"p":18,"s":"015","c":"What Gets Looked At","i":"bullet 2","t":"Everything, not a sample, for these: Level 5 and 6 events, false-alert dispatches, failed dispatches, degraded-ops periods, Code Red periods and abbreviated events, VM and VU resolutions, no-dispatch notes, and zones on test past four hours."}],"d:015:3":[{"p":18,"s":"015","c":"What Gets Looked At","i":"bullet 2","t":"Everything, not a sample, for these: Level 5 and 6 events, false-alert dispatches, failed dispatches, degraded-ops periods, Code Red periods and abbreviated events, VM and VU resolutions, n e unnecessary. That's the right outcome, and the debrief says so."}],"q:017:1":[{"p":20,"s":"017","c":"What to Expect","i":"bullet 1","t":"You're assessed on what you do, not on what you can recite. Scenarios count for more than classroom time."}],"q:017:2":[{"p":20,"s":"017","c":"What to Expect","i":"bullet 4","t":"Refreshers come on a cycle, with targeted training after a manual revision, a platform change or a new program."}],"q:017:3":[{"p":20,"s":"017","c":"What to Expect","i":"bullet 3","t":"Unannounced exercises run on the live floor, Code Red drills included. Where alarms are in scope there are eight more Part G modules."}],"d:017:0":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Foundations\"","t":"Foundations: The GSOC role, this manual, escalation levels, conduct, confidentiality: Written"}],"d:017:1":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Platform operation\"","t":"Platform operation: Console, camera control, recorded review, alerts, incident system: Practical"}],"d:017:2":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Verification\"","t":"Verification: Observation, objective description, classification, bias controls: Scenario"}],"d:017:3":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Escalation judgment\"","t":"Escalation judgment: Level, timing, parallel notification, escalate when in doubt: Scenario"}],"d:017:4":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Documentation\"","t":"Documentation: Narrative standard, contemporaneity, evidence handling: Work sample"}],"d:017:5":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Communications\"","t":"Communications: Dispatch briefs, read-back, client calls, local emergency dispatch: Role-play"}],"d:017:6":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Degraded operations\"","t":"Degraded operations: Fault recognition, compensating measures, manual logging: Scenario"}],"d:017:7":[{"p":20,"s":"017","c":"Core Curriculum table","i":"row \"Program specifics\"","t":"Program specifics: The Annex: sites, contacts, thresholds, jurisdictions, categories: Written"}],"s:017:a":[{"p":20,"s":"017","c":"What to Expect","i":"bullet 3","t":"Unannounced exercises run on the live floor, Code Red drills included. Where alarms are in scope there are eight more Part G modules."}],"s:017:b":[{"p":20,"s":"017","c":"What to Expect","i":"bullet 2","t":"Every scenario set includes a life-safety event, a judgment call and a degraded-ops event. Some are built so escalating turns out to be unnecessary. That's the right outcome, and the debrief says so."}],"q:018:0":[{"p":21,"s":"018","c":"At the Console","i":"bullet 2","t":"At capture, record what was captured, by whom, from which source, covering which time, and when."}],"q:018:1":[{"p":21,"s":"018","c":"At the Console","i":"bullet 3","t":"Preserve the original. Never edit, enhance, crop or annotate source material. Work on copies, and mark every copy as a copy."}],"q:018:2":[{"p":21,"s":"018","c":"At the Console","i":"bullet 9","t":"What you tell responders during a live emergency falls under SOP-GSOC-011, not this page."}],"q:018:3":[{"p":21,"s":"018","c":"At the Console","i":"bullet 7","t":"Sending video, audio or stills to authorities outside a live emergency also needs RP permission, recorded by name."}],"d:018:0":[{"p":21,"s":"018","c":"Record Classes","i":"bullet 1","t":"Operational: incidents, logs, passdowns, checklists."}],"d:018:1":[{"p":21,"s":"018","c":"Record Classes","i":"bullet 1","t":"Operational: incidents, logs, passdowns, checklists."}],"d:018:2":[{"p":21,"s":"018","c":"Record Classes","i":"bullet 2","t":"Evidence: video, images, audio, clips."}],"d:018:3":[{"p":21,"s":"018","c":"Record Classes","i":"bullet 2","t":"Evidence: video, images, audio, clips."}],"d:018:4":[{"p":21,"s":"018","c":"Record Classes","i":"bullet 1","t":"Operational: incidents, logs, passdowns, checklists."}],"d:018:5":[{"p":21,"s":"018","c":"Record Classes","i":"bullet 3","t":"Assurance, governance and personnel records too."}],"d:018:6":[{"p":21,"s":"018","c":"Record Classes","i":"bullet 3","t":"Assurance, governance and personnel records too."}],"s:018:a":[{"p":21,"s":"018","c":"At the Console","i":"bullet 6","t":"External requests for records, police included outside a live emergency, go to GSOC leadership. You don't release anything yourself."}],"s:018:b":[{"p":21,"s":"018","c":"At the Console","i":"bullet 5","t":"Legal hold goes on immediately at any sign of litigation, a claim, regulatory action or a police request. Don't wait for formal notice. A hold stops all routine deletion."}],"s:018:c":[{"p":21,"s":"018","c":"Control box","i":"","t":"Every touch of evidence is logged. Unlogged access looks like tampering once it's challenged, and you won't be believed just because you were acting properly."}],"q:019:0":[{"p":22,"s":"019","c":"Know Which State you're Looking At table","i":"row \"Disarmed\"","t":"Disarmed: Online but not alerting: Only with recorded Supervisor authorization. A gap for its whole duration"}],"q:019:1":[{"p":22,"s":"019","c":"Control box","i":"","t":"A unit that isn't alerting isn't monitoring. Frozen, offline and disarmed are all coverage gaps, each with a start time and an end time."}],"q:019:2":[{"p":22,"s":"019","c":"Escalate table","i":"row \"Platform outage, or suspected unauthorized access\"","t":"Platform outage, or suspected unauthorized access: Level 4"}],"q:019:3":[{"p":22,"s":"019","c":"Not Yours to Do","i":"bullet 1","t":"Disarm a unit, or change a saved camera preset."}],"q:019:4":[{"p":22,"s":"019","c":"Opening paragraph","i":"","t":"Running the LiveView Technologies platform itself. LVT shows you what happened. The incident record is what happened. Program values are in GSOC-ANX-PLT-LVT-001."}],"d:019:0":[{"p":22,"s":"019","c":"Working An Event","i":"step 1","t":"Acknowledge. It takes ownership and starts your clock. It resolves nothing. Then open the incident record, before you verify."}],"d l box","i":"first","t":"A Quality Check never delays a dispatch on criminal activity."}],"q:023:0":[{"p":25,"s":"023","c":"Control box","i":"first","t":"Everything here enters at Level 5. No grace period applies, and none is closed as false because nobody answered or nothing could be seen."}],"q:023:1":[{"p":25,"s":"023","c":"By Signal","i":"bullet 6","t":"Medical and gas. No passcode needed. Both are life-safety."}],"q:023:2":[{"p":25,"s":"023","c":"Control box","i":"first","t":"Everything here enters at Level 5. No grace period applies, and none is closed as false because nobody answered or nothing could be seen."}],"q:023:3":[{"p":25,"s":"023","c":"By Signal","i":"bullet 1","t":"Fire. Dispatch first. Give the complete address and every zone. Assess after the call has started. Call the agency again for every further signal."}],"q:023:4":[{"p":25,"s":"023","c":"By Signal","i":"bullet 8","t":"Fire marshal tests. A missed signal or the wrong location fails the inspection."}],"d:023:0":[{"p":25,"s":"023","c":"By Signal","i":"bullet 1","t":"Fire. Dispatch first. Give the complete address and every zone. Assess after the call has started. Call the agency again for every further signal."}],"d:023:1":[{"p":25,"s":"023","c":"By Signal","i":"bullet 1","t":"Fire. Dispatch first. Give the complete address and every zone. Assess after the call has started. Call the agency again for every further signal."}],"d:023:2":[{"p":25,"s":"023","c":"By Signal","i":"bullet 3","t":"Duress. Dispatch immediately. Then stop all contact with the site until police secure it."}],"d:023:3":[{"p":25,"s":"023","c":"By Signal","i":"bullet 4","t":"HPAD, non-interactive site. One premise call, then immediate dispatch, then a 20-minute suspend for disposition. Make a safe-to-call decision before each follow-up."}],"d:023:4":[{"p":25,"s":"023","c":"By Signal","i":"bullet 2","t":"HPAD, interactive site. Assess, talk down, call the premise, and dispatch if you can't establish safety. Then keep trying eve :[{"p":29,"s":"027","c":"The Queue","i":"bullet 4","t":"Order: life safety, then burglary, then secondary signals and tours. Oldest first within each band."}],"d:027:5":[{"p":29,"s":"027","c":"The Queue","i":"bullet 4","t":"Order: life safety, then burglary, then secondary signals and tours. Oldest first within each band."}],"s:027:a":[{"p":29,"s":"027","c":"The Lead Orange box","i":"under The Queue","t":"Can't confirm a life-safety site is safe within three minutes because you're on another event? Call Lead Orange to the floor. Calling it is the standard. Not calling it is the failure."}],"s:027:b":[{"p":29,"s":"027","c":"Code Red: Emergency Alarms Outnumber Operators","i":"bullet 1","t":"Fire is never shortened."}],"s:027:c":[{"p":29,"s":"027","c":"Code Red: Emergency Alarms Outnumber Operators","i":"bullet 2","t":"Panic: dispatch, then suspend."}],"s:027:d":[{"p":29,"s":"027","c":"Code Red: Emergency Alarms Outnumber Operators","i":"bullet 6","t":"Afterward, every shortened event gets finished. Code Red status goes in the passdown."}],"l:L1:a":[{"p":4,"s":"001","c":"The Chain","i":"step 1","t":"Acknowledge and triage. Hit the committed acknowledgement time. Open the record right away with timestamp, site ID, source unit, alert type and your name. The clock starts at acknowledgement."}],"l:L1:b":[{"p":10,"s":"007","c":"Default Classification table","i":"row \"Actionable, life-safety\"","t":"Actionable, life-safety: Violence, weapon, fire, medical, person in distress: SOP-GSOC-011 now, alongside dispatch"}],"l:L1:b2":[{"p":14,"s":"011","c":"The box at the top of the page","i":"","t":"Never dial 911 for a monitored site. From the GSOC floor it reaches the wrong dispatch center. Call the site's local emergency dispatch number from the Program Annex. It's at your console with the address, primary and alternate."}],"l:L1:d":[{"p":14,"s":"011","c":"The box at the top of the page","i":"","t":"Never dial 911 for a monitored site. From the GSOC floor it reaches the wrong dispatch center. Call the site's local emergency dispatch number from the Program Annex. It's at your console with the address, primary and alternate."}],"l:L1:d2":[{"p":14,"s":"011","c":"The box at the top of the page","i":"","t":"Never dial 911 for a monitored site. From the GSOC floor it reaches the wrong dispatch center. Call the site's local emergency dispatch number from the Program Annex. It's at your console with the address, primary and alternate."}],"l:L1:e":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Location\"","t":"Location: Full street address, city, state. Then where in the site, and the best way in for responders."}],"l:L1:f":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Weapons\"","t":"Weapons: Whether one has been seen. If not, say so out loud. Don't leave it unaddressed."}],"l:L1:g":[{"p":14,"s":"011","c":"Immediate Action","i":"bullet 2","t":"Notify the Supervisor and the client contact in parallel, using a second operator or channel where you can."}],"l:L1:h":[{"p":11,"s":"008","c":"Control box","i":"second","t":"Code 90 goes in only when you see police arrive on live video. Never from an estimate or a dispatcher's word."}],"l:L1:i":[{"p":14,"s":"011","c":"During and After","i":"bullet 2","t":"Get the dispatcher ID, agency event number, arrival time and outcome. Close only when the dispatch is cleared. Apply a legal hold (SOP-GSOC-018). Level 6 for a fatality, serious injury or media."}],"l:L2:a":[{"p":29,"s":"027","c":"The Queue","i":"bullet 3","t":"Read the event type, not the color. Platform limits mean some events arrive in the wrong color."}],"l:L2:a2":[{"p":29,"s":"027","c":"The Lead Orange box","i":"under The Queue","t":"Can't confirm a life-safety site is safe within three minutes because you're on another event? Call Lead Orange to the floor. Calling it is the standard. Not calling it is the failure."}],"l:L2:b":[{"p":25,"s":"023","c":"By Signal","i":"bullet 1","t":"Fire. Dispatch first. Give the complete address and every zone. Assess after the call has started. Call the agency again for every further signal."}],"l:L2:c":[{"p":23,"s":"021","c":"The Rules","i":"bullet 6","t":"UL-listed accounts go to the UL partner center. A dispatchable fire gets dispatched first."}],"l:L2:d":[{"p":23,"s":"021","c":"Control box","i":"second","t":"No grace period for fire, HPAD, medical or gas, however soon it follows the last one. Don't work a UL signal past the fire dispatch."}],"l:L2:e":[{"p":23,"s":"021","c":"Control box","i":"first","t":"An event isn't concluded until you've established the site is safe and secure, or finished the required dispatch and contact steps. Silence, no answer or no picture is never evidence of safety."}],"l:L3:a":[{"p":24,"s":"022","c":"The Standards","i":"bullet 6","t":"A vendor entering a disarmed site gets the duress check."}],"l:L3:b":[{"p":25,"s":"023","c":"The box at the top of the page","i":"","t":"Never dial 911. Use the site's local emergency dispatch number from the Annex, every time."}],"l:L3:c":[{"p":27,"s":"025","c":"The box at the top of the page","i":"","t":"Silence comes first. No talk-down where a weapon is present, where a victim is involved, or after a duress signal until police secure the site."}],"l:L3:d":[{"p":15,"s":"012","c":"On Every Call","i":"bullet 4","t":"Client notification at Level 4. What's known, what isn't yet, what you did, what happens next. Never speculate on cause, liability or loss."}],"l:L3:e":[{"p":21,"s":"018","c":"At the Console","i":"bullet 5","t":"Legal hold goes on immediately at any sign of litigation, a claim, regulatory action or a police request. Don't wait for formal notice. A hold stops all routine deletion."}],"l:L4:a":[{"p":13,"s":"010","c":"Dispatching","i":"step 4","t":"Say what hasn't been established. “No weapon observed” isn't “no weapon present.” They need to know which one you mean."}],"l:L4:b":[{"p":13,"s":"010","c":"Dispatching","i":"step 6","t":"Stay on the live view and keep updating them on movement. You're their eyes on the wider scene. Talk-down only where it's authorized for that site."}],"l:L4:c":[{"p":13,"s":"010","c":"Failed Dispatch table","i":"row \"No report-back in the expected interval, no answer. Officer welfare\"","t":"No report-back in the expected interval, no answer. Officer welfare: Level 5"}],"l:L4:c2":[{"p":13,"s":"010","c":"Failed Dispatch table","i":"row \"No report-back in the expected interval, no answer. Officer welfare\"","t":"No report-back in the expected interval, no answer. Officer welfare: Level 5"}],"l:L4:d":[{"p":14,"s":"011","c":"What to Say table","i":"row \"Location\"","t":"Location: Full street address, city, state. Then where in the site, and the best way in for responders."},{"p":14,"s":"011","c":"What to Say table","i":"row \"Who you are\"","t":"Who you are: A remote monitoring operator watching by camera, not someone on scene. Give a callback number that's answered for the whole incident."}],"l:L4:e":[{"p":14,"s":"011","c":"Control box","i":"","t":"No operator is ever criticized for escalating an event that turned out less serious than it looked. Operators are held accountable for failing to escalate."}],"l:L4:f":[{"p":11,"s":"008","c":"Writing the Record","i":"bullet 3","t":"Log every attempted contact, not only the ones that worked. An unanswered call at 02:14 is often the most important line in the record."}],"l:L5:a":[{"p":16,"s":"013","c":"How Bad Is it table","i":"row \"Critical\"","t":"Critical: Incident system, dispatch channel, or several high-criticality sites: Level 4. Degraded ops. SOP-GSOC-014 if the floor is hit"}],"l:L5:b":[{"p":16,"s":"013","c":"Compensate","i":"bullet 1","t":"Incident system down: manual log, every entry timed as it happens, back-loaded later and marked reconstructed."}],"l:L5:c":[{"p":16,"s":"013","c":"Compensate","i":"bullet 2","t":"Dispatch channel down: switch to the fallback, prove it works first, tell the officers."}],"l:L5:d":[{"p":16,"s":"013","c":"Control box","i":"first","t":"The client is told what isn't being monitored as soon as it's known. Understating the impact is the worst option there is."}],"l:L5:e":[{"p":17,"s":"014","c":"Going to Failover","i":"step 4","t":"Transfer site by site with named acceptance, to the SOP-GSOC-009 standard. Urgency is exactly when handover discipline gets dropped, and when dropping it costs the most."},{"p":17,"s":"014","c":"Going to Failover","i":"step 6","t":"The failover floor confirms access to AURIX, the matrix and every feed before the primary stands down. Record the exact moment each site moves."}],"l:L5:f":[{"p":16,"s":"013","c":"Compensate","i":"bullet 1","t":"Incident system down: manual log, every entry timed as it happens, back-loaded later and marked reconstructed."}],"l:L6:a":[{"p":29,"s":"027","c":"The Queue","i":"bullet 3","t":"Read the event type, not the color. Platform limits mean some events arrive in the wrong color."}],"l:L6:b":[{"p":29,"s":"027","c":"The Lead Orange box","i":"under The Queue","t":"Can't confirm a life-safety site is safe within three minutes because you're on another event? Call Lead Orange to the floor. Calling it is the standard. Not calling it is the failure."}],"l:L6:c":[{"p":29,"s":"027","c":"Code Red: Emergency Alarms Outnumber Operators","i":"bullet 1","t":"Fire is never shortened."}],"l:L6:d":[{"p":29,"s":"027","c":"Code Red: Emergency Alarms Outnumber Operators","i":"bullet 4","t":"Low-priority signals go on hold."}],"l:L6:e":[{"p":29,"s":"027","c":"Code Red: Emergency Alarms Outnumber Operators","i":"bullet 6","t":"Afterward, every shortened event gets finished. Code Red status goes in the passdown."}],"l:L7:a":[{"p":10,"s":"007","c":"Opening paragraph","i":"","t":"Verify facts, not assumptions. You can record that someone is carrying an object and describe it. You can't record a weapon unless it's clearly identifiable as one. That difference decides what responders are told."}],"l:L7:b":[{"p":27,"s":"025","c":"Doing it Right","i":"bullet 2","t":"Assessment window. Wait for every camera to populate, then assess for at least 10 and no more than 30 seconds before you speak, unless immediate dispatch is justified."}],"l:L7:c":[{"p":27,"s":"025","c":"Control box","i":"","t":"Where a weapon is present, or anyone would be endangered by the GSOC making its presence known, observe only and report to police."}],"l:L7:d":[{"p":13,"s":"010","c":"Control box","i":"","t":"An officer is never sent into a verified life-safety situation as the only response. Emergency services are engaged in parallel under SOP-GSOC-011, not after the officer reports back."}],"l:L7:e":[{"p":10,"s":"007","c":"Opening paragraph","i":"","t":"Verify facts, not assumptions. You can record that someone is carrying an object and describe it. You can't record a weapon unless it's clearly identifiable as one. That difference decides what responders are told."}],"l:L8:a":[{"p":25,"s":"023","c":"By Signal","i":"bullet 4","t":"HPAD, non-interactive site. One premise call, then immediate dispatch, then a 20-minute suspend for disposition. Make a safe-to-call decision before each follow-up."}],"l:L8:b":[{"p":25,"s":"023","c":"By Signal","i":"bullet 7","t":"Guards are never the response to HPAD or fire. Those get police or fire."}],"l:L8:c":[{"p":25,"s":"023","c":"By Signal","i":"bullet 4","t":"HPAD, non-interactive site. One premise call, then immediate dispatch, then a 20-minute suspend for disposition. Make a safe-to-call decision before each follow-up."}],"l:L8:d":[{"p":25,"s":"023","c":"Control box","i":"first","t":"Everything here enters at Level 5. No grace period applies, and none is closed as false because nobody answered or nothing could be seen."}]};
